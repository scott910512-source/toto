<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>또또 슬라이드쇼 · 미리보기</title>
<style>
  :root{
    --accent:#7dd3c0;
    --glass:rgba(255,255,255,.10);
    --glass-br:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff}

  .stage{position:fixed;inset:0;overflow:hidden;background:#000}

  /* 레터박스를 같은 사진의 흐릿한 확대본으로 채운다 (가로모드 핵심) */
  .backdrop{position:absolute;inset:-8%;background-size:cover;background-position:center;
    filter:blur(52px) saturate(1.5) brightness(.40);transform:scale(1.12);transition:background-image .9s ease}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%)}

  .photo-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0}
  .photo{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:3px;
    box-shadow:0 24px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.10)}
  .photo.fill{width:100%;height:100%;object-fit:cover;border-radius:0;box-shadow:none}
  .photo.enter{animation:kb 14s ease-out both, fade 1.1s ease both}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.055)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ── UI 레이어 ── */
  .ui{position:absolute;inset:0;pointer-events:none;transition:opacity .45s ease}
  .ui.hide{opacity:0}
  .ui > *{pointer-events:auto}

  /* 좌하단 정보 */
  .meta{position:absolute;left:40px;bottom:38px;max-width:32%;
    text-shadow:0 2px 20px rgba(0,0,0,.85)}
  .meta .cap{font-size:25px;font-weight:300;letter-spacing:-.02em;line-height:1.3;margin:0 0 9px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta .sub{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.62);font-weight:400}
  .meta .dday{background:rgba(125,211,192,.18);border:1px solid rgba(125,211,192,.35);color:#a7ede0;
    padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.02em}

  /* 우상단 카운터 */
  .counter{position:absolute;top:32px;right:36px;display:flex;align-items:center;gap:14px}
  .count-txt{font-size:13px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .ring{width:34px;height:34px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:2.5;stroke-linecap:round}
  .ring .bg{stroke:rgba(255,255,255,.16)}
  .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .25s linear}

  /* 하단 중앙 글래스 컨트롤 바 */
  .bar{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;padding:8px;
    background:var(--glass);border:1px solid var(--glass-br);border-radius:999px;
    backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
    box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .btn{width:46px;height:46px;border:0;border-radius:999px;background:transparent;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .18s ease,transform .12s ease;font-size:0}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn:active{transform:scale(.92)}
  .btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .btn.play{width:56px;height:56px;background:#fff;color:#111}
  .btn.play:hover{background:#f1f1f1}
  .btn.play svg{width:24px;height:24px;fill:currentColor;stroke:none}
  .btn.on{color:#ff6b81}
  .btn.on svg{fill:#ff6b81;stroke:#ff6b81}
  .sep{width:1px;height:26px;background:rgba(255,255,255,.16);margin:0 6px}

  /* 좌우 큰 화살표 (가로에서만) */
  .side{position:absolute;top:50%;transform:translateY(-50%);width:64px;height:64px;border:0;border-radius:999px;
    background:rgba(0,0,0,.28);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(10px);transition:background .18s ease,transform .12s}
  .side:hover{background:rgba(0,0,0,.5)}
  .side:active{transform:translateY(-50%) scale(.93)}
  .side svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .side.l{left:28px} .side.r{right:28px}

  /* 닫기 */
  .close{position:absolute;top:28px;left:32px;width:44px;height:44px;border:0;border-radius:999px;
    background:rgba(0,0,0,.3);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(10px)}
  .close svg{width:19px;height:19px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round}

  /* 필름스트립 */
  .strip{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);
    display:flex;gap:8px;padding:8px;border-radius:16px;
    background:rgba(0,0,0,.28);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08)}
  .thumb{width:58px;height:40px;border-radius:7px;object-fit:cover;cursor:pointer;opacity:.45;
    transition:opacity .2s,transform .2s,outline-color .2s;outline:2px solid transparent;outline-offset:2px}
  .thumb:hover{opacity:.8}
  .thumb.cur{opacity:1;outline-color:var(--accent);transform:translateY(-3px)}

  /* 토스트 */
  .toast{position:absolute;left:50%;top:32px;transform:translateX(-50%);
    background:rgba(20,20,20,.86);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);
    padding:11px 20px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .3s,transform .3s;
    pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}

  /* 설정 패널 */
  .panel{position:absolute;right:28px;bottom:104px;width:290px;padding:18px;
    background:rgba(24,24,26,.82);backdrop-filter:blur(30px) saturate(1.5);
    border:1px solid rgba(255,255,255,.12);border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);display:none}
  .panel.open{display:block}
  .panel h4{margin:0 0 14px;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .row{margin-bottom:15px}
  .row:last-child{margin-bottom:0}
  .row .lb{font-size:11px;color:rgba(255,255,255,.45);margin-bottom:7px;letter-spacing:.04em;text-transform:uppercase}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:7px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.14);
    background:transparent;color:rgba(255,255,255,.72);font-size:12.5px;cursor:pointer;transition:.16s}
  .chip:hover{background:rgba(255,255,255,.08)}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#06312a;font-weight:600}

  /* ── 세로(모바일) 대응 ── */
  @media (orientation:portrait), (max-width:760px){
    .meta{left:20px;right:20px;bottom:130px;max-width:none}
    .meta .cap{font-size:20px}
    .side{width:52px;height:52px}
    .side.l{left:10px} .side.r{right:10px}
    .bar{bottom:24px;gap:2px;padding:7px}
    .btn{width:42px;height:42px}
    .btn.play{width:50px;height:50px}
    .strip{display:none}
    .counter{top:22px;right:20px}
    .close{top:20px;left:20px}
    .panel{right:16px;left:16px;width:auto;bottom:92px}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="backdrop" id="backdrop"></div>
  <div class="vignette"></div>
  <div class="photo-wrap"><img class="photo" id="photo" alt="" /></div>

  <div class="ui" id="ui">
    <button class="close" id="btnClose" title="닫기 (Esc)">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="counter">
      <span class="count-txt" id="counter">1 / 6</span>
      <svg class="ring" viewBox="0 0 36 36">
        <circle class="bg" cx="18" cy="18" r="15.5"/>
        <circle class="fg" id="ring" cx="18" cy="18" r="15.5" stroke-dasharray="97.4" stroke-dashoffset="97.4"/>
      </svg>
    </div>

    <div class="meta">
      <p class="cap" id="cap">첫 초음파 · 심장 소리를 들은 날</p>
      <div class="sub">
        <span class="dday" id="dday">D-88</span>
        <span id="date">2026.09.17</span>
        <span>·</span>
        <span id="who">아부지요</span>
      </div>
    </div>

    <button class="side l" id="btnPrev" title="이전 (←)">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="side r" id="btnNext" title="다음 (→)">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <div class="strip" id="strip"></div>

    <div class="bar">
      <button class="btn" id="btnPrev2" title="이전"><svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8zM5 19V5"/></svg></button>
      <button class="btn play" id="btnPlay" title="재생/일시정지 (Space)">
        <svg viewBox="0 0 24 24" id="icPause"><path d="M9 5.5h2.2v13H9zM12.8 5.5H15v13h-2.2z"/></svg>
        <svg viewBox="0 0 24 24" id="icPlay" style="display:none"><path d="M8 5.2l11 6.8-11 6.8z"/></svg>
      </button>
      <button class="btn" id="btnNext2" title="다음"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM19 5v14"/></svg></button>
      <span class="sep"></span>
      <button class="btn" id="btnLike" title="좋아요 (L)"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg></button>
      <button class="btn" id="btnSave" title="원본 저장 (S)"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
      <span class="sep"></span>
      <button class="btn" id="btnFrame" title="액자 모드 (F)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg></button>
      <button class="btn" id="btnGear" title="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 3.68 1.65 1.65 0 0010 2.17V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 8c.14.36.4.66.74.85H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
    </div>

    <div class="panel" id="panel">
      <h4>슬라이드쇼 설정</h4>
      <div class="row"><div class="lb">전환 시간</div><div class="chips" id="cSec"></div></div>
      <div class="row"><div class="lb">순서</div><div class="chips" id="cOrd"></div></div>
      <div class="row"><div class="lb">화면 맞춤</div><div class="chips" id="cFit"></div></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
/* ── 샘플 사진 (실제 앱에서는 Supabase 서명 URL) ───────────────────────── */
function pic(o){
  // 사진처럼 보이는 샘플: 부드러운 그라디언트 + 피사체 실루엣 + 보케 + 비네트
  var w=o.w, h=o.h, dots=(o.dots||[]).map(function(d){
    return '<circle cx="'+d[0]+'" cy="'+d[1]+'" r="'+d[2]+'" fill="#fff" opacity="'+d[3]+'"/>';
  }).join('');
  var svg =
   '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'+
   '<defs>'+
     '<linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">'+
       '<stop offset="0%" stop-color="'+o.a+'"/><stop offset="55%" stop-color="'+o.b+'"/><stop offset="100%" stop-color="'+o.c+'"/>'+
     '</linearGradient>'+
     '<radialGradient id="glow" cx="42%" cy="30%" r="62%">'+
       '<stop offset="0%" stop-color="#fff" stop-opacity=".55"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>'+
     '</radialGradient>'+
     '<radialGradient id="vg" cx="50%" cy="48%" r="72%">'+
       '<stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/>'+
     '</radialGradient>'+
     '<filter id="soft"><feGaussianBlur stdDeviation="'+Math.round(w/44)+'"/></filter>'+
     '<filter id="soft2"><feGaussianBlur stdDeviation="'+Math.round(w/130)+'"/></filter>'+
   '</defs>'+
   '<rect width="100%" height="100%" fill="url(#bg)"/>'+
   '<g filter="url(#soft)">'+dots+'</g>'+
   '<rect width="100%" height="100%" fill="url(#glow)"/>'+
   // 피사체 실루엣 (아기 머리+몸 느낌)
   '<g filter="url(#soft2)" opacity="'+(o.subOp||.30)+'">'+
     '<ellipse cx="'+(w*0.5)+'" cy="'+(h*0.47)+'" rx="'+(w*0.155)+'" ry="'+(w*0.155)+'" fill="#fff"/>'+
     '<ellipse cx="'+(w*0.5)+'" cy="'+(h*0.82)+'" rx="'+(w*0.245)+'" ry="'+(h*0.24)+'" fill="#fff"/>'+
   '</g>'+
   '<text x="50%" y="'+(h*0.5+w*0.055)+'" font-size="'+(w*0.115)+'" text-anchor="middle" opacity=".95">'+o.e+'</text>'+
   '<rect width="100%" height="100%" fill="url(#vg)"/>'+
   '</svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
var PHOTOS = [
  {url:pic({w:1200,h:1600,a:'#f3d9cd',b:'#dba892',c:'#9d6450',e:'🫧',subOp:.26,
            dots:[[300,300,150,.30],[950,420,190,.22],[500,1150,170,.18]]}),
   cap:'첫 초음파 · 심장 소리를 들은 날', dday:'D-152', date:'2026.07.15', who:'아부지요', liked:true},
  {url:pic({w:1600,h:1067,a:'#d8e9f7',b:'#9dbcd8',c:'#5b7f9e',e:'🌊',subOp:.22,
            dots:[[1150,260,200,.26],[380,760,160,.20]]}),
   cap:'12주, 손가락이 보여요', dday:'D-124', date:'2026.08.12', who:'엄마', liked:false},
  {url:pic({w:1200,h:1500,a:'#ece2f6',b:'#b9a3da',c:'#7a63a8',e:'💜',subOp:.28,
            dots:[[420,340,180,.24],[880,1050,210,.18]]}),
   cap:'태동을 처음 느낀 밤 · 발로 톡톡 차는 게 느껴졌어', dday:'D-98', date:'2026.09.07', who:'엄마', liked:true},
  {url:pic({w:1400,h:1400,a:'#dff0e7',b:'#9ecdb5',c:'#5d8f76',e:'🌿',subOp:.24,
            dots:[[900,320,200,.22],[350,1000,150,.20]]}),
   cap:'', dday:'D-90', date:'2026.09.15', who:'아부지요', liked:false},
  {url:pic({w:1600,h:1067,a:'#fbeacf',b:'#e2c07d',c:'#a97c37',e:'🌻',subOp:.22,
            dots:[[1050,320,210,.24],[400,720,170,.18]]}),
   cap:'또또 방 꾸미는 중', dday:'D-88', date:'2026.09.17', who:'아부지요', liked:false},
  {url:pic({w:1200,h:1600,a:'#fadfe9',b:'#dfa0bc',c:'#a05f7d',e:'🎀',subOp:.26,
            dots:[[560,320,180,.26],[820,1180,160,.20]]}),
   cap:'이름을 또또로 정한 날', dday:'D-88', date:'2026.09.17', who:'엄마', liked:true},
];

var idx=0, playing=true, sec=7, order='recent', fit='contain', frame=false, timer=null, tick=null, prog=0;
var $=function(id){return document.getElementById(id)};
var RING=97.4;

function render(){
  var p=PHOTOS[idx];
  var img=$('photo');
  img.classList.remove('enter'); void img.offsetWidth; img.classList.add('enter');
  img.src=p.url;
  img.className='photo enter'+(fit==='cover'?' fill':'');
  $('backdrop').style.backgroundImage='url("'+p.url+'")';
  $('cap').textContent=p.cap||'';
  $('cap').style.display=p.cap?'block':'none';
  $('dday').textContent=p.dday;
  $('date').textContent=p.date;
  $('who').textContent=p.who;
  $('counter').textContent=(idx+1)+' / '+PHOTOS.length;
  $('btnLike').classList.toggle('on',!!p.liked);
  document.querySelectorAll('.thumb').forEach(function(t,i){t.classList.toggle('cur',i===idx)});
  // 액자 모드: 부가 UI 감춤
  ['btnPrev','btnNext','strip','counter'].forEach(function(id){
    var el=$(id)||document.querySelector('.'+id); if(el) el.style.display=frame?'none':'';
  });
  document.querySelector('.counter').style.display=frame?'none':'';
  prog=0; paint();
}
function paint(){ $('ring').setAttribute('stroke-dashoffset', RING*(1-prog)); }
function go(d){ idx=(idx+d+PHOTOS.length)%PHOTOS.length; render(); restart(); }
function restart(){
  clearInterval(tick); clearTimeout(timer); prog=0; paint();
  if(!playing) return;
  var t0=Date.now();
  tick=setInterval(function(){ prog=Math.min(1,(Date.now()-t0)/(sec*1000)); paint(); },100);
  timer=setTimeout(function(){ go(1); }, sec*1000);
}
function setPlaying(v){
  playing=v;
  $('icPause').style.display = v ? '' : 'none';
  $('icPlay').style.display  = v ? 'none' : '';
  if(v) restart(); else { clearInterval(tick); clearTimeout(timer); }
  toast(v?'재생':'일시정지');
}
var tt;
function toast(m){ var e=$('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){e.classList.remove('show')},1500); }

/* UI 자동 숨김 */
var hideT;
function poke(){ $('ui').classList.remove('hide'); clearTimeout(hideT);
  hideT=setTimeout(function(){ $('ui').classList.add('hide'); $('panel').classList.remove('open'); }, frame?3000:4500); }
['mousemove','touchstart','click','keydown'].forEach(function(ev){document.addEventListener(ev,poke)});

/* 필름스트립 */
PHOTOS.forEach(function(p,i){
  var t=document.createElement('img'); t.className='thumb'; t.src=p.url;
  t.onclick=function(){ idx=i; render(); restart(); };
  $('strip').appendChild(t);
});

/* 설정 칩 */
function chips(host,items,cur,cb){
  host.innerHTML='';
  items.forEach(function(it){
    var b=document.createElement('button'); b.className='chip'+(it.v===cur?' sel':''); b.textContent=it.l;
    b.onclick=function(){ cb(it.v); };
    host.appendChild(b);
  });
}
function drawPanel(){
  chips($('cSec'),[3,5,7,10,15,30].map(function(s){return{v:s,l:s+'초'}}),sec,function(v){sec=v;drawPanel();restart();toast(v+'초마다 전환');});
  chips($('cOrd'),[{v:'recent',l:'최신순'},{v:'old',l:'오래된순'},{v:'random',l:'랜덤'}],order,function(v){order=v;drawPanel();toast({recent:'최신순',old:'오래된순',random:'랜덤'}[v]);});
  chips($('cFit'),[{v:'contain',l:'전체 보기'},{v:'cover',l:'채우기'}],fit,function(v){fit=v;drawPanel();render();toast(v==='cover'?'채우기':'전체 보기');});
}
drawPanel();

/* 버튼 */
$('btnPrev').onclick=$('btnPrev2').onclick=function(){go(-1)};
$('btnNext').onclick=$('btnNext2').onclick=function(){go(1)};
$('btnPlay').onclick=function(){setPlaying(!playing)};
$('btnLike').onclick=function(){ var p=PHOTOS[idx]; p.liked=!p.liked; $('btnLike').classList.toggle('on',p.liked); toast(p.liked?'❤️ 좋아요':'좋아요 취소'); };
$('btnSave').onclick=function(){ toast('⬇️ 원본을 저장했어요'); };
$('btnFrame').onclick=function(){ frame=!frame; render(); toast(frame?'🖼 액자 모드':'일반 모드'); poke(); };
$('btnGear').onclick=function(e){ e.stopPropagation(); $('panel').classList.toggle('open'); };
$('btnClose').onclick=function(){ toast('갤러리로 돌아갑니다'); };

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1);
  if(e.key===' '){e.preventDefault();setPlaying(!playing);}
  if(e.key.toLowerCase()==='l')$('btnLike').click();
  if(e.key.toLowerCase()==='s')$('btnSave').click();
  if(e.key.toLowerCase()==='f')$('btnFrame').click();
});

render(); setPlaying(true); poke();
</script>
</body>
</html>
