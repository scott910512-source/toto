services:
  db:
    image: postgres:16-alpine
    container_name: travel-korea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel
    volumes:
      - tkt_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "travel"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-korea-tracker
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://travel:travel@db:5432/travel?schema=public"
      JWT_SECRET: "${JWT_SECRET:-please-change-this-internal-secret}"
      JWT_EXPIRES_IN: "7d"
      UPLOAD_DIR: "/app/uploads"
      CORS_ORIGIN: "*"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@travel.kr}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin1234}"
      ADMIN_NAME: "${ADMIN_NAME:-관리자}"
      MAX_PHOTOS_PER_VISIT: "20"
      SEED_SAMPLE: "${SEED_SAMPLE:-true}"
    volumes:
      - tkt_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tkt_pg:
  tkt_uploads:
