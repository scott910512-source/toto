name: Deploy to GitHub Pages

# ⚠️ 지금은 이 워크플로가 배포하고 있지 않습니다.
#
# 저장소 설정이 Pages → "Deploy from a branch" 로 되어 있어,
# claude/baby-care-firebase-app-QPyK0 에 푸시하면 GitHub 가 브랜치 내용을
# 그대로 내보냅니다. 즉 검사를 통과하지 않아도 가족이 쓰는 주소가 바뀝니다.
#
# 검사를 통과한 것만 올라가게 하려면 저장소 설정에서
#   Settings → Pages → Build and deployment → Source 를
#   "GitHub Actions" 로 바꾸면 됩니다.
# 그러면 아래 guard(verify·lint·types·단위·E2E)를 통과한 커밋만 배포됩니다.
# 바꾸기 전까지는 수동 실행(workflow_dispatch)만 열어 둡니다 — 두 가지가
# 동시에 배포하면 어느 쪽이 올라갔는지 알 수 없기 때문입니다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    name: 배포 전 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 가족이 쓰는 주소로 올라가기 전에 실제 화면까지 돌려본다.
      # 로그인·나만보기·기록·갤러리가 깨진 채 배포되는 일을 막는 게 목적이다.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: 배포
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site
          # 현재 운영 중인 정적 파일들
          cp -v app.html dday.html gallery.html baby-care.html _site/ 2>/dev/null || true
          cp -v supabase-config.js sw.js manifest.webmanifest _site/ 2>/dev/null || true
          cp -v icon-*.png apple-touch-icon.png _site/ 2>/dev/null || true
          cp -v slideshow-preview.html _site/ 2>/dev/null || true
          touch _site/.nojekyll
          # app.html 을 기본 진입점으로
          cp _site/app.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
