name: Deploy to GitHub Pages

# 검사를 통과한 main 만 배포한다. 빌드가 깨진 코드가 가족이 쓰는 주소로
# 바로 올라가지 않도록 막는 것이 목적이다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    name: 배포 전 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 가족이 쓰는 주소로 올라가기 전에 실제 화면까지 돌려본다.
      # 로그인·나만보기·기록·갤러리가 깨진 채 배포되는 일을 막는 게 목적이다.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: 배포
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site
          # 현재 운영 중인 정적 파일들
          cp -v app.html dday.html gallery.html baby-care.html _site/ 2>/dev/null || true
          cp -v supabase-config.js sw.js manifest.webmanifest _site/ 2>/dev/null || true
          cp -v icon-*.png apple-touch-icon.png _site/ 2>/dev/null || true
          cp -v slideshow-preview.html _site/ 2>/dev/null || true
          touch _site/.nojekyll
          # app.html 을 기본 진입점으로
          cp _site/app.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
