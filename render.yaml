databases:
  - name: travel-korea-db
    plan: free
    databaseName: travelkorea
    user: travel

services:
  - type: web
    name: travel-korea-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: travel-korea-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@admin.com
      - key: ADMIN_PASSWORD
        value: admin11!
      - key: ADMIN_NAME
        value: 관리자
      - key: MAX_PHOTOS_PER_VISIT
        value: "20"
      - key: SEED_SAMPLE
        value: "false"
      # Firebase Storage (사진 영구 저장) - Render 대시보드에서 직접 입력
      - key: FIREBASE_PROJECT_ID
        value: toto2-ddba9
      - key: FIREBASE_STORAGE_BUCKET
        value: toto2-ddba9.appspot.com
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
