  /* ========================================================================
     17. 이미지 압축 → base64 데이터URL (Firestore 무료 저장용) — 시니어 검토 #5
        Firestore 문서 1MB 한도 안에 들어가도록 화질/크기를 점진 축소
     ======================================================================== */
  const MAX_PHOTO_BYTES = 900 * 1024; // base64 길이 상한 (1MB 한도 대비 여유)
  const compressToDataURL = (file) =>
    new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const render = (maxDim, q) => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, width, height); // 투명 PNG 대비 흰 배경
          ctx.drawImage(img, 0, 0, width, height);
          return canvas.toDataURL("image/jpeg", q);
        };
        let maxDim = 1000, quality = 0.72;
        let dataUrl = render(maxDim, quality);
        // 1MB 안에 들어갈 때까지 점진적으로 줄이기
        let guard = 0;
        while (dataUrl.length > MAX_PHOTO_BYTES && guard < 10) {
          guard++;
          if (quality > 0.4) quality -= 0.1;
          else { maxDim = Math.round(maxDim * 0.85); quality = 0.6; }
          dataUrl = render(maxDim, quality);
        }
        if (dataUrl.length > MAX_PHOTO_BYTES) { reject(new Error("사진 용량이 너무 커요. 더 작은 사진을 사용해주세요.")); return; }
        resolve(dataUrl);
      };
      // HEIC 등 브라우저가 못 읽는 형식
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이 사진 형식을 읽을 수 없어요. (HEIC라면 설정에서 '호환성 우선'으로 촬영하거나 JPG로 변환해주세요)")); };
      img.src = url;
    });

  /* ========================================================================
     17-b. 사진 EXIF에서 촬영일·GPS 추출 (없으면 null)
     ======================================================================== */
  // exifr 지연 로드 (부팅 차단 방지). 실패하면 null 반환 → EXIF만 생략, 앱은 정상.
  let _exifrPromise = null;
  const loadExifr = () => {
    if (window.exifr) return Promise.resolve(window.exifr);
    if (_exifrPromise) return _exifrPromise;
    _exifrPromise = new Promise((resolve) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js";
      s.crossOrigin = "anonymous";
      s.onload = () => resolve(window.exifr || null);
      s.onerror = () => resolve(null);
      document.head.appendChild(s);
    });
    return _exifrPromise;
  };
  const readPhotoMeta = async (file) => {
    const meta = { takenAt: null, gps: null };
    try {
      const exifr = await loadExifr();
      if (exifr) {
        const tags = await exifr.parse(file, { pick: ["DateTimeOriginal", "CreateDate"] }).catch(() => null);
        if (tags) meta.takenAt = tags.DateTimeOriginal || tags.CreateDate || null;
        const g = await exifr.gps(file).catch(() => null);
        if (g && g.latitude != null && g.longitude != null) {
          meta.gps = { lat: +g.latitude.toFixed(6), lng: +g.longitude.toFixed(6) };
        }
      }
    } catch (e) { /* EXIF 없거나 읽기 실패 시 무시 */ }
    return meta;
  };

  /* ========================================================================
     18. 사진 업로드 모달
     ======================================================================== */
  const ALL_CATS = [{ value: "ultrasound", label: "초음파" }, { value: "baby", label: "아기사진" }, { value: "milestone", label: "성장기록" }];
  const UploadModal = ({ open, onClose, defaultCategory = "baby" }) => {
    // 초음파 업로드는 임신 페이지에서만 → 갤러리 업로드는 아기사진/성장기록만
    const catOptions = defaultCategory === "ultrasound" ? ALL_CATS.filter((c) => c.value === "ultrasound") : ALL_CATS.filter((c) => c.value !== "ultrasound");
    const { user, profile } = useAuth();
    const toast = useToast();
    const [files, setFiles] = useState([]);
    const [category, setCategory] = useState(defaultCategory);
    const [caption, setCaption] = useState("");
    const [people, setPeople] = useState([]);     // 함께한 사람 이름들
    const [personInput, setPersonInput] = useState("");
    const [place, setPlace] = useState("");       // 장소/지역 (검색용)
    const [takenAt, setTakenAt] = useState("");   // 촬영 시각 (EXIF 우선)
    const [gps, setGps] = useState(null);         // {lat,lng}
    const [vis, setVis] = useState("public");     // public(전체공개) | private(나만보기)
    const [familyNames, setFamilyNames] = useState([]);
    const [progress, setProgress] = useState(null); // {done,total,pct}
    const inputRef = useRef();
    const camRef = useRef();

    useEffect(() => {
      if (!open) return;
      setFiles([]); setCaption(""); setCategory(defaultCategory); setProgress(null);
      setPeople([]); setPersonInput(""); setPlace(""); setTakenAt(toLocalInput(new Date())); setGps(null); setVis("public");
      // 가족 이름 후보 불러오기 (인물 태그용)
      COL.users().get().then((s) => setFamilyNames(s.docs.map((d) => d.data().name).filter(Boolean)))
        .catch(() => setFamilyNames([]));
    }, [open]);

    const pick = async (e) => {
      const list = Array.from(e.target.files || []).slice(0, 5); // 최대 5장
      setFiles(list);
      if (list[0]) {
        // 첫 사진 EXIF에서 촬영일·GPS 자동 채우기
        const m = await readPhotoMeta(list[0]);
        if (m.takenAt) setTakenAt(toLocalInput(m.takenAt));
        if (m.gps) setGps(m.gps);
      }
    };

    const togglePerson = (name) => setPeople((p) => p.includes(name) ? p.filter((x) => x !== name) : [...p, name]);
    const addPerson = () => {
      const n = personInput.trim();
      if (n && !people.includes(n)) setPeople((p) => [...p, n]);
      setPersonInput("");
    };

    const upload = async () => {
      if (files.length === 0) { toast("사진을 선택하세요.", "error"); return; }
      setProgress({ done: 0, total: files.length, pct: 0 });
      const takenDate = fromLocalInput(takenAt);
      try {
        for (let i = 0; i < files.length; i++) {
          // 무료 방식: Storage 대신 Firestore에 압축 이미지(base64) 저장
          setProgress({ done: i, total: files.length, pct: 20 });
          const dataUrl = await compressToDataURL(files[i]);
          // 여러 장이면 각 사진별 EXIF 촬영일/GPS 우선 사용
          let perMeta = { takenAt: takenDate, gps };
          if (files.length > 1) {
            const m = await readPhotoMeta(files[i]);
            if (m.takenAt) perMeta.takenAt = m.takenAt;
            if (m.gps) perMeta.gps = m.gps;
          }
          setProgress({ done: i, total: files.length, pct: 70 });
          await COL.photos().add({
            uploadedBy: user.uid,
            uploaderName: (profile && profile.name) || (user.email || "").split("@")[0],
            url: dataUrl, caption: caption || "", category,
            people, place: place || "",
            placeLower: (place || "").toLowerCase(),
            gps: perMeta.gps || null,
            takenAt: perMeta.takenAt || takenDate,
            vis, likeCount: 0, createdAt: TS(),
          });
          setProgress({ done: i, total: files.length, pct: 100 });
        }
        toast(`${files.length}장 업로드 완료!`, "success");
        onClose();
      } catch (e) { toast(errMsg(e), "error"); setProgress(null); }
    };

    return (
      <Modal open={open} onClose={onClose} title="📷 사진 업로드">
        <div className="space-y-4">
          {/* 앨범: capture 없음 → iOS에서 사진 보관함/파일 선택 가능 */}
          <input ref={inputRef} type="file" accept="image/*" multiple onChange={pick} className="hidden" />
          {/* 촬영: capture 지정 → 카메라 바로 열기 */}
          <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={pick} className="hidden" />
          <div className="grid grid-cols-2 gap-3">
            <button onClick={() => inputRef.current.click()}
              className="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl py-6 text-center text-slate-400 hover:border-teal-400 hover:text-teal-500 transition">
              <div className="text-3xl mb-1" aria-hidden="true">🖼️</div>
              <p className="text-sm">앨범에서 선택</p>
            </button>
            <button onClick={() => camRef.current.click()}
              className="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl py-6 text-center text-slate-400 hover:border-teal-400 hover:text-teal-500 transition">
              <div className="text-3xl mb-1" aria-hidden="true">📷</div>
              <p className="text-sm">사진 촬영</p>
            </button>
          </div>
          <p className="text-[11px] text-slate-400 text-center">최대 5장까지 업로드할 수 있어요</p>

          {files.length > 0 && (
            <div className="grid grid-cols-3 gap-2">
              {files.map((f, i) => <img key={i} src={URL.createObjectURL(f)} alt={`선택한 사진 ${i + 1}`} className="w-full aspect-square object-cover rounded-lg" />)}
            </div>
          )}

          {catOptions.length > 1 ? (
            <ChipGroup label="카테고리" value={category} onChange={setCategory} options={catOptions} />
          ) : (
            <p className="text-sm text-slate-500 dark:text-slate-400">📁 카테고리: <b>초음파</b> (임신 기록 전용)</p>
          )}
          <Field label="캡션"><input className={inputCls} value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="사진 설명" /></Field>

          {/* 공개 범위 */}
          <ChipGroup label="공개 범위" value={vis} onChange={setVis}
            options={[{ value: "public", label: "🌐 전체공개" }, { value: "private", label: "🔒 나만보기" }]} />
          <p className="text-[11px] text-slate-400 -mt-1">나만보기는 본인과 관리자(엄마·아빠)만 볼 수 있어요.</p>

          {/* 함께한 사람 (인물 태그) */}
          <div>
            <span className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">함께한 사람</span>
            <div className="flex flex-wrap gap-2 mb-2">
              {familyNames.map((n) => (
                <button key={n} type="button" onClick={() => togglePerson(n)}
                  className={`px-3 py-1.5 rounded-full text-sm border ${people.includes(n)
                    ? "bg-violet-400 border-violet-400 text-white" : "bg-white dark:bg-slate-700 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300"}`}>
                  {people.includes(n) ? "✓ " : ""}{n}
                </button>
              ))}
            </div>
            <div className="flex gap-2">
              <input className={inputCls} value={personInput} onChange={(e) => setPersonInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && (e.preventDefault(), addPerson())}
                placeholder="직접 추가 (예: 이모, 삼촌)" aria-label="사람 직접 추가" />
              <button type="button" onClick={addPerson} className="whitespace-nowrap px-3 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-sm">추가</button>
            </div>
            {people.filter((n) => !familyNames.includes(n)).length > 0 && (
              <div className="flex flex-wrap gap-2 mt-2">
                {people.filter((n) => !familyNames.includes(n)).map((n) => (
                  <span key={n} className="px-3 py-1.5 rounded-full text-sm bg-violet-400 text-white flex items-center gap-1">
                    {n}<button type="button" onClick={() => togglePerson(n)} aria-label={`${n} 제거`}>×</button>
                  </span>
                ))}
              </div>
            )}
          </div>

          {/* 장소/지역 (날짜·지역 검색용) */}
          <Field label="장소 / 지역">
            <input className={inputCls} value={place} onChange={(e) => setPlace(e.target.value)} placeholder="예: 서울 할머니댁, 제주 여행" />
          </Field>
          {gps && <p className="text-[11px] text-teal-500">📍 사진에서 위치 좌표를 찾았어요 ({gps.lat}, {gps.lng}) — 지도 검색에 활용됩니다</p>}

          {/* 촬영 시각 (EXIF 우선, 수정 가능) */}
          <DateTimeField value={takenAt} onChange={setTakenAt} label="촬영 시각" />
          <p className="text-[11px] text-slate-400">여러 장은 각 사진의 촬영정보(EXIF)가 있으면 자동 적용돼요.</p>

          {progress && (
            <div>
              <div className="flex justify-between text-xs text-slate-500 mb-1">
                <span>업로드 중 {progress.done + 1}/{progress.total}</span><span>{progress.pct}%</span>
              </div>
              <div className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                <div className="h-full bg-teal-500 transition-all" style={{ width: `${progress.pct}%` }} role="progressbar" aria-valuenow={progress.pct} aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          )}
          <Btn onClick={upload} disabled={!!progress} className="w-full">{progress ? "업로드 중..." : "업로드"}</Btn>
        </div>
      </Modal>
    );
  };

  /* ========================================================================
     19. 좋아요 / 저장 훅 (트랜잭션, 계정별) — 시니어 검토 #2
     ======================================================================== */
  // 좋아요는 사진 문서의 likedBy 배열로 관리 (색인/추가 규칙 불필요, 동시성 안전)
  const isLikedBy = (photo, uid) => !!photo && (photo.likedBy || []).includes(uid);
  const likeCountOf = (photo) => (photo && photo.likedBy ? photo.likedBy.length : (photo && photo.likeCount) || 0);
  // 공개 범위: 관리자/작성자/본인 또는 전체공개(기본)면 볼 수 있음 (이전 데이터는 vis 없음 → 공개 취급)
  const canSeePhoto = (p, uid, isAdmin) => !!p && (isAdmin || p.uploadedBy === uid || (p.vis || "public") !== "private");
  const canSeeLetter = (l, uid, isAdmin) => !!l && (isAdmin || l.createdBy === uid || (l.vis || "public") !== "private");
  const isPrivate = (x) => x && x.vis === "private";

  const useMySaved = (uid) => {
    const [saved, setSaved] = useState(new Set());
    const [docs, setDocs] = useState([]);
    useEffect(() => {
      if (!uid) return;
      const unsub = COL.users().doc(uid).collection("savedPhotos")
        .orderBy("savedAt", "desc")
        .onSnapshot((snap) => {
          setSaved(new Set(snap.docs.map((d) => d.id)));
          setDocs(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        });
      return () => unsub();
    }, [uid]);
    return { saved, docs };
  };

  // 좋아요 토글 — likedBy 배열에 arrayUnion/arrayRemove (원자적, 동시성 안전)
  const toggleLike = async (photo, uid) => {
    const FV = firebase.firestore.FieldValue;
    const liked = isLikedBy(photo, uid);
    await COL.photos().doc(photo.id).update({
      likedBy: liked ? FV.arrayRemove(uid) : FV.arrayUnion(uid),
      likeCount: FV.increment(liked ? -1 : 1), // 호환용 카운트도 함께 유지
    });
  };

  const toggleSave = async (photo, uid) => {
    const ref = COL.users().doc(uid).collection("savedPhotos").doc(photo.id);
    const snap = await ref.get();
    if (snap.exists) await ref.delete();
    else await ref.set({ savedAt: TS(), photoRef: photo.id, url: photo.url, caption: photo.caption || "", category: photo.category });
  };

  /* ========================================================================
     20. 사진 카드 + 갤러리
     ======================================================================== */
  const PhotoCard = ({ photo, saved, uid, onOpen }) => {
    const liked = isLikedBy(photo, uid);
    return (
      <div className="relative group">
        {isPrivate(photo) && <span className="absolute top-1 left-1 z-10 text-[10px] bg-black/55 text-white rounded-full px-1.5 py-0.5" title="나만보기">🔒</span>}
        <button onClick={onOpen} className="block w-full" aria-label={`${photo.uploaderName}님의 사진 열기`}>
          <img src={photo.url} alt={photo.caption || `${photo.uploaderName}님이 올린 사진`} loading="lazy"
            className="w-full aspect-square object-cover rounded-xl bg-slate-100 dark:bg-slate-700" />
        </button>
        <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/60 to-transparent rounded-b-xl p-2 flex items-end justify-between">
          <span className="text-[10px] text-white/90 truncate">{photo.uploaderName}</span>
          <div className="flex items-center gap-2">
            <button onClick={() => toggleLike(photo, uid)} aria-label={liked ? "좋아요 취소" : "좋아요"} className="text-sm flex items-center gap-0.5 text-white">
              <span aria-hidden="true">{liked ? "❤️" : "🤍"}</span><span className="text-[10px]">{likeCountOf(photo)}</span>
            </button>
            <button onClick={() => toggleSave(photo, uid)} aria-label={saved ? "저장 취소" : "저장"} className="text-base text-white">{saved ? "🔖" : "🏷️"}</button>
          </div>
        </div>
      </div>
    );
  };

  // 사진 컬렉션 실시간 구독 (갤러리/슬라이드쇼 공용)
  const usePhotos = (max = 300) => {
    const [photos, setPhotos] = useState(null);
    useEffect(() => {
      const unsub = COL.photos().orderBy("createdAt", "desc").limit(max)
        .onSnapshot((snap) => setPhotos(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (e) => { console.error(e); setPhotos([]); });
      return () => unsub();
    }, [max]);
    return photos;
  };

  const Gallery = ({ openUpload, canUpload = true }) => {
    const { user, isAdmin } = useAuth();
    const [lim, setLim] = useState(60);          // 무한스크롤: 60장씩 늘려가며 로딩
    const photos = usePhotos(lim);
    const [cat, setCat] = useState("all");
    const [sort, setSort] = useState("recent");
    const [q, setQ] = useState("");
    const [from, setFrom] = useState("");
    const [to, setTo] = useState("");
    const [uploader, setUploader] = useState("all"); // 관리자 업로더별 필터
    const [detail, setDetail] = useState(null); // index
    const [showSlide, setShowSlide] = useState(false);
    const { saved } = useMySaved(user.uid);
    const sentinel = useRef(null);
    const canMore = photos && photos.length >= lim; // 더 있을 가능성

    // 관리자용: 업로더 목록
    const uploaders = useMemo(() => {
      const m = new Map();
      (photos || []).forEach((p) => { if (p.uploadedBy) m.set(p.uploadedBy, p.uploaderName || "이름없음"); });
      return [...m.entries()];
    }, [photos]);

    // 바닥 근처에 닿으면 더 로딩
    useEffect(() => {
      if (!sentinel.current) return;
      const io = new IntersectionObserver((es) => {
        if (es[0].isIntersecting && canMore) setLim((n) => n + 60);
      }, { rootMargin: "300px" });
      io.observe(sentinel.current);
      return () => io.disconnect();
    }, [canMore]);

    const list = useMemo(() => {
      if (!photos) return [];
      // 초음파는 임신 페이지에서 별도 관리 → 갤러리에서 제외 + 공개범위 필터
      let l = photos.filter((p) => p.category !== "ultrasound" && canSeePhoto(p, user.uid, isAdmin));
      if (cat !== "all") l = l.filter((p) => p.category === cat);
      if (isAdmin && uploader !== "all") l = l.filter((p) => p.uploadedBy === uploader);
      const kw = q.trim().toLowerCase();
      if (kw) {
        l = l.filter((p) =>
          (p.caption || "").toLowerCase().includes(kw) ||
          (p.place || "").toLowerCase().includes(kw) ||
          (p.uploaderName || "").toLowerCase().includes(kw) ||
          (p.people || []).some((n) => (n || "").toLowerCase().includes(kw))
        );
      }
      const dayOf = (p) => toDate(p.takenAt || p.createdAt);
      if (from) l = l.filter((p) => { const d = dayOf(p); return d && ymd(d) >= from; });
      if (to) l = l.filter((p) => { const d = dayOf(p); return d && ymd(d) <= to; });
      if (sort === "likes") l = [...l].sort((a, b) => likeCountOf(b) - likeCountOf(a));
      else l = [...l].sort((a, b) => (toDate(b.takenAt || b.createdAt) - toDate(a.takenAt || a.createdAt)));
      return l;
    }, [photos, cat, sort, q, from, to, uploader, isAdmin, user.uid]);

    const cats = [{ v: "all", l: "전체" }, { v: "baby", l: "아기사진" }, { v: "milestone", l: "성장기록" }];

    return (
      <div className="p-4 space-y-3 pb-safe">
        {/* 검색 */}
        <div className="flex gap-2">
          <input className={inputCls + " flex-1"} value={q} onChange={(e) => setQ(e.target.value)}
            placeholder="🔍 사람·장소·설명 검색" aria-label="사진 검색" />
          <button onClick={() => setShowSlide(true)} aria-label="슬라이드쇼 시작"
            className="whitespace-nowrap px-3 rounded-xl bg-violet-400 text-white text-sm font-medium">▶ 슬라이드쇼</button>
        </div>
        {/* 날짜 범위 */}
        <div className="flex items-center gap-2 text-xs text-slate-500">
          <input type="date" className={inputCls + " py-2 text-sm"} value={from} onChange={(e) => setFrom(e.target.value)} aria-label="시작 날짜" />
          <span>~</span>
          <input type="date" className={inputCls + " py-2 text-sm"} value={to} onChange={(e) => setTo(e.target.value)} aria-label="끝 날짜" />
          {(from || to || q) && <button onClick={() => { setFrom(""); setTo(""); setQ(""); }} className="whitespace-nowrap text-slate-400">초기화</button>}
        </div>

        <div className="flex items-center justify-between gap-2">
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar" role="tablist" aria-label="카테고리 필터">
            {cats.map((c) => (
              <button key={c.v} role="tab" aria-selected={cat === c.v} onClick={() => setCat(c.v)}
                className={`whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium ${cat === c.v ? "bg-teal-500 text-white" : "bg-white dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700"}`}>{c.l}</button>
            ))}
          </div>
          <button onClick={() => setSort(sort === "recent" ? "likes" : "recent")}
            className="whitespace-nowrap text-xs text-slate-500 dark:text-slate-300 px-2 py-1.5">
            {sort === "recent" ? "최신순 ↓" : "좋아요순 ❤️"}
          </button>
        </div>

        {/* 관리자: 업로더별 보기 */}
        {isAdmin && uploaders.length > 0 && (
          <select value={uploader} onChange={(e) => setUploader(e.target.value)} aria-label="업로더별 보기"
            className={inputCls + " py-2 text-sm"}>
            <option value="all">👥 전체 업로더</option>
            {uploaders.map(([uid, nm]) => <option key={uid} value={uid}>{nm}</option>)}
          </select>
        )}

        {!photos ? <Spinner /> : list.length === 0 ? (
          <Card className="p-8 text-center text-sm text-slate-400">{q || from || to ? "검색 결과가 없어요." : <>아직 사진이 없어요.<br />아래 + 버튼으로 추가해보세요.</>}</Card>
        ) : (
          <>
            <div className="grid grid-cols-3 gap-2">
              {list.map((p, i) => (
                <PhotoCard key={p.id} photo={p} uid={user.uid} saved={saved.has(p.id)} onOpen={() => setDetail(i)} />
              ))}
            </div>
            <div ref={sentinel} className="h-8 flex items-center justify-center">
              {canMore && <span className="text-xs text-slate-400">더 불러오는 중…</span>}
            </div>
          </>
        )}

        {/* 업로드 FAB */}
        {canUpload && (
          <button onClick={openUpload} aria-label="사진 업로드"
            className="fixed bottom-24 right-1/2 translate-x-[195px] sm:right-[calc(50%-215px)] w-14 h-14 rounded-full bg-teal-500 text-white text-3xl shadow-lg flex items-center justify-center active:scale-95 z-20">+</button>
        )}

        {detail != null && (
          <PhotoDetail list={list} index={detail} setIndex={setDetail} uid={user.uid} saved={saved} onClose={() => setDetail(null)} />
        )}
        {showSlide && <Slideshow photos={photos} onClose={() => setShowSlide(false)} />}
      </div>
    );
  };

  /* ========================================================================
     20-b. 슬라이드쇼 (최신 + 좋아요 많은 사진 30장, 각 1분, 크로스페이드)
     ======================================================================== */
  const SLIDE_OPTIONS = [{ ms: 10000, label: "10초" }, { ms: 30000, label: "30초" }, { ms: 60000, label: "1분" }];
  const SLIDE_REFRESH_MS = 10 * 60 * 1000; // 10분마다 새 사진 반영
  const buildSlideDeck = (photos) => {
    if (!photos || photos.length === 0) return [];
    const pub = photos.filter((p) => !isPrivate(p) && p.category !== "ultrasound"); // 전체공개(나만보기·초음파 제외)
    if (pub.length === 0) return [];
    const byRecent = [...pub].sort((a, b) => toDate(b.takenAt || b.createdAt) - toDate(a.takenAt || a.createdAt)).slice(0, 20);
    const byLikes = [...pub].sort((a, b) => likeCountOf(b) - likeCountOf(a)).slice(0, 15);
    const map = new Map();
    [...byRecent, ...byLikes].forEach((p) => map.set(p.id, p)); // 중복 제거(최신 우선)
    return [...map.values()].slice(0, 30);
  };

  const Slideshow = ({ photos, onClose }) => {
    // 덱은 10분마다만 갱신 (재생 중 사진 추가돼도 끊김 없이, 10분 뒤 반영)
    const [deck, setDeck] = useState([]);
    const photosRef = useRef(photos);
    useEffect(() => { photosRef.current = photos; }, [photos]);
    useEffect(() => { // 최초 사진 도착 시 1회 빌드
      if (photos && photos.length && deck.length === 0) setDeck(buildSlideDeck(photos));
    }, [photos, deck.length]);
    useEffect(() => { // 10분 주기 갱신
      const id = setInterval(() => { const d = buildSlideDeck(photosRef.current); if (d.length) setDeck(d); }, SLIDE_REFRESH_MS);
      return () => clearInterval(id);
    }, []);

    const [idx, setIdx] = useState(0);
    const [prevIdx, setPrevIdx] = useState(null);
    const [paused, setPaused] = useState(false);
    const [progress, setProgress] = useState(0);
    const [dur, setDur] = useState(() => Number(localStorage.getItem("baby-slide-ms")) || 30000);
    const rootRef = useRef(null);
    // 덱 갱신으로 인덱스가 범위를 벗어나면 보정
    useEffect(() => { if (idx >= deck.length && deck.length > 0) setIdx(0); }, [deck.length, idx]);

    const setDuration = (ms) => { setDur(ms); localStorage.setItem("baby-slide-ms", String(ms)); setProgress(0); };

    const go = useCallback((dir) => {
      setIdx((i) => {
        setPrevIdx(i);
        const n = (i + dir + deck.length) % deck.length;
        return n;
      });
      setProgress(0);
    }, [deck.length]);

    // 자동 전환 + 진행 막대 (선택한 속도)
    useEffect(() => {
      if (paused || deck.length <= 1) return;
      const tick = setInterval(() => setProgress((p) => Math.min(100, p + 100 / (dur / 200))), 200);
      const next = setTimeout(() => go(1), dur);
      return () => { clearInterval(tick); clearTimeout(next); };
    }, [idx, paused, deck.length, go, dur]);

    // 전체화면 + 화면 꺼짐 방지(Wake Lock) — 재획득 포함
    useEffect(() => {
      let lock = null, released = false;
      const acquire = () => {
        if (navigator.wakeLock && document.visibilityState === "visible") {
          navigator.wakeLock.request("screen").then((l) => { if (released) l.release().catch(() => {}); else { lock = l; lock.addEventListener && lock.addEventListener("release", () => { lock = null; }); } }).catch(() => {});
        }
      };
      acquire();
      // 탭이 다시 보이면 Wake Lock 재획득 (브라우저가 자동 해제하므로)
      const onVis = () => { if (document.visibilityState === "visible") acquire(); };
      document.addEventListener("visibilitychange", onVis);
      // 전체화면 진입 (지원 브라우저; iPhone Safari는 미지원이라 무시)
      const el = rootRef.current;
      if (el && el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el && el.webkitRequestFullscreen) try { el.webkitRequestFullscreen(); } catch (e) {}

      const onKey = (e) => { if (e.key === "Escape") onClose(); if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); if (e.key === " ") setPaused((p) => !p); };
      window.addEventListener("keydown", onKey);
      document.body.style.overflow = "hidden";
      return () => {
        released = true;
        window.removeEventListener("keydown", onKey);
        document.removeEventListener("visibilitychange", onVis);
        document.body.style.overflow = "";
        if (lock) lock.release().catch(() => {});
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else if (document.webkitFullscreenElement && document.webkitExitFullscreen) try { document.webkitExitFullscreen(); } catch (e) {}
      };
    }, [go, onClose]);

    if (deck.length === 0) {
      return (
        <div className="fixed inset-0 z-[60] bg-black flex flex-col items-center justify-center text-white gap-4">
          <p>{photos == null ? "불러오는 중..." : "표시할 전체공개 사진이 없어요."}</p>
          <Btn variant="ghost" onClick={onClose}>닫기</Btn>
        </div>
      );
    }

    const cur = deck[idx] || deck[0];
    const prev = prevIdx != null ? deck[prevIdx] : null;
    if (!cur) return null;
    const meta = [cur.uploaderName, (cur.people || []).join(", "), cur.place, fmtDate(cur.takenAt || cur.createdAt)].filter(Boolean).join(" · ");

    return (
      <div ref={rootRef} className="fixed inset-0 z-[60] bg-black overflow-hidden" role="dialog" aria-modal="true" aria-label="슬라이드쇼">
        {/* 진행 막대 */}
        <div className="absolute top-0 inset-x-0 h-1 bg-white/20 z-20">
          <div className="h-full bg-violet-400 transition-all duration-200 ease-linear" style={{ width: `${progress}%` }}></div>
        </div>

        {/* 크로스페이드: 이전 사진(뒤) + 현재 사진(앞, 페이드인 + 느린 줌) */}
        {prev && <img key={"p" + prevIdx} src={prev.url} alt="" className="absolute inset-0 w-full h-full object-contain" />}
        <img key={"c" + idx} src={cur.url} alt={cur.caption || "사진"} className="absolute inset-0 w-full h-full object-contain slide-img" />

        {/* 정보 오버레이 */}
        <div className="absolute bottom-0 inset-x-0 z-20 bg-gradient-to-t from-black/80 to-transparent p-6 pb-10 text-white">
          {cur.caption && <p className="text-xl font-bold mb-1 drop-shadow">{cur.caption}</p>}
          <p className="text-sm text-white/80">{meta}</p>
          <p className="text-xs text-white/50 mt-1">❤️ {likeCountOf(cur)} · {idx + 1} / {deck.length}</p>
        </div>

        {/* 컨트롤 */}
        <button onClick={onClose} aria-label="슬라이드쇼 닫기" className="absolute top-4 right-4 z-30 text-white text-3xl w-11 h-11 bg-black/30 rounded-full">×</button>
        <div className="absolute top-1/2 -translate-y-1/2 left-3 z-30">
          <button onClick={() => go(-1)} aria-label="이전" className="text-white/70 text-4xl w-12 h-12 bg-black/20 rounded-full">‹</button>
        </div>
        <div className="absolute top-1/2 -translate-y-1/2 right-3 z-30">
          <button onClick={() => go(1)} aria-label="다음" className="text-white/70 text-4xl w-12 h-12 bg-black/20 rounded-full">›</button>
        </div>
        {/* 하단 컨트롤: 재생/일시정지 + 속도 선택 */}
        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-3">
          <button onClick={() => setPaused((p) => !p)} aria-label={paused ? "재생" : "일시정지"}
            className="text-white text-2xl w-12 h-12 bg-black/30 rounded-full">{paused ? "▶" : "⏸"}</button>
          <div className="flex items-center bg-black/30 rounded-full p-1" role="group" aria-label="전환 속도">
            {SLIDE_OPTIONS.map((o) => (
              <button key={o.ms} onClick={() => setDuration(o.ms)} aria-pressed={dur === o.ms}
                className={`px-3 py-1.5 rounded-full text-xs font-medium ${dur === o.ms ? "bg-violet-400 text-white" : "text-white/70"}`}>{o.label}</button>
            ))}
          </div>
        </div>
      </div>
    );
  };

  /* ========================================================================
     21. 사진 상세 모달 (스와이프/이전·다음/다운로드/삭제)
     ======================================================================== */
  const PhotoDetail = ({ list, index, setIndex, uid, saved, onClose }) => {
    const { user, isAdmin } = useAuth();
    const toast = useToast();
    const [editOpen, setEditOpen] = useState(false);
    const p = list[index];
    const touch = useRef(null);
    if (!p) return null;
    const canEdit = isAdmin || p.uploadedBy === user.uid; // 등록자 또는 관리자

    const prev = () => setIndex((i) => (i > 0 ? i - 1 : i));
    const next = () => setIndex((i) => (i < list.length - 1 ? i + 1 : i));
    const onTouchStart = (e) => touch.current = e.touches[0].clientX;
    const onTouchEnd = (e) => {
      if (touch.current == null) return;
      const dx = e.changedTouches[0].clientX - touch.current;
      if (dx > 50) prev(); else if (dx < -50) next();
      touch.current = null;
    };
    const catLabel = { ultrasound: "초음파", baby: "아기사진", milestone: "성장기록" }[p.category] || p.category;

    const download = async () => {
      try {
        const res = await fetch(p.url); const blob = await res.blob();
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
        a.download = `baby_${p.id}.jpg`; a.click(); URL.revokeObjectURL(a.href);
      } catch { window.open(p.url, "_blank"); }
    };
    const remove = async () => {
      if (!confirm("이 사진을 삭제할까요?")) return;
      try {
        if (p.storagePath) await storage.ref(p.storagePath).delete().catch(() => {});
        await COL.photos().doc(p.id).delete();
        toast("삭제되었습니다.", "success"); onClose();
      } catch (e) { toast(errMsg(e), "error"); }
    };

    return (
      <div className="fixed inset-0 z-50 bg-black flex flex-col fade-in" role="dialog" aria-modal="true" aria-label="사진 상세">
        <div className="flex justify-between items-center p-3 text-white">
          <span className="text-sm">{index + 1} / {list.length}</span>
          <button onClick={onClose} aria-label="닫기" className="text-3xl w-10 h-10">×</button>
        </div>
        <div className="flex-1 flex items-center justify-center relative" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          <button onClick={prev} aria-label="이전 사진" disabled={index === 0} className="absolute left-2 text-white text-4xl w-12 h-12 disabled:opacity-20 z-10">‹</button>
          <img src={p.url} alt={p.caption || "사진"} className="max-h-full max-w-full object-contain" />
          <button onClick={next} aria-label="다음 사진" disabled={index === list.length - 1} className="absolute right-2 text-white text-4xl w-12 h-12 disabled:opacity-20 z-10">›</button>
        </div>
        <div className="bg-white dark:bg-slate-800 p-4 space-y-3">
          <div className="flex items-center justify-between">
            <div>
              <p className="font-medium text-slate-800 dark:text-white">{p.uploaderName} · {catLabel}</p>
              <p className="text-xs text-slate-400">{fmtDateTime(p.createdAt)}</p>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={() => toggleLike(p, uid)} aria-label={isLikedBy(p, uid) ? "좋아요 취소" : "좋아요"} className="flex items-center gap-1 text-lg">
                <span aria-hidden="true">{isLikedBy(p, uid) ? "❤️" : "🤍"}</span><span className="text-sm text-slate-500">{likeCountOf(p)}</span>
              </button>
              <button onClick={() => toggleSave(p, uid)} aria-label="저장" className="text-lg" aria-hidden="true">{saved.has(p.id) ? "🔖" : "🏷️"}</button>
            </div>
          </div>
          {p.caption && <p className="text-sm text-slate-600 dark:text-slate-300">{p.caption}</p>}
          {(p.people && p.people.length > 0) && (
            <p className="text-sm text-slate-500 dark:text-slate-400">👨‍👩‍👧 함께: {p.people.join(", ")}</p>
          )}
          {p.place && <p className="text-sm text-slate-500 dark:text-slate-400">📍 {p.place}
            {p.gps && <a href={`https://maps.google.com/?q=${p.gps.lat},${p.gps.lng}`} target="_blank" rel="noopener" className="text-teal-500 ml-1 underline">지도</a>}
          </p>}
          {p.takenAt && <p className="text-xs text-slate-400">📅 촬영: {fmtDateTime(p.takenAt)}</p>}
          <div className="flex gap-2">
            <Btn variant="ghost" onClick={download} className="flex-1 text-sm py-2.5">⬇️ 다운로드</Btn>
            {canEdit && <Btn variant="lavender" onClick={() => setEditOpen(true)} className="flex-1 text-sm py-2.5">✏️ 수정</Btn>}
            {canEdit && <Btn variant="danger" onClick={remove} className="flex-1 text-sm py-2.5">🗑️ 삭제</Btn>}
          </div>
          {!canEdit && <p className="text-[11px] text-slate-400 text-center">수정·삭제는 사진을 올린 사람 또는 관리자만 할 수 있어요.</p>}
        </div>
        <EditPhotoModal open={editOpen} onClose={() => setEditOpen(false)} photo={p} />
      </div>
    );
  };

  /* ========================================================================
     21-b. 사진 정보 수정 모달 (등록자 또는 관리자)
     ======================================================================== */
  const EditPhotoModal = ({ open, onClose, photo }) => {
    const toast = useToast();
    const [caption, setCaption] = useState("");
    const [category, setCategory] = useState("baby");
    const [people, setPeople] = useState([]);
    const [personInput, setPersonInput] = useState("");
    const [place, setPlace] = useState("");
    const [vis, setVis] = useState("public");
    const [busy, setBusy] = useState(false);

    useEffect(() => {
      if (!open || !photo) return;
      setCaption(photo.caption || ""); setCategory(photo.category || "baby");
      setPeople(photo.people || []); setPersonInput(""); setPlace(photo.place || "");
      setVis(photo.vis === "private" ? "private" : "public");
    }, [open, photo && photo.id]);

    const addPerson = () => {
      const n = personInput.trim();
      if (n && !people.includes(n)) setPeople((p) => [...p, n]);
      setPersonInput("");
    };
    const save = async () => {
      setBusy(true);
      try {
        await COL.photos().doc(photo.id).update({
          caption, category, people, place, placeLower: (place || "").toLowerCase(), vis,
        });
        toast("사진 정보를 수정했어요.", "success");
        onClose();
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    return (
      <Modal open={open} onClose={onClose} title="✏️ 사진 정보 수정">
        <div className="space-y-4">
          <ChipGroup label="공개 범위" value={vis} onChange={setVis}
            options={[{ value: "public", label: "🌐 전체공개" }, { value: "private", label: "🔒 나만보기" }]} />
          <ChipGroup label="카테고리" value={category} onChange={setCategory}
            options={[{ value: "ultrasound", label: "초음파" }, { value: "baby", label: "아기사진" }, { value: "milestone", label: "성장기록" }]} />
          <Field label="캡션"><input className={inputCls} value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="사진 설명" /></Field>
          <div>
            <span className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">함께한 사람</span>
            {people.length > 0 && (
              <div className="flex flex-wrap gap-2 mb-2">
                {people.map((n) => (
                  <span key={n} className="px-3 py-1.5 rounded-full text-sm bg-violet-400 text-white flex items-center gap-1">
                    {n}<button type="button" onClick={() => setPeople((p) => p.filter((x) => x !== n))} aria-label={`${n} 제거`}>×</button>
                  </span>
                ))}
              </div>
            )}
            <div className="flex gap-2">
              <input className={inputCls} value={personInput} onChange={(e) => setPersonInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && (e.preventDefault(), addPerson())} placeholder="이름 추가" />
              <button type="button" onClick={addPerson} className="whitespace-nowrap px-3 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-sm">추가</button>
            </div>
          </div>
          <Field label="장소 / 지역"><input className={inputCls} value={place} onChange={(e) => setPlace(e.target.value)} placeholder="예: 서울 할머니댁" /></Field>
          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "저장"}</Btn>
        </div>
      </Modal>
    );
  };

  /* ========================================================================
     22. 내 저장 탭
     ======================================================================== */
  const Saved = () => {
    const { user, isAdmin } = useAuth();
    const { docs } = useMySaved(user.uid);
    const [photos, setPhotos] = useState({}); // id -> 최신 photo
    const [detail, setDetail] = useState(null);

    // 저장한 사진의 최신 메타(좋아요 수 등)를 photos에서 가져옴
    useEffect(() => {
      let active = true;
      Promise.all(docs.map((d) => COL.photos().doc(d.photoRef || d.id).get()))
        .then((snaps) => {
          if (!active) return;
          const m = {};
          snaps.forEach((s) => { if (s.exists) m[s.id] = { id: s.id, ...s.data() }; });
          setPhotos(m);
        });
      return () => { active = false; };
    }, [docs.map((d) => d.id).join(",")]);

    const list = docs.map((d) => photos[d.photoRef || d.id]).filter(Boolean)
      .filter((p) => p.category !== "ultrasound" && canSeePhoto(p, user.uid, isAdmin)); // 초음파는 임신 페이지에서만
    const savedSet = new Set(docs.map((d) => d.id));

    return (
      <div className="p-4 space-y-3 pb-safe">
        <h2 className="font-bold text-lg text-slate-800 dark:text-white">🔖 내 저장</h2>
        {docs.length === 0 ? (
          <Card className="p-8 text-center text-sm text-slate-400">저장한 사진이 없어요.<br />갤러리에서 🔖 버튼으로 저장해보세요.</Card>
        ) : list.length === 0 ? <Spinner /> : (
          <div className="grid grid-cols-3 gap-2">
            {list.map((p, i) => (
              <PhotoCard key={p.id} photo={p} uid={user.uid} saved={savedSet.has(p.id)} onOpen={() => setDetail(i)} />
            ))}
          </div>
        )}
        {detail != null && (
          <PhotoDetail list={list} index={detail} setIndex={setDetail} uid={user.uid} saved={savedSet} onClose={() => setDetail(null)} />
        )}
      </div>
    );
  };

  // 관리자 답장 입력 (편지 작성자와 관리자만 답장을 봄)
  const ReplyBox = ({ letter, onSaved }) => {
    const { profile } = useAuth();
    const toast = useToast();
    const [text, setText] = useState(letter.reply || "");
    const [busy, setBusy] = useState(false);
    useEffect(() => { setText(letter.reply || ""); }, [letter.id]);
    const save = async () => {
      if (!text.trim()) { toast("답장을 입력해주세요.", "error"); return; }
      setBusy(true);
      try {
        const r = { reply: text.trim(), replyBy: (profile && profile.name) || "관리자", replyAt: TS() };
        await COL.records().doc(letter.id).update(r);
        toast("답장을 남겼어요 💜", "success");
        onSaved && onSaved({ ...r, replyAt: new Date() });
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };
    return (
      <div className="border-t border-slate-100 dark:border-slate-700 pt-3">
        <p className="text-xs font-medium text-violet-500 mb-1.5">💜 답장 쓰기 (작성자만 볼 수 있어요)</p>
        <textarea className={inputCls} rows="3" value={text} onChange={(e) => setText(e.target.value)} placeholder="따뜻한 답장을 남겨보세요..." />
        <Btn variant="lavender" onClick={save} disabled={busy} className="w-full mt-2 text-sm py-2.5">{busy ? "저장 중..." : (letter.reply ? "답장 수정" : "답장 보내기")}</Btn>
      </div>
    );
  };

  /* ========================================================================
     22-b. 💌 편지 (아기에게 보내는 편지 + 이미지 첨부)
        records 컬렉션에 type:"letter" 로 저장 (보안규칙/리스너 재사용)
     ======================================================================== */
  const Letters = () => {
    const { user, profile, isAdmin } = useAuth();
    const all = useRecords("letter", 100);
    const visible = all && all.filter((l) => canSeeLetter(l, user.uid, isAdmin)); // 공개 범위 필터
    const [who, setWho] = useState("all"); // 등록자별 필터
    const items = visible && (who === "all" ? visible : visible.filter((l) => l.createdBy === who));
    const [editorOpen, setEditorOpen] = useState(false);
    const [editing, setEditing] = useState(null); // 수정할 편지
    const [viewing, setViewing] = useState(null); // 열람할 편지

    // 등록자 목록 (보이는 편지 기준)
    const authors = useMemo(() => {
      const m = new Map();
      (visible || []).forEach((l) => { if (l.createdBy) m.set(l.createdBy, l.creatorName || "이름없음"); });
      return [...m.entries()];
    }, [visible]);

    const openNew = () => { setEditing(null); setEditorOpen(true); };
    const openEdit = (l) => { setEditing(l); setEditorOpen(true); };

    return (
      <div className="p-4 space-y-4 pb-safe">
        <div className="flex items-center justify-between">
          <div>
            <h2 className="font-bold text-lg text-slate-800 dark:text-white">💌 편지</h2>
            <p className="text-xs text-slate-400">우리 아기에게 마음을 남겨보세요</p>
          </div>
          <Btn onClick={openNew} className="text-sm py-2 px-3">+ 편지 쓰기</Btn>
        </div>

        {/* 등록자별 필터 */}
        {authors.length > 1 && (
          <select value={who} onChange={(e) => setWho(e.target.value)} aria-label="등록자별 보기" className={inputCls + " py-2 text-sm"}>
            <option value="all">✍️ 전체 등록자</option>
            {authors.map(([uid, nm]) => <option key={uid} value={uid}>{nm}</option>)}
          </select>
        )}

        {!items ? <Spinner /> : items.length === 0 ? (
          <Card className="p-8 text-center text-sm text-slate-400">아직 편지가 없어요.<br />첫 편지를 남겨보세요 💛</Card>
        ) : (
          <div className="space-y-3">
            {items.map((l) => (
              <Card key={l.id} className="overflow-hidden active:scale-[.99] transition">
                <button onClick={() => setViewing(l)} className="block w-full text-left">
                  {l.image && <img src={l.image} alt="" className="w-full max-h-48 object-cover" />}
                  <div className="p-4">
                    <div className="flex items-center justify-between mb-1 gap-2">
                      <h3 className="font-bold text-slate-800 dark:text-white truncate">{isPrivate(l) && "🔒 "}{l.title || "(제목 없음)"}</h3>
                      <div className="flex items-center gap-1 shrink-0">
                        {l.reply && (isAdmin || l.createdBy === user.uid) && <span className="text-[10px] bg-violet-100 text-violet-600 dark:bg-violet-900/40 rounded-full px-1.5 py-0.5">💜 답장</span>}
                        {l.image && <span className="text-xs text-slate-300">🖼️</span>}
                      </div>
                    </div>
                    <p className="text-sm text-slate-500 dark:text-slate-300 line-clamp-2" style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{l.body}</p>
                    <p className="text-[11px] text-slate-400 mt-2">💛 {l.creatorName} · {fmtDateTime(l.at)}{isPrivate(l) && " · 나만보기"}</p>
                  </div>
                </button>
              </Card>
            ))}
          </div>
        )}

        {/* 편지 열람 모달 */}
        <Modal open={!!viewing} onClose={() => setViewing(null)} title="💌 편지">
          {viewing && (
            <div className="space-y-3">
              {viewing.image && <img src={viewing.image} alt="첨부 이미지" className="w-full rounded-xl" />}
              <h3 className="text-lg font-bold text-slate-800 dark:text-white">{viewing.title || "(제목 없음)"}</h3>
              <p className="text-[11px] text-slate-400">💛 {viewing.creatorName} · {fmtDateTime(viewing.at)}</p>
              <p className="text-sm text-slate-700 dark:text-slate-200 whitespace-pre-wrap leading-relaxed">{viewing.body}</p>

              {/* 답장: 편지 작성자와 관리자만 볼 수 있음 */}
              {viewing.reply && (isAdmin || viewing.createdBy === user.uid) && (
                <div className="bg-violet-50 dark:bg-violet-900/20 rounded-xl p-3">
                  <p className="text-[11px] text-violet-500 mb-1">💜 {viewing.replyBy || "관리자"}의 답장 · {fmtDateTime(viewing.replyAt)}</p>
                  <p className="text-sm text-slate-700 dark:text-slate-200 whitespace-pre-wrap">{viewing.reply}</p>
                </div>
              )}
              {isAdmin && <ReplyBox letter={viewing} onSaved={(r) => setViewing({ ...viewing, ...r })} />}

              {(isAdmin || viewing.createdBy === user.uid) && (
                <div className="flex gap-2 pt-2">
                  <Btn variant="lavender" className="flex-1 text-sm py-2.5" onClick={() => { const l = viewing; setViewing(null); openEdit(l); }}>✏️ 수정</Btn>
                  <Btn variant="danger" className="flex-1 text-sm py-2.5" onClick={() => { if (confirm("이 편지를 삭제할까요?")) { deleteRecord(viewing.id); if (viewing.createdBy) COL.users().doc(viewing.createdBy).update({ letterCount: firebase.firestore.FieldValue.increment(-1) }).catch(() => {}); setViewing(null); } }}>🗑️ 삭제</Btn>
                </div>
              )}
            </div>
          )}
        </Modal>

        <LetterEditor open={editorOpen} onClose={() => setEditorOpen(false)} letter={editing} />
      </div>
    );
  };

  // 편지 작성/수정 모달
  const LetterEditor = ({ open, onClose, letter }) => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const [title, setTitle] = useState("");
    const [body, setBody] = useState("");
    const [image, setImage] = useState(null); // dataURL
    const [vis, setVis] = useState("private"); // 편지는 기본 나만보기
    const [busy, setBusy] = useState(false);
    const fileRef = useRef();
    const camRef = useRef();

    useEffect(() => {
      if (!open) return;
      setTitle((letter && letter.title) || "");
      setBody((letter && letter.body) || "");
      setImage((letter && letter.image) || null);
      setVis(letter ? (letter.vis === "public" ? "public" : "private") : "private");
      setBusy(false);
    }, [open, letter && letter.id]);

    const pickImage = async (e) => {
      const f = (e.target.files || [])[0];
      if (!f) return;
      try { setBusy(true); setImage(await compressToDataURL(f)); }
      catch (ex) { toast(errMsg(ex), "error"); }
      finally { setBusy(false); }
    };

    const save = async () => {
      if (!body.trim() && !title.trim()) { toast("내용을 입력해주세요.", "error"); return; }
      setBusy(true);
      try {
        if (letter) {
          await COL.records().doc(letter.id).update({ title, body, image: image || null, vis });
          toast("편지를 수정했어요.", "success");
        } else {
          await addRecord("letter", { title, body, image: image || null, vis, at: TS() }, user, profile);
          // 편지 횟수 +1 (메달용)
          await COL.users().doc(user.uid).update({ letterCount: firebase.firestore.FieldValue.increment(1) }).catch(() => {});
          toast("편지를 남겼어요 💛", "success");
        }
        onClose();
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    return (
      <Modal open={open} onClose={onClose} title={letter ? "✏️ 편지 수정" : "💌 편지 쓰기"}>
        <div className="space-y-4">
          <ChipGroup label="공개 범위" value={vis} onChange={setVis}
            options={[{ value: "private", label: "🔒 나만보기" }, { value: "public", label: "🌐 전체공개" }]} />
          <p className="text-[11px] text-slate-400 -mt-1">나만보기는 본인과 관리자(엄마·아빠)만 볼 수 있어요.</p>
          <Field label="제목"><input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="사랑하는 우리 아기에게" /></Field>
          <Field label="내용">
            <textarea className={inputCls} rows="7" value={body} onChange={(e) => setBody(e.target.value)} placeholder="오늘 너에게 하고 싶은 이야기를 적어보세요..." />
          </Field>

          {/* 이미지 첨부 */}
          <input ref={fileRef} type="file" accept="image/*" onChange={pickImage} className="hidden" />
          <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={pickImage} className="hidden" />
          {image ? (
            <div className="relative">
              <img src={image} alt="첨부 미리보기" className="w-full rounded-xl" />
              <button onClick={() => setImage(null)} aria-label="이미지 제거"
                className="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/50 text-white text-lg">×</button>
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              <button onClick={() => fileRef.current.click()} className="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl py-5 text-center text-slate-400 hover:border-teal-400 hover:text-teal-500 transition">
                <div className="text-2xl mb-1" aria-hidden="true">🖼️</div><p className="text-sm">사진 첨부</p>
              </button>
              <button onClick={() => camRef.current.click()} className="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl py-5 text-center text-slate-400 hover:border-teal-400 hover:text-teal-500 transition">
                <div className="text-2xl mb-1" aria-hidden="true">📷</div><p className="text-sm">사진 촬영</p>
              </button>
            </div>
          )}

          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : (letter ? "수정 저장" : "편지 남기기")}</Btn>
        </div>
      </Modal>
    );
  };

  /* ========================================================================
     22-d. 🏅 메달 (성과 배지)
     ======================================================================== */
  const MedalGrid = ({ u }) => {
    const s = medalStats(u);
    return (
      <div className="grid grid-cols-3 gap-2">
        {MEDALS.map((m) => {
          const val = s[m.type]; const got = val >= m.goal;
          const pct = Math.min(100, Math.round((val / m.goal) * 100));
          return (
            <div key={m.id} className={`rounded-xl p-2 text-center border ${got ? "bg-amber-50 border-amber-200 dark:bg-amber-900/20 dark:border-amber-800" : "bg-slate-50 border-slate-100 dark:bg-slate-700/40 dark:border-slate-700"}`}>
              <div className="text-2xl" style={got ? {} : { filter: "grayscale(1)", opacity: 0.45 }}>{m.icon}</div>
              <p className="text-[11px] font-medium text-slate-700 dark:text-slate-200 mt-0.5 leading-tight">{m.name}</p>
              <p className="text-[10px] text-slate-400">{m.desc}</p>
              <div className="h-1 bg-slate-200 dark:bg-slate-600 rounded mt-1 overflow-hidden"><div className="h-full bg-amber-400" style={{ width: pct + "%" }} /></div>
              <p className="text-[9px] text-slate-400 mt-0.5">{Math.min(val, m.goal)}/{m.goal}</p>
            </div>
          );
        })}
      </div>
    );
  };
  // 새 메달 획득 시 축하 토스트 (모든 역할 공통)
  const MedalWatcher = () => {
    const { profile } = useAuth();
    const toast = useToast();
    const seen = useRef(null);
    useEffect(() => {
      if (!profile) return;
      const ids = earnedMedals(profile).map((m) => m.id);
      if (seen.current === null) { seen.current = new Set(ids); return; } // 최초 진입 시엔 알림 안 함
      earnedMedals(profile).forEach((m) => { if (!seen.current.has(m.id)) toast(`🎉 새 메달 획득! ${m.icon} ${m.name}`, "success"); });
      seen.current = new Set(ids);
    }, [profile && (profile.loginDays || []).length, profile && profile.letterCount]);
    return null;
  };

  const MyMedals = () => {
    const { profile } = useAuth();
    const s = medalStats(profile);
    return (
      <Card className="p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-bold text-slate-800 dark:text-white">🏅 내 메달</h3>
          <span className="text-xs text-slate-400">접속 {s.login}일 · 편지 {s.letter}회</span>
        </div>
        <MedalGrid u={profile} />
      </Card>
    );
  };

  // 사용자별 현황 (접속기록 + 활동기록)
  const UserStatusModal = ({ open, onClose, u }) => {
    const [recs, setRecs] = useState(null);
    const [photoN, setPhotoN] = useState(0);
    useEffect(() => {
      if (!open || !u) return;
      setRecs(null); setPhotoN(0);
      Promise.all([
        COL.records().where("createdBy", "==", u.uid).limit(300).get(),
        COL.photos().where("uploadedBy", "==", u.uid).limit(300).get(),
      ]).then(([rs, ps]) => {
        setRecs(rs.docs.map((d) => ({ id: d.id, ...d.data() })));
        setPhotoN(ps.size);
      }).catch(() => setRecs([]));
    }, [open, u && u.uid]);
    if (!u) return null;
    const cnt = (t) => (recs || []).filter((r) => r.type === t).length;
    const recentDays = (u.loginDays || []).slice().sort().reverse().slice(0, 14);
    const recent = [...(recs || [])].sort((a, b) => toDate(b.createdAt || b.at) - toDate(a.createdAt || a.at)).slice(0, 12);
    const TLABEL = { feeding: "🍼 수유", sleep: "😴 수면", diaper: "👶 기저귀", growth: "📏 성장", health: "🩺 건강", letter: "💌 편지", prenatal: "🔬 초음파" };
    return (
      <Modal open={open} onClose={onClose} title={`${u.name} 현황`}>
        <div className="space-y-4">
          <div>
            <p className="text-xs text-slate-400">{u.email} · {roleLabel(u.role)}</p>
          </div>
          {/* 메달 */}
          <MedalGrid u={u} />
          {/* 접속 기록 */}
          <div>
            <h4 className="text-sm font-bold text-slate-700 dark:text-slate-200 mb-1">🗓️ 접속 기록 · 총 {(u.loginDays || []).length}일</h4>
            {recentDays.length === 0 ? <p className="text-xs text-slate-400">기록 없음</p> : (
              <div className="flex flex-wrap gap-1">
                {recentDays.map((d) => <span key={d} className="text-[11px] bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 rounded px-1.5 py-0.5">{d.slice(5)}</span>)}
              </div>
            )}
          </div>
          {/* 활동 통계 */}
          <div>
            <h4 className="text-sm font-bold text-slate-700 dark:text-slate-200 mb-1">📊 활동 기록</h4>
            {recs == null ? <Spinner /> : (
              <>
                <div className="grid grid-cols-4 gap-2 text-center">
                  {[["feeding", "수유"], ["sleep", "수면"], ["diaper", "기저귀"], ["growth", "성장"], ["health", "건강"], ["prenatal", "초음파"], ["letter", "편지"]].map(([t, l]) => (
                    <div key={t} className="bg-slate-50 dark:bg-slate-700/40 rounded-lg py-1.5">
                      <p className="text-sm font-bold text-slate-700 dark:text-slate-200">{t === "letter" ? (u.letterCount || cnt("letter")) : cnt(t)}</p>
                      <p className="text-[10px] text-slate-400">{l}</p>
                    </div>
                  ))}
                  <div className="bg-slate-50 dark:bg-slate-700/40 rounded-lg py-1.5">
                    <p className="text-sm font-bold text-slate-700 dark:text-slate-200">{photoN}</p>
                    <p className="text-[10px] text-slate-400">사진</p>
                  </div>
                </div>
                {/* 최근 활동 */}
                {recent.length > 0 && (
                  <ul className="mt-3 divide-y divide-slate-100 dark:divide-slate-700">
                    {recent.map((r) => (
                      <li key={r.id} className="flex items-center justify-between py-1.5 text-xs">

  // 계정 추가 모달 — createUserWithEmailAndPassword
  const AddAccountModal = ({ open, onClose }) => {
    const toast = useToast();
    const [f, setF] = useState({ email: "", pw: "", name: "", role: "member" });
    const [busy, setBusy] = useState(false);
    const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));

    const create = async () => {
      if (!f.email || !f.pw || !f.name) { toast("모든 항목을 입력하세요.", "error"); return; }
      setBusy(true);
      // 주의: createUserWithEmailAndPassword 는 현재 로그인 세션을 새 계정으로 바꿔버림.
      // 이를 막기 위해 보조(secondary) 앱 인스턴스로 생성 → 관리자 세션 유지
      let secondary;
      try {
        secondary = firebase.initializeApp(firebaseConfig, "secondary_" + Date.now());
        const cred = await secondary.auth().createUserWithEmailAndPassword(f.email.trim(), f.pw);
        await COL.users().doc(cred.user.uid).set({
          email: f.email.trim(), name: f.name, role: f.role, approved: true, disabled: false, createdAt: TS(),
        });
        await secondary.auth().signOut();
        toast(`${f.name} 계정을 생성했어요.`, "success");
        setF({ email: "", pw: "", name: "", role: "member" });
        onClose();
      } catch (e) { toast(errMsg(e), "error"); }
      finally { if (secondary) await secondary.delete().catch(() => {}); setBusy(false); }
    };

    return (
      <Modal open={open} onClose={onClose} title="계정 추가">
        <div className="space-y-3">
          <Field label="이메일"><input className={inputCls} type="email" value={f.email} onChange={set("email")} placeholder="grandma1@baby.app" /></Field>

        </div>
      </Modal>
    );
  };

  // 한 화면의 오류가 앱 전체를 끄지 않도록 보호
  class ErrorBoundary extends React.Component {
    constructor(p) { super(p); this.state = { err: null }; }
    static getDerivedStateFromError(err) { return { err }; }
    componentDidCatch(err, info) { console.error("ErrorBoundary:", err, info); }
    render() {
      if (this.state.err) {
        return (
          <div className="app-shell flex flex-col items-center justify-center text-center p-8 bg-warm" style={{ minHeight: "100vh" }}>
            <div className="text-5xl mb-3">🙏</div>
            <p className="font-bold text-slate-800 dark:text-white">일시적인 오류가 발생했어요</p>
            <pre className="text-[11px] text-slate-400 mt-2 whitespace-pre-wrap max-w-full overflow-auto">{(this.state.err && (this.state.err.message || String(this.state.err)))}</pre>
            <button onClick={() => this.setState({ err: null })} className="mt-4 px-5 py-3 rounded-xl bg-teal-500 text-white">다시 시도</button>
            <button onClick={() => location.reload()} className="mt-2 px-5 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-sm">새로고침</button>
          </div>
        );
      }
      return this.props.children;
    }
  }

  const App = () => {
    if (!fbReady) return <ToastProvider><ConfigNeeded /></ToastProvider>;
    return (
      <ErrorBoundary>
        <ToastProvider>
          <AuthProvider>
            <Root />
          </AuthProvider>
        </ToastProvider>
      </ErrorBoundary>
    );
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
