      if (!root || root.childElementCount > 0) return; // 이미 앱이 떠 있으면 무시
      root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#b91c1c">'

    };
    window.addEventListener("error", function (e) {
      var d = (e && (e.message || (e.error && (e.error.stack || e.error.message)))) || 'Script error.';

    });
    window.addEventListener("unhandledrejection", function (e) {
      var r = e && e.reason; window.__showFatal('앱 로딩 중 오류(비동기)', (r && (r.stack || r.message)) || String(r));
    });
    // 핵심 CDN 로드 확인 (모두 로드된 뒤 점검)
    window.addEventListener("load", function () {
      setTimeout(function () {
        var miss = [];
        if (!window.React) miss.push('React');
        if (!window.ReactDOM) miss.push('ReactDOM');
        if (!window.Babel) miss.push('Babel');
        if (!window.firebase) miss.push('Firebase');
        if (miss.length) window.__showFatal('필수 구성요소 로드 실패', '로드되지 않음: ' + miss.join(', ') + '\n(네트워크/CDN 문제)');
      }, 1500);
    });
  </script>

  <!--
  ============================================================================
  🔥 Firestore Security Rules  (Firebase 콘솔 > Firestore > 규칙 에 붙여넣기)
  ----------------------------------------------------------------------------
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      function isSignedIn() { return request.auth != null; }
      function isAdmin() {
        return isSignedIn() &&
          get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin';
      }
      // 육아 공유 기록(수유·수면·기저귀·성장·건강·초음파): 로그인 사용자 읽기/쓰기
      match /records/{document=**} {
        allow read, write: if isSignedIn();
      }
      // 앱 설정(아기 정보 등): 로그인 읽기, 관리자만 쓰기
      match /settings/{docId} {
        allow read: if isSignedIn();
        allow write: if isAdmin();
      }
      // 사진: 로그인 읽기/생성, 업로더 본인 또는 관리자만 삭제
      match /photos/{photoId} {
        allow read: if isSignedIn();
        allow create: if isSignedIn();
        allow update: if isSignedIn(); // likeCount 트랜잭션 갱신
        allow delete: if isSignedIn() &&
          (resource.data.uploadedBy == request.auth.uid || isAdmin());
        // 좋아요: 본인 문서만 쓰기
        match /likes/{uid} {
          allow read: if isSignedIn();
          allow write: if request.auth.uid == uid;
        }
      }
      // 유저 정보: 로그인 읽기, 본인 또는 관리자만 쓰기
      match /users/{uid} {
        allow read: if isSignedIn();
        allow write: if request.auth.uid == uid || isAdmin();
        // 저장한 사진: 본인만 읽기/쓰기
        match /savedPhotos/{photoId} {
          allow read, write: if request.auth.uid == uid;
        }
      }
    }
  }

  ============================================================================
  🔥 Storage Security Rules  (Firebase 콘솔 > Storage > 규칙 에 붙여넣기)
  ----------------------------------------------------------------------------
  rules_version = '2';
  service firebase.storage {
    match /b/{bucket}/o {
      match /photos/{allPaths=**} {
        // 인증된 사용자만 읽기/쓰기 (10MB 이하 이미지)
        allow read: if request.auth != null;
        allow write: if request.auth != null
          && request.resource.size < 10 * 1024 * 1024
          && request.resource.contentType.matches('image/.*');
      }
    }
  }
  ============================================================================
  -->

  <script type="text/babel" data-presets="react">
  /* global React, ReactDOM, firebase, Recharts, firebaseConfig, BABY_DEFAULTS */
  const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;
  // Recharts가 CDN에서 안 떠도 앱 전체가 멈추지 않도록 대체 컴포넌트 사용
  const RC = window.Recharts || {};
  const chartsOK = !!RC.ResponsiveContainer;
  const NullCmp = () => null; // 차트 미로딩 시 내부 요소는 무시
  const ChartFallback = () => (
    <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: "#94a3b8", fontSize: 12 }}>
      차트를 불러오지 못했어요 (인터넷 연결 확인)
    </div>
  );
  const LineChart = RC.LineChart || ChartFallback;
  const BarChart = RC.BarChart || ChartFallback;
  const ResponsiveContainer = RC.ResponsiveContainer || (({ children }) => <div style={{ width: "100%", height: "100%" }}>{children}</div>);
  const Line = RC.Line || NullCmp, Bar = RC.Bar || NullCmp;
  const XAxis = RC.XAxis || NullCmp, YAxis = RC.YAxis || NullCmp;
  const CartesianGrid = RC.CartesianGrid || NullCmp, Tooltip = RC.Tooltip || NullCmp;
  const ReferenceLine = RC.ReferenceLine || NullCmp, ReferenceArea = RC.ReferenceArea || NullCmp, Legend = RC.Legend || NullCmp;

  /* ========================================================================
     0. 유틸리티 & 상수
     ======================================================================== */

  // Firebase 설정이 플레이스홀더 그대로인지 확인
  const isFirebaseConfigured = () =>
    firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_") &&
    firebaseConfig.projectId && !firebaseConfig.projectId.startsWith("YOUR_");

  // Firebase 에러 코드 → 한국어 메시지 (시니어 검토 #6)
  const AUTH_ERRORS = {
    "auth/invalid-email": "이메일 형식이 올바르지 않습니다.",
    "auth/user-disabled": "비활성화된 계정입니다. 관리자에게 문의하세요.",
    "auth/user-not-found": "등록되지 않은 이메일입니다.",
    "auth/wrong-password": "비밀번호가 일치하지 않습니다.",
    "auth/invalid-credential": "이메일 또는 비밀번호가 올바르지 않습니다.",
    "auth/too-many-requests": "로그인 시도가 너무 많습니다. 잠시 후 다시 시도하세요.",
    "auth/email-already-in-use": "이미 사용 중인 이메일입니다.",
    "auth/weak-password": "비밀번호는 6자 이상이어야 합니다.",
    "auth/network-request-failed": "네트워크 연결을 확인해주세요.",
    "auth/missing-password": "비밀번호를 입력해주세요.",
    "storage/unauthorized": "업로드 권한이 없습니다. 로그인 상태를 확인하세요.",
    "storage/canceled": "업로드가 취소되었습니다.",
    "permission-denied": "접근 권한이 없습니다. 보안 규칙을 확인하세요.",
  };
  const errMsg = (e) => AUTH_ERRORS[e && e.code] || (e && e.message) || "알 수 없는 오류가 발생했습니다.";

  // 계정 등급: 관리자 / 구성원(기록 가능) / 관람전용(사진만 보기, 이모·삼촌용)
  const ROLE_LABEL = { admin: "관리자", member: "구성원", viewer: "관람전용" };
  const roleLabel = (r) => ROLE_LABEL[r] || "구성원";

  // 🏅 메달(성과): 접속 일수 / 편지 횟수 기준
  const MEDALS = [
    { id: "login3", icon: "🌱", name: "첫 발걸음", type: "login", goal: 3, desc: "3일 접속" },
    { id: "login10", icon: "🔥", name: "꾸준한 사랑", type: "login", goal: 10, desc: "10일 접속" },
    { id: "login30", icon: "👑", name: "한결같은 마음", type: "login", goal: 30, desc: "30일 접속" },
    { id: "letter1", icon: "💌", name: "첫 편지", type: "letter", goal: 1, desc: "편지 1회" },
    { id: "letter10", icon: "✍️", name: "편지왕", type: "letter", goal: 10, desc: "편지 10회" },
    { id: "letter30", icon: "🏆", name: "마음 부자", type: "letter", goal: 30, desc: "편지 30회" },
  ];
  const medalStats = (u) => ({ login: (u && u.loginDays ? u.loginDays.length : 0), letter: (u && u.letterCount) || 0 });
  const earnedMedals = (u) => { const s = medalStats(u); return MEDALS.filter((m) => s[m.type] >= m.goal); };

  // Firestore Timestamp ↔ JS Date 일관 변환 (시니어 검토 #9)
  const toDate = (v) => {
    if (!v) return null;
    if (v instanceof Date) return v;
    if (typeof v.toDate === "function") return v.toDate(); // Firestore Timestamp
    if (typeof v === "number") return new Date(v);
    if (typeof v === "string") return new Date(v);
    if (v.seconds != null) return new Date(v.seconds * 1000);
    return null;
  };
  const fmtTime = (d) => { d = toDate(d); return d ? d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "-"; };
  const fmtDate = (d) => { d = toDate(d); return d ? d.toLocaleDateString("ko-KR", { month: "long", day: "numeric" }) : "-"; };
  const fmtDateTime = (d) => { d = toDate(d); return d ? `${fmtDate(d)} ${fmtTime(d)}` : "-"; };
  const ymd = (d) => { d = toDate(d) || new Date(); return d.toLocaleDateString("sv-SE"); }; // YYYY-MM-DD(로컬)
  const isSameDay = (a, b) => ymd(a) === ymd(b);

  // datetime-local 입력값(로컬 기준) ↔ Date 변환
  const pad2 = (n) => String(n).padStart(2, "0");
  const toLocalInput = (d) => {
    d = toDate(d) || new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };
  const fromLocalInput = (s) => (s ? new Date(s) : new Date());

  // 경과 시간 사람이 읽기 좋게
  const ago = (d) => {
    d = toDate(d); if (!d) return "";
    const m = Math.floor((Date.now() - d.getTime()) / 60000);
    if (m < 1) return "방금 전";
    if (m < 60) return `${m}분 전`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}시간 ${m % 60}분 전`;
    return `${Math.floor(h / 24)}일 전`;
  };
  const hm = (mins) => `${Math.floor(mins / 60)}시간 ${Math.round(mins % 60)}분`;

  /* ========================================================================
     1. Firebase 초기화 + 오프라인 캐시 (시니어 검토 #4)
     ======================================================================== */
  let auth, db, storage, fbReady = false;
  if (isFirebaseConfigured()) {
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      storage = firebase.storage();
      // Firestore 오프라인 IndexedDB 캐시 (여러 탭 동시 사용 고려)
      db.enablePersistence({ synchronizeTabs: true }).catch((e) => {
        // failed-precondition(여러 탭) / unimplemented(미지원 브라우저)은 무시
        console.warn("오프라인 캐시 비활성:", e.code);
      });
      // 로그인 세션 유지 (localStorage)
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      fbReady = true;
    } catch (e) { console.error("Firebase 초기화 실패", e); }
  }

  const COL = {
    records: () => db.collection("records"),
    photos: () => db.collection("photos"),
    users: () => db.collection("users"),
    settings: () => db.collection("settings").doc("baby"),
  };
  const TS = () => firebase.firestore.FieldValue.serverTimestamp();
  // 로그아웃: 자동 로그인 일시 중단(다음에 직접 로그인하면 재활성화)
  const signOutApp = () => { try { localStorage.setItem("baby-skip-autologin", "1"); } catch (e) {} return auth.signOut(); };

  /* ========================================================================
     2. 공용 UI 컴포넌트
     ======================================================================== */
  const Spinner = ({ label }) => (
    <div className="flex flex-col items-center justify-center gap-3 py-10" role="status" aria-live="polite">
      <div className="w-9 h-9 border-[3px] border-teal-400 border-t-transparent rounded-full animate-spin" aria-hidden="true"></div>
      {label && <p className="text-sm text-slate-500 dark:text-slate-400">{label}</p>}

  );

  const Card = ({ children, className = "" }) => (
    <div className={`bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 ${className}`}>
      {children}
    </div>
  );

  const Btn = ({ children, onClick, variant = "primary", className = "", type = "button", disabled, ...rest }) => {
    const styles = {
      primary: "bg-teal-500 hover:bg-teal-600 text-white",
      lavender: "bg-violet-400 hover:bg-violet-500 text-white",
      ghost: "bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600",
      danger: "bg-rose-500 hover:bg-rose-600 text-white",
    };
    return (
      <button type={type} onClick={onClick} disabled={disabled}
        className={`rounded-xl font-medium px-4 py-3 text-base transition active:scale-[.98] disabled:opacity-50 disabled:active:scale-100 ${styles[variant]} ${className}`}
        {...rest}>
        {children}
      </button>
    );
  };

  // 토스트 알림
  const ToastCtx = createContext(null);
  const useToast = () => useContext(ToastCtx);
  const ToastProvider = ({ children }) => {
    const [toasts, setToasts] = useState([]);
    const push = useCallback((msg, type = "info") => {
      const id = Date.now() + Math.random();
      setToasts((t) => [...t, { id, msg, type }]);
      setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
    }, []);
    return (
      <ToastCtx.Provider value={push}>
        {children}
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-[92%] max-w-[400px]" aria-live="assertive">
          {toasts.map((t) => (
            <div key={t.id} role="alert"
              className={`fade-in px-4 py-3 rounded-xl shadow-lg text-sm text-white ${t.type === "error" ? "bg-rose-500" : t.type === "success" ? "bg-teal-500" : "bg-slate-700"}`}>
              {t.msg}
            </div>
          ))}
        </div>
      </ToastCtx.Provider>
    );
  };

  // 라벨 + 입력 묶음
  const Field = ({ label, children }) => (
    <label className="block">
      <span className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">{label}</span>
      {children}
    </label>
  );
  const inputCls = "w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 dark:text-white px-3.5 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-400";

  // 기록 시간 입력 (기본=지금, 직접 수정 가능)
  const DateTimeField = ({ value, onChange, label = "기록 시간" }) => (
    <Field label={label}>
      <div className="flex gap-2">
        <input className={inputCls} type="datetime-local" value={value} onChange={(e) => onChange(e.target.value)} aria-label={label} />
        <button type="button" onClick={() => onChange(toLocalInput(new Date()))}
          className="whitespace-nowrap px-3 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-sm">지금</button>
      </div>
    </Field>
  );

  // 선택 칩 그룹 (큰 버튼, 한 손 조작)
  const ChipGroup = ({ options, value, onChange, label }) => (
    <div role="radiogroup" aria-label={label}>
      {label && <span className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">{label}</span>}
      <div className="flex flex-wrap gap-2">
        {options.map((o) => {
          const active = value === o.value;
          return (
            <button key={o.value} type="button" role="radio" aria-checked={active}
              onClick={() => onChange(o.value)}
              className={`px-4 py-2.5 rounded-full text-sm font-medium border transition ${active
                ? "bg-teal-500 border-teal-500 text-white"
                : "bg-white dark:bg-slate-700 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300"}`}>
              {o.label}
            </button>
          );
        })}
      </div>
    </div>
  );

  // 모달 셸
  const Modal = ({ open, onClose, children, title, full }) => {
    useEffect(() => {
      if (!open) return;
      const onKey = (e) => e.key === "Escape" && onClose();
      window.addEventListener("keydown", onKey);
      document.body.style.overflow = "hidden";
      return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
    }, [open]);
    if (!open) return null;
    return (
      <div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center fade-in"
        onClick={onClose} role="dialog" aria-modal="true" aria-label={title || "대화상자"}>
        <div onClick={(e) => e.stopPropagation()}
          className={`slide-up bg-white dark:bg-slate-800 w-full ${full ? "h-full max-w-[430px]" : "max-w-[420px] rounded-t-3xl sm:rounded-3xl max-h-[92vh]"} overflow-y-auto`}>
          {title && (
            <div className="sticky top-0 bg-white dark:bg-slate-800 px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between z-10">
              <h2 className="text-lg font-bold text-slate-800 dark:text-white">{title}</h2>
              <button onClick={onClose} aria-label="닫기" className="text-2xl text-slate-400 hover:text-slate-600 w-9 h-9">×</button>
            </div>
          )}
          <div className="p-5">{children}</div>
        </div>
      </div>
    );
  };

  // 의료 면책 배너 (육아 전문가 검토 #1)
  const MedicalDisclaimer = () => (
    <div className="text-[11px] leading-relaxed text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800 rounded-xl p-3">
      ⚠️ 이 앱은 <b>의료 진단 도구가 아닙니다.</b> 기록·참고용이며, 모든 의학적 판단은 반드시 의료진과 상담하세요.
    </div>
  );

  /* ========================================================================
     3. 인증 컨텍스트
     ======================================================================== */
  const AuthCtx = createContext(null);
  const useAuth = () => useContext(AuthCtx);

  const AuthProvider = ({ children }) => {
    const [user, setUser] = useState(undefined); // undefined=로딩, null=비로그인
    const [profile, setProfile] = useState(null); // users/{uid} 문서

    // 이메일이 ADMIN_EMAILS 에 있으면 무조건 관리자 (대소문자 무시)
    const isAdminEmail = (email) =>
      !!email && ADMIN_EMAILS.map((e) => e.toLowerCase()).includes(email.toLowerCase());

    useEffect(() => {
      // onAuthStateChanged 로 로그인 상태 관리 (주의사항)
      const unsub = auth.onAuthStateChanged(async (u) => {
        setUser(u);
        if (!u) { setProfile(null); return; }
        // users/{uid} 프로필 보장 (없으면 생성, 있으면 관리자 이메일 자동 승격)
        const ref = COL.users().doc(u.uid);
        const snap = await ref.get();
        const wantAdmin = isAdminEmail(u.email);
        const today = ymd(new Date());
        try {
          if (!snap.exists) {
            // 새 계정(자가 회원가입): 관람전용 + 승인대기. 관리자 이메일은 즉시 관리자.
            const name = (u.email || "").split("@")[0];
            await ref.set({
              email: u.email, name,
              role: wantAdmin ? "admin" : "viewer",
              approved: wantAdmin ? true : false,
              disabled: false, loginDays: [today], letterCount: 0, createdAt: TS(),
            });
          } else {
            // 접속일 기록(중복 없이) + 관리자 자동 승격
            const data = snap.data();
            const upd = {};
            if (wantAdmin && data.role !== "admin") { upd.role = "admin"; upd.approved = true; }
            if (!(data.loginDays || []).includes(today)) upd.loginDays = firebase.firestore.FieldValue.arrayUnion(today);
            if (Object.keys(upd).length) await ref.update(upd);
          }
        } catch (e) { console.warn("프로필 동기화 실패:", e.code); }
      });
      return () => unsub();
    }, []);

    // 프로필 실시간 구독 (역할 변경 즉시 반영)
    useEffect(() => {
      if (!user) return;
      const unsub = COL.users().doc(user.uid).onSnapshot((s) => setProfile(s.data() || null));
      return () => unsub(); // 언마운트 시 리스너 해제 (시니어 검토 #7)
    }, [user && user.uid]);

    // 클라이언트 관리자 판정: Firestore role 또는 ADMIN_EMAILS 둘 중 하나면 관리자(=총관리자)
    const isAdmin = (profile && profile.role === "admin") || (user && isAdminEmail(user.email));
    // 승인 여부: 관리자거나, approved가 명시적으로 false가 아니면 승인됨(기존 계정 호환)
    const approved = isAdmin || (profile && profile.approved !== false);

    return <AuthCtx.Provider value={{ user, profile, isAdmin, approved }}>{children}</AuthCtx.Provider>;
  };

  /* ========================================================================
     4. 설정(아기 정보) 컨텍스트 — 나이/주수 계산
     ======================================================================== */
  const BabyCtx = createContext(null);
  const useBaby = () => useContext(BabyCtx);
  const BabyProvider = ({ children }) => {
    const [baby, setBaby] = useState(BABY_DEFAULTS);
    useEffect(() => {
      const unsub = COL.settings().onSnapshot((s) => {
        if (s.exists) setBaby({ ...BABY_DEFAULTS, ...s.data() });
      });
      return () => unsub();
    }, []);
    return <BabyCtx.Provider value={baby}>{children}</BabyCtx.Provider>;
  };

  // 아기 나이/임신주수 계산
  const useBabyAge = () => {
    const baby = useBaby();
    return useMemo(() => {
      if (baby.birthDate) {
        const b = new Date(baby.birthDate);
        const days = Math.floor((Date.now() - b.getTime()) / 86400000);
        if (days < 0) return { mode: "born", days: 0, weeks: 0, months: 0, label: "출생 예정일이 아직 오지 않았어요 (날짜 확인)" };
        const weeks = Math.floor(days / 7);
        const months = Math.floor(days / 30.44);
        return { mode: "born", days, weeks, months, label: `생후 ${days}일 (${weeks}주 / 약 ${months}개월)` };
      }
      if (baby.dueDate) {
        // 임신 주수 = 40주 - 출산예정일까지 남은 주
        const due = new Date(baby.dueDate);
        const daysLeft = Math.ceil((due.getTime() - Date.now()) / 86400000);
        const gaDays = 280 - daysLeft;
        const w = Math.floor(gaDays / 7), d = gaDays % 7;
        return { mode: "pregnant", gaDays, gaWeeks: w, label: gaDays > 0 ? `임신 ${w}주 ${d}일` : "출산 예정 정보를 입력하세요", daysLeft };
      }
      return { mode: "unknown", label: "아기 정보를 설정하세요" };
    }, [baby]);
  };

  /* ========================================================================
     5. records 컬렉션 실시간 구독 훅 (타입별)
     ======================================================================== */
  // 현재 시각을 주기적으로 갱신 (경과시간 실시간 표시용)
  const useNow = (intervalMs = 30000) => {
    const [now, setNow] = useState(Date.now());
    useEffect(() => {
      const t = setInterval(() => setNow(Date.now()), intervalMs);
      return () => clearInterval(t);
    }, [intervalMs]);
    return now;
  };

  const useRecords = (type, max = 200) => {
    const [items, setItems] = useState(null);
    useEffect(() => {
      // 타입별 단일 필드 equality 쿼리(자동 색인, 복합 색인 불필요) → 해당 타입만 가져옴
      const unsub = COL.records()
        .where("type", "==", type)
        .limit(max)
        .onSnapshot(
          (snap) => {
            const arr = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            arr.sort((a, b) => (toDate(b.at) || 0) - (toDate(a.at) || 0)); // 최신순 클라이언트 정렬
            setItems(arr);
          },
          (err) => { console.error(type, err); setItems([]); }
        );
      return () => unsub();
    }, [type, max]);
    return items;
  };

  const addRecord = async (type, data, user, profile) => {
    return COL.records().add({
      type, ...data,
      createdBy: user.uid,
      creatorName: (profile && profile.name) || (user.email || "").split("@")[0],
      at: data.at || TS(),       // 기록 대상 시각
      createdAt: TS(),           // 서버 생성 시각
    });
  };
  const deleteRecord = (id) => COL.records().doc(id).delete();
  const updateRecordAt = (id, date) => COL.records().doc(id).update({ at: date });

  /* ========================================================================
     6. 로그인 화면
     ======================================================================== */
  const Login = () => {
    const toast = useToast();
    const [mode, setMode] = useState("login"); // login | signup
    const [email, setEmail] = useState("");
    const [pw, setPw] = useState("");
    const [name, setName] = useState("");
    const [remember, setRemember] = useState(localStorage.getItem("baby-remember") !== "0");
    const [err, setErr] = useState("");
    const [busy, setBusy] = useState(false);
    const autoTried = useRef(false);

    // 저장된 로그인 정보 불러오기 + 자동 로그인
    useEffect(() => {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem("baby-cred") || "null"); } catch (e) {}
      if (saved && saved.email) { setEmail(saved.email); setPw(saved.pw || ""); }
      // 로그아웃 직후엔 자동 로그인 건너뜀(다시 로그인하면 재활성화)
      const skip = localStorage.getItem("baby-skip-autologin") === "1";
      if (saved && saved.email && saved.pw && !skip && !autoTried.current) {
        autoTried.current = true;
        setBusy(true);
        auth.signInWithEmailAndPassword(saved.email, saved.pw)
          .catch(() => { /* 실패 시 입력값 유지 */ })
          .finally(() => setBusy(false));
      }
    }, []);

    const submit = async (e) => {
      e.preventDefault();
      setErr(""); setBusy(true);
      try {
        if (mode === "signup") {
          if (!name.trim()) { setErr("닉네임을 입력해주세요."); setBusy(false); return; }
          const cred = await auth.createUserWithEmailAndPassword(email.trim(), pw);
          // 가입 즉시 관람전용 + 승인대기로 프로필 생성
          await COL.users().doc(cred.user.uid).set({
            email: email.trim(), name: name.trim(), role: "viewer", approved: false, disabled: false, createdAt: TS(),
          }, { merge: true });
          toast("가입 완료! 관리자 승인 후 이용할 수 있어요.", "success");
        } else {
          await auth.signInWithEmailAndPassword(email.trim(), pw);
        }
        // 로그인 정보 저장 (체크 시) + 자동로그인 재활성화
        localStorage.removeItem("baby-skip-autologin");
        if (remember) {
          localStorage.setItem("baby-remember", "1");
          localStorage.setItem("baby-cred", JSON.stringify({ email: email.trim(), pw }));
        } else {
          localStorage.setItem("baby-remember", "0");
          localStorage.removeItem("baby-cred");
        }
      } catch (ex) {
        setErr(errMsg(ex));
      } finally { setBusy(false); }
    };
    const resetPw = async () => {
      if (!email.trim()) { setErr("비밀번호를 재설정할 이메일을 입력하세요."); return; }
      try { await auth.sendPasswordResetEmail(email.trim()); toast("재설정 메일을 보냈습니다.", "success"); }
      catch (ex) { setErr(errMsg(ex)); }
    };

    return (
      <div className="app-shell flex flex-col justify-center px-6 py-10 bg-warm">
        <div className="text-center mb-8">
          <div className="text-6xl mb-3" aria-hidden="true">🍼</div>
          <h1 className="text-2xl font-bold text-slate-800 dark:text-white">아기수첩</h1>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">우리 가족이 함께 쓰는 육아 기록</p>
        </div>
        <Card className="p-6">
          {/* 로그인 / 회원가입 전환 탭 */}
          <div className="flex gap-2 mb-5 bg-slate-100 dark:bg-slate-700 rounded-xl p-1">
            {[{ v: "login", l: "로그인" }, { v: "signup", l: "회원가입" }].map((t) => (
              <button key={t.v} type="button" onClick={() => { setMode(t.v); setErr(""); }}
                className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode === t.v ? "bg-white dark:bg-slate-800 text-teal-600 shadow-sm" : "text-slate-500"}`}>{t.l}</button>
            ))}
          </div>
          <form onSubmit={submit} className="space-y-4">
            {mode === "signup" && (
              <Field label="닉네임">
                <input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 이모, 삼촌" maxLength={20} />
              </Field>
            )}
            <Field label="이메일">
              <input className={inputCls} type="email" autoComplete="username" inputMode="email"
                value={email} onChange={(e) => setEmail(e.target.value)} placeholder="email@example.com" aria-label="이메일" />
            </Field>
            <Field label="비밀번호">
              <input className={inputCls} type="password" autoComplete={mode === "signup" ? "new-password" : "current-password"}
                value={pw} onChange={(e) => setPw(e.target.value)} placeholder={mode === "signup" ? "6자 이상" : "비밀번호"} aria-label="비밀번호" />
            </Field>
            {mode === "login" && (
              <label className="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" checked={remember} onChange={(e) => setRemember(e.target.checked)} className="w-5 h-5 rounded accent-teal-500" />
                <span className="text-sm text-slate-600 dark:text-slate-300">로그인 정보 저장 · 자동 로그인</span>
              </label>
            )}
            {err && <p role="alert" className="text-sm text-rose-500 bg-rose-50 dark:bg-rose-900/30 rounded-lg px-3 py-2">⚠️ {err}</p>}
            <Btn type="submit" disabled={busy} className="w-full">{busy ? "처리 중..." : (mode === "signup" ? "회원가입 신청" : "로그인")}</Btn>
            {mode === "login" && <button type="button" onClick={resetPw} className="w-full text-sm text-slate-400 hover:text-teal-500 pt-1">비밀번호를 잊으셨나요?</button>}
          </form>
        </Card>
        <p className="text-center text-xs text-slate-400 mt-6 leading-relaxed">
          {mode === "signup"
            ? "가입하면 관리자 승인 후 사용할 수 있어요.\n처음엔 사진 관람만 가능하며, 관리자가 권한을 올려줄 수 있어요."
            : "이메일·비밀번호는 이 기기에 저장돼 다음에 자동 로그인됩니다."}
        </p>
      </div>
    );
  };

  /* ========================================================================
     7. 헤더 + 다크모드
     ======================================================================== */
  const useDarkMode = () => {
    const [dark, setDark] = useState(() => {
      const saved = localStorage.getItem("baby-theme");
      if (saved) return saved === "dark";
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    });
    useEffect(() => {
      document.documentElement.classList.toggle("dark", dark);
      localStorage.setItem("baby-theme", dark ? "dark" : "light");
    }, [dark]);
    return [dark, setDark];
  };

  // 닉네임 변경 모달 (본인이 직접 설정)
  const NicknameModal = ({ open, onClose }) => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const [name, setName] = useState("");
    const [busy, setBusy] = useState(false);
    useEffect(() => { if (open) setName((profile && profile.name) || ""); }, [open, profile && profile.name]);
    const save = async () => {
      const n = name.trim();
      if (!n) { toast("닉네임을 입력해주세요.", "error"); return; }
      setBusy(true);
      try { await COL.users().doc(user.uid).set({ name: n }, { merge: true }); toast("닉네임을 변경했어요.", "success"); onClose(); }
      catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };
    return (
      <Modal open={open} onClose={onClose} title="닉네임 설정">
        <div className="space-y-4">
          <p className="text-sm text-slate-500 dark:text-slate-400">기록·사진·편지에 표시될 내 이름이에요. 자유롭게 바꿀 수 있어요.</p>
          <Field label="닉네임"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 엄마, 아빠, 외할머니" maxLength={20} /></Field>
          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "저장"}</Btn>
        </div>
      </Modal>
    );
  };

  // PWA 설치 유도 배너 (이미 설치/standalone이면 숨김)
  const isStandalone = () =>
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent || "");
  const InstallBanner = () => {
    const [bip, setBip] = useState(window.__bipEvent || null);
    const [dismissed, setDismissed] = useState(localStorage.getItem("baby-install-dismiss") === "1");
    useEffect(() => {
      const onBip = (e) => { e.preventDefault(); window.__bipEvent = e; setBip(e); };
      const onInstalled = () => { setDismissed(true); window.__bipEvent = null; };
      window.addEventListener("beforeinstallprompt", onBip);
      window.addEventListener("appinstalled", onInstalled);
      return () => { window.removeEventListener("beforeinstallprompt", onBip); window.removeEventListener("appinstalled", onInstalled); };
    }, []);
    if (isStandalone() || dismissed) return null;
    const close = () => { setDismissed(true); localStorage.setItem("baby-install-dismiss", "1"); };
    const install = async () => {
      if (!bip) return;
      bip.prompt();
      try { await bip.userChoice; } catch (e) {}
      window.__bipEvent = null; setBip(null);
    };
    if (!bip && !isIOS()) return null; // 설치 불가 환경(데스크톱 브라우저 등)
    return (
      <div className="bg-teal-50 dark:bg-slate-700/60 border-b border-teal-100 dark:border-slate-700 px-4 py-2.5 flex items-center gap-3">
        <span className="text-xl" aria-hidden="true">📲</span>
        <p className="flex-1 text-xs text-slate-600 dark:text-slate-200 leading-snug">

        </p>
        {bip && <button onClick={install} className="text-xs px-3 py-1.5 rounded-lg bg-teal-500 text-white font-medium whitespace-nowrap">설치</button>}
        <button onClick={close} aria-label="닫기" className="text-slate-400 text-lg w-7 h-7">×</button>
      </div>
    );
  };

  const Header = ({ dark, setDark }) => {

          </div>
          <div className="flex items-center gap-1">
            <button onClick={() => setDark(!dark)} aria-label={dark ? "라이트 모드로 전환" : "다크 모드로 전환"}
              className="w-10 h-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-xl">{dark ? "☀️" : "🌙"}</button>
            <span className="text-xs font-medium text-slate-600 dark:text-slate-300 leading-tight mr-1 truncate max-w-[90px]">{profile ? profile.name : "..."}</span>
            <button onClick={() => { signOutApp(); toast("로그아웃 되었습니다."); }} aria-label="로그아웃"
              className="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300">로그아웃</button>

  /* ========================================================================

  const Dashboard = ({ go }) => {
    const feedings = useRecords("feeding");
    const sleeps = useRecords("sleep");
    const diapers = useRecords("diaper");
    const ageInfo = useBabyAge();
    const baby = useBaby();
    const now = useNow(30000);

    if (!feedings || !sleeps || !diapers) return <Spinner label="불러오는 중..." />;

    const today = new Date();
    const tF = feedings.filter((r) => isSameDay(r.at, today));
    const tD = diapers.filter((r) => isSameDay(r.at, today));
    // 자정 넘긴 밤잠도 포함: 시작 또는 종료가 오늘인 완료 수면
    const tS = sleeps.filter((r) => r.end && (isSameDay(r.at, today) || isSameDay(r.end, today)));
    const sleepMin = tS.reduce((s, r) => s + (r.durationMin || 0), 0);

    // 마지막 수유 & 다음 예상 (최근 간격 평균 기반)
    const lastFeed = feedings[0];
    const lastFeedDate = lastFeed ? toDate(lastFeed.at) : null;
    const intervals = [];
    for (let i = 0; i < Math.min(feedings.length - 1, 6); i++) {
      const d = toDate(feedings[i].at) - toDate(feedings[i + 1].at);
      if (d > 0) intervals.push(d);
    }
    const avgMs = intervals.length ? Math.max(5400000, intervals.reduce((a, b) => a + b, 0) / intervals.length) : 3 * 3600000;
    const nextFeed = lastFeedDate ? new Date(lastFeedDate.getTime() + avgMs) : null;
    const overdue = lastFeedDate && (now - lastFeedDate.getTime()) > 3 * 3600000; // 3시간 초과(임상 권고)

    // 최근 7일 통계
    const weekly = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i); const key = ymd(d);
      const sl = sleeps.filter((r) => r.end && (ymd(r.at) === key || (r.end && ymd(r.end) === key))).reduce((s, r) => s + (r.durationMin || 0), 0) / 60;
      weekly.push({
        day: d.toLocaleDateString("ko-KR", { weekday: "short" }),
        수유: feedings.filter((r) => ymd(r.at) === key).length,
        기저귀: diapers.filter((r) => ymd(r.at) === key).length,
        수면: +sl.toFixed(1),
      });
    }
    const avg = (k) => (weekly.reduce((s, d) => s + d[k], 0) / 7);

    return (
      <div className="p-4 space-y-4 pb-safe">
        {/* 아기 나이 */}
        <Card className="p-5 bg-gradient-to-br from-teal-50 to-violet-50 dark:from-slate-800 dark:to-slate-800">
          <p className="text-sm text-slate-500 dark:text-slate-400">{baby.name}</p>
          <p className="text-xl font-bold text-slate-800 dark:text-white mt-0.5">{ageInfo.label}</p>
          {ageInfo.mode === "pregnant" && ageInfo.daysLeft > 0 &&
            <p className="text-xs text-violet-500 mt-1">출산까지 {ageInfo.daysLeft}일 💜</p>}
        </Card>

        {/* 다음 수유 / 경고 */}
        <Card className={`p-4 ${overdue ? "ring-2 ring-amber-400" : ""}`}>
          <div className="flex items-center justify-between">
            <div>
              <p className="text-sm text-slate-500 dark:text-slate-400">마지막 수유</p>
              <p className="font-bold text-slate-800 dark:text-white">{lastFeedDate ? ago(lastFeedDate) : "기록 없음"}</p>
            </div>
            <div className="text-right">
              <p className="text-sm text-slate-500 dark:text-slate-400">다음 예상</p>
              <p className={`font-bold ${overdue ? "text-amber-500" : "text-teal-500"}`}>{nextFeed ? fmtTime(nextFeed) : "-"}</p>
            </div>
          </div>
          {overdue && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2 bg-amber-50 dark:bg-amber-900/30 rounded-lg px-3 py-2">⚠️ 마지막 수유 후 3시간이 지났어요. 신생아는 보통 2~3시간 간격 수유를 권장합니다.</p>}
        </Card>

        {/* 오늘 요약 */}
        <div className="grid grid-cols-3 gap-3">
          {[
            { icon: "🍼", n: tF.length, unit: "회", label: "수유", tab: "feeding" },
            { icon: "😴", n: (sleepMin / 60).toFixed(1), unit: "시간", label: "수면", tab: "sleep" },
            { icon: "👶", n: tD.length, unit: "회", label: "기저귀", tab: "diaper" },
          ].map((s) => (
            <button key={s.label} onClick={() => go("records", s.tab)} aria-label={`${s.label} 오늘 ${s.n}${s.unit}`}>
              <Card className="p-3 text-center active:scale-95 transition">
                <div className="text-2xl" aria-hidden="true">{s.icon}</div>
                <p className="text-lg font-bold text-slate-800 dark:text-white mt-1">{s.n}<span className="text-xs font-normal text-slate-400 ml-0.5">{s.unit}</span></p>
                <p className="text-[11px] text-slate-400">{s.label}</p>
              </Card>
            </button>
          ))}
        </div>

        {/* 빠른 입력 */}
        <div className="grid grid-cols-2 gap-3">
          <Btn variant="primary" onClick={() => go("records", "feeding")}>🍼 수유 기록</Btn>
          <Btn variant="lavender" onClick={() => go("records", "sleep")}>😴 수면 기록</Btn>
        </div>

        {/* 주간 통계 */}
        <Card className="p-4">
          <h3 className="font-bold text-slate-800 dark:text-white mb-1">최근 7일 통계</h3>
          <div className="grid grid-cols-3 gap-2 my-3 text-center">
            <div><p className="text-lg font-bold text-teal-500">{avg("수유").toFixed(1)}</p><p className="text-[11px] text-slate-400">하루 평균 수유</p></div>
            <div><p className="text-lg font-bold text-violet-500">{avg("수면").toFixed(1)}h</p><p className="text-[11px] text-slate-400">하루 평균 수면</p></div>
            <div><p className="text-lg font-bold text-amber-500">{avg("기저귀").toFixed(1)}</p><p className="text-[11px] text-slate-400">하루 평균 기저귀</p></div>
          </div>
          <div style={{ width: "100%", height: 160 }}>
            <ResponsiveContainer>
              <BarChart data={weekly} margin={{ top: 5, right: 5, left: -22, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                <XAxis dataKey="day" tick={{ fontSize: 11 }} />
                <YAxis tick={{ fontSize: 11 }} />
                <Tooltip />
                <Legend wrapperStyle={{ fontSize: 11 }} />
                <Bar dataKey="수유" fill="#14b8a6" radius={[4, 4, 0, 0]} />
                <Bar dataKey="기저귀" fill="#f59e0b" radius={[4, 4, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>
      </div>
    );
  };

  /* ========================================================================
     8-b. 활동로그 (기록 탭의 '활동로그' 서브메뉴 · 관리자 전용)

  const ActivityLog = ({ limit = 60 }) => {

    return (

                  <span className="flex-1 text-slate-700 dark:text-slate-200 truncate"><b>{r.creatorName}</b>님 · {labelOf(r)}</span>
                  <span className="text-[11px] text-slate-400 whitespace-nowrap">{ago(r.createdAt || r.at)}</span>
