  <!--
  ============================================================================
  🔥 Firestore Security Rules  (Firebase 콘솔 > Firestore > 규칙 에 붙여넣기)
  ----------------------------------------------------------------------------
  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      function isSignedIn() { return request.auth != null; }
      function isAdmin() {
        return isSignedIn() &&
          get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin';
      }
      // 육아 공유 기록(수유·수면·기저귀·성장·건강·초음파): 로그인 사용자 읽기/쓰기
      match /records/{document=**} {
        allow read, write: if isSignedIn();
      }
      // 앱 설정(아기 정보 등): 로그인 읽기, 관리자만 쓰기
      match /settings/{docId} {
        allow read: if isSignedIn();
        allow write: if isAdmin();
      }
      // 사진: 로그인 읽기/생성, 업로더 본인 또는 관리자만 삭제
      match /photos/{photoId} {
        allow read: if isSignedIn();
        allow create: if isSignedIn();
        allow update: if isSignedIn(); // likeCount 트랜잭션 갱신
        allow delete: if isSignedIn() &&
          (resource.data.uploadedBy == request.auth.uid || isAdmin());
        // 좋아요: 본인 문서만 쓰기
        match /likes/{uid} {
          allow read: if isSignedIn();
          allow write: if request.auth.uid == uid;
        }
      }
      // 유저 정보: 로그인 읽기, 본인 또는 관리자만 쓰기
      match /users/{uid} {
        allow read: if isSignedIn();
        allow write: if request.auth.uid == uid || isAdmin();
        // 저장한 사진: 본인만 읽기/쓰기
        match /savedPhotos/{photoId} {
          allow read, write: if request.auth.uid == uid;
        }
      }
    }
  }

  ============================================================================
  🔥 Storage Security Rules  (Firebase 콘솔 > Storage > 규칙 에 붙여넣기)
  ----------------------------------------------------------------------------
  rules_version = '2';
  service firebase.storage {
    match /b/{bucket}/o {
      match /photos/{allPaths=**} {
        // 인증된 사용자만 읽기/쓰기 (10MB 이하 이미지)
        allow read: if request.auth != null;
        allow write: if request.auth != null
          && request.resource.size < 10 * 1024 * 1024
          && request.resource.contentType.matches('image/.*');
      }
    }
  }
  ============================================================================
  -->

  <script type="text/babel" data-presets="react">
  /* global React, ReactDOM, firebase, Recharts, firebaseConfig, BABY_DEFAULTS */
  const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;
  // Recharts가 CDN에서 안 떠도 앱 전체가 멈추지 않도록 대체 컴포넌트 사용
  const RC = window.Recharts || {};
  const chartsOK = !!RC.ResponsiveContainer;
  const NullCmp = () => null; // 차트 미로딩 시 내부 요소는 무시
  const ChartFallback = () => (
    <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: "#94a3b8", fontSize: 12 }}>
      차트를 불러오지 못했어요 (인터넷 연결 확인)
    </div>
  );
  const LineChart = RC.LineChart || ChartFallback;
  const BarChart = RC.BarChart || ChartFallback;
  const ResponsiveContainer = RC.ResponsiveContainer || (({ children }) => <div style={{ width: "100%", height: "100%" }}>{children}</div>);
  const Line = RC.Line || NullCmp, Bar = RC.Bar || NullCmp;
  const XAxis = RC.XAxis || NullCmp, YAxis = RC.YAxis || NullCmp;
  const CartesianGrid = RC.CartesianGrid || NullCmp, Tooltip = RC.Tooltip || NullCmp;
  const ReferenceLine = RC.ReferenceLine || NullCmp, ReferenceArea = RC.ReferenceArea || NullCmp, Legend = RC.Legend || NullCmp;

  /* ========================================================================
     0. 유틸리티 & 상수
     ======================================================================== */

  // Firebase 설정이 플레이스홀더 그대로인지 확인
  const isFirebaseConfigured = () =>
    firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_") &&
    firebaseConfig.projectId && !firebaseConfig.projectId.startsWith("YOUR_");

  // Firebase 에러 코드 → 한국어 메시지 (시니어 검토 #6)
  const AUTH_ERRORS = {
    "auth/invalid-email": "이메일 형식이 올바르지 않습니다.",
    "auth/user-disabled": "비활성화된 계정입니다. 관리자에게 문의하세요.",
    "auth/user-not-found": "등록되지 않은 이메일입니다.",
    "auth/wrong-password": "비밀번호가 일치하지 않습니다.",
    "auth/invalid-credential": "이메일 또는 비밀번호가 올바르지 않습니다.",
    "auth/too-many-requests": "로그인 시도가 너무 많습니다. 잠시 후 다시 시도하세요.",
    "auth/email-already-in-use": "이미 사용 중인 이메일입니다.",
    "auth/weak-password": "비밀번호는 6자 이상이어야 합니다.",
    "auth/network-request-failed": "네트워크 연결을 확인해주세요.",
    "auth/missing-password": "비밀번호를 입력해주세요.",
    "storage/unauthorized": "업로드 권한이 없습니다. 로그인 상태를 확인하세요.",
    "storage/canceled": "업로드가 취소되었습니다.",
    "permission-denied": "접근 권한이 없습니다. 보안 규칙을 확인하세요.",
  };
  const errMsg = (e) => AUTH_ERRORS[e && e.code] || (e && e.message) || "알 수 없는 오류가 발생했습니다.";

  // 계정 등급: 관리자 / 구성원(기록 가능) / 관람전용(사진만 보기, 이모·삼촌용)
  const ROLE_LABEL = { admin: "관리자", member: "구성원", viewer: "관람전용" };
  const roleLabel = (r) => ROLE_LABEL[r] || "구성원";

  // Firestore Timestamp ↔ JS Date 일관 변환 (시니어 검토 #9)
  const toDate = (v) => {
    if (!v) return null;
    if (v instanceof Date) return v;
    if (typeof v.toDate === "function") return v.toDate(); // Firestore Timestamp
    if (typeof v === "number") return new Date(v);
    if (typeof v === "string") return new Date(v);
    if (v.seconds != null) return new Date(v.seconds * 1000);
    return null;
  };
  const fmtTime = (d) => { d = toDate(d); return d ? d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "-"; };
  const fmtDate = (d) => { d = toDate(d); return d ? d.toLocaleDateString("ko-KR", { month: "long", day: "numeric" }) : "-"; };
  const fmtDateTime = (d) => { d = toDate(d); return d ? `${fmtDate(d)} ${fmtTime(d)}` : "-"; };
  const ymd = (d) => { d = toDate(d) || new Date(); return d.toLocaleDateString("sv-SE"); }; // YYYY-MM-DD(로컬)
  const isSameDay = (a, b) => ymd(a) === ymd(b);

  // datetime-local 입력값(로컬 기준) ↔ Date 변환
  const pad2 = (n) => String(n).padStart(2, "0");
  const toLocalInput = (d) => {
    d = toDate(d) || new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };
  const fromLocalInput = (s) => (s ? new Date(s) : new Date());

  // 경과 시간 사람이 읽기 좋게
  const ago = (d) => {
    d = toDate(d); if (!d) return "";
    const m = Math.floor((Date.now() - d.getTime()) / 60000);
    if (m < 1) return "방금 전";
    if (m < 60) return `${m}분 전`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}시간 ${m % 60}분 전`;
    return `${Math.floor(h / 24)}일 전`;
  };
  const hm = (mins) => `${Math.floor(mins / 60)}시간 ${Math.round(mins % 60)}분`;

  /* ========================================================================
     1. Firebase 초기화 + 오프라인 캐시 (시니어 검토 #4)
     ======================================================================== */
  let auth, db, storage, fbReady = false;
  if (isFirebaseConfigured()) {
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      storage = firebase.storage();
      // Firestore 오프라인 IndexedDB 캐시 (여러 탭 동시 사용 고려)
      db.enablePersistence({ synchronizeTabs: true }).catch((e) => {
        // failed-precondition(여러 탭) / unimplemented(미지원 브라우저)은 무시
        console.warn("오프라인 캐시 비활성:", e.code);
      });
      // 로그인 세션 유지 (localStorage)
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      fbReady = true;
    } catch (e) { console.error("Firebase 초기화 실패", e); }
  }

  const COL = {
    records: () => db.collection("records"),
    photos: () => db.collection("photos"),
    users: () => db.collection("users"),
    settings: () => db.collection("settings").doc("baby"),
  };
  const TS = () => firebase.firestore.FieldValue.serverTimestamp();

  /* ========================================================================
     2. 공용 UI 컴포넌트
     ======================================================================== */
  const Spinner = ({ label }) => (
    <div className="flex flex-col items-center justify-center gap-3 py-10" role="status" aria-live="polite">
      <div className="w-9 h-9 border-[3px] border-teal-400 border-t-transparent rounded-full animate-spin" aria-hidden="true"></div>
      {label && <p className="text-sm text-slate-500 dark:text-slate-400">{label}</p>}
    </div>
  );

  const Card = ({ children, className = "" }) => (
    <div className={`bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 ${className}`}>
      {children}
    </div>
  );

  const Btn = ({ children, onClick, variant = "primary", className = "", type = "button", disabled, ...rest }) => {
    const styles = {
      primary: "bg-teal-500 hover:bg-teal-600 text-white",
      lavender: "bg-violet-400 hover:bg-violet-500 text-white",
      ghost: "bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600",
      danger: "bg-rose-500 hover:bg-rose-600 text-white",
    };
    return (
      <button type={type} onClick={onClick} disabled={disabled}
        className={`rounded-xl font-medium px-4 py-3 text-base transition active:scale-[.98] disabled:opacity-50 disabled:active:scale-100 ${styles[variant]} ${className}`}
        {...rest}>
        {children}
      </button>
    );
  };

  // 토스트 알림
  const ToastCtx = createContext(null);
  const useToast = () => useContext(ToastCtx);
  const ToastProvider = ({ children }) => {
    const [toasts, setToasts] = useState([]);
    const push = useCallback((msg, type = "info") => {
      const id = Date.now() + Math.random();
      setToasts((t) => [...t, { id, msg, type }]);
      setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
    }, []);
    return (
      <ToastCtx.Provider value={push}>
        {children}
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-[92%] max-w-[400px]" aria-live="assertive">
          {toasts.map((t) => (
            <div key={t.id} role="alert"
              className={`fade-in px-4 py-3 rounded-xl shadow-lg text-sm text-white ${t.type === "error" ? "bg-rose-500" : t.type === "success" ? "bg-teal-500" : "bg-slate-700"}`}>
              {t.msg}
            </div>
          ))}
        </div>
      </ToastCtx.Provider>
    );
  };

  // 라벨 + 입력 묶음
  const Field = ({ label, children }) => (
    <label className="block">
      <span className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">{label}</span>
      {children}
    </label>
  );
  const inputCls = "w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 dark:text-white px-3.5 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-400";

  // 기록 시간 입력 (기본=지금, 직접 수정 가능)
  const DateTimeField = ({ value, onChange, label = "기록 시간" }) => (
    <Field label={label}>
      <div className="flex gap-2">
        <input className={inputCls} type="datetime-local" value={value} onChange={(e) => onChange(e.target.value)} aria-label={label} />
        <button type="button" onClick={() => onChange(toLocalInput(new Date()))}
          className="whitespace-nowrap px-3 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-sm">지금</button>
      </div>
    </Field>
  );

  // 선택 칩 그룹 (큰 버튼, 한 손 조작)
  const ChipGroup = ({ options, value, onChange, label }) => (
    <div role="radiogroup" aria-label={label}>
      {label && <span className="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1.5">{label}</span>}
      <div className="flex flex-wrap gap-2">
        {options.map((o) => {
          const active = value === o.value;
          return (
            <button key={o.value} type="button" role="radio" aria-checked={active}
              onClick={() => onChange(o.value)}
              className={`px-4 py-2.5 rounded-full text-sm font-medium border transition ${active
                ? "bg-teal-500 border-teal-500 text-white"
                : "bg-white dark:bg-slate-700 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300"}`}>
              {o.label}
            </button>
          );
        })}
      </div>
    </div>
  );

  // 모달 셸
  const Modal = ({ open, onClose, children, title, full }) => {
    useEffect(() => {
      if (!open) return;
      const onKey = (e) => e.key === "Escape" && onClose();
      window.addEventListener("keydown", onKey);
      document.body.style.overflow = "hidden";
      return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
    }, [open]);
    if (!open) return null;
    return (
      <div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center fade-in"
        onClick={onClose} role="dialog" aria-modal="true" aria-label={title || "대화상자"}>
        <div onClick={(e) => e.stopPropagation()}
          className={`slide-up bg-white dark:bg-slate-800 w-full ${full ? "h-full max-w-[430px]" : "max-w-[420px] rounded-t-3xl sm:rounded-3xl max-h-[92vh]"} overflow-y-auto`}>
          {title && (
            <div className="sticky top-0 bg-white dark:bg-slate-800 px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between z-10">
              <h2 className="text-lg font-bold text-slate-800 dark:text-white">{title}</h2>
              <button onClick={onClose} aria-label="닫기" className="text-2xl text-slate-400 hover:text-slate-600 w-9 h-9">×</button>
            </div>
          )}
          <div className="p-5">{children}</div>
        </div>
      </div>
    );
  };

  // 의료 면책 배너 (육아 전문가 검토 #1)
  const MedicalDisclaimer = () => (
    <div className="text-[11px] leading-relaxed text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800 rounded-xl p-3">
      ⚠️ 이 앱은 <b>의료 진단 도구가 아닙니다.</b> 기록·참고용이며, 모든 의학적 판단은 반드시 의료진과 상담하세요.
    </div>
  );

  /* ========================================================================
     3. 인증 컨텍스트
     ======================================================================== */
  const AuthCtx = createContext(null);
  const useAuth = () => useContext(AuthCtx);

  const AuthProvider = ({ children }) => {
    const [user, setUser] = useState(undefined); // undefined=로딩, null=비로그인
    const [profile, setProfile] = useState(null); // users/{uid} 문서

    // 이메일이 ADMIN_EMAILS 에 있으면 무조건 관리자 (대소문자 무시)
    const isAdminEmail = (email) =>
      !!email && ADMIN_EMAILS.map((e) => e.toLowerCase()).includes(email.toLowerCase());

    useEffect(() => {
      // onAuthStateChanged 로 로그인 상태 관리 (주의사항)
      const unsub = auth.onAuthStateChanged(async (u) => {
        setUser(u);
        if (!u) { setProfile(null); return; }
        // users/{uid} 프로필 보장 (없으면 생성, 있으면 관리자 이메일 자동 승격)
        const ref = COL.users().doc(u.uid);
        const snap = await ref.get();
        const wantAdmin = isAdminEmail(u.email);
        try {
          if (!snap.exists) {
            const name = (u.email || "").split("@")[0];
            await ref.set({ email: u.email, name, role: wantAdmin ? "admin" : "member", disabled: false, createdAt: TS() });
          } else if (wantAdmin && snap.data().role !== "admin") {
            // 기존에 구성원으로 저장돼 있어도 자동 복구
            await ref.update({ role: "admin" });
          }
        } catch (e) { console.warn("프로필 동기화 실패:", e.code); }
      });
      return () => unsub();
    }, []);

    // 프로필 실시간 구독 (역할 변경 즉시 반영)
    useEffect(() => {
      if (!user) return;
      const unsub = COL.users().doc(user.uid).onSnapshot((s) => setProfile(s.data() || null));
      return () => unsub(); // 언마운트 시 리스너 해제 (시니어 검토 #7)
    }, [user && user.uid]);

    // 클라이언트 관리자 판정: Firestore role 또는 ADMIN_EMAILS 둘 중 하나면 관리자
    const isAdmin = (profile && profile.role === "admin") || (user && isAdminEmail(user.email));

    return <AuthCtx.Provider value={{ user, profile, isAdmin }}>{children}</AuthCtx.Provider>;
  };

  /* ========================================================================
     4. 설정(아기 정보) 컨텍스트 — 나이/주수 계산
     ======================================================================== */
  const BabyCtx = createContext(null);
  const useBaby = () => useContext(BabyCtx);
  const BabyProvider = ({ children }) => {
    const [baby, setBaby] = useState(BABY_DEFAULTS);
    useEffect(() => {
      const unsub = COL.settings().onSnapshot((s) => {
        if (s.exists) setBaby({ ...BABY_DEFAULTS, ...s.data() });
      });
      return () => unsub();
    }, []);
    return <BabyCtx.Provider value={baby}>{children}</BabyCtx.Provider>;
  };

  // 아기 나이/임신주수 계산
  const useBabyAge = () => {
    const baby = useBaby();
    return useMemo(() => {
      if (baby.birthDate) {
        const b = new Date(baby.birthDate);
        const days = Math.floor((Date.now() - b.getTime()) / 86400000);
        if (days < 0) return { mode: "born", days: 0, weeks: 0, months: 0, label: "출생 예정일이 아직 오지 않았어요 (날짜 확인)" };
        const weeks = Math.floor(days / 7);
        const months = Math.floor(days / 30.44);
        return { mode: "born", days, weeks, months, label: `생후 ${days}일 (${weeks}주 / 약 ${months}개월)` };
      }
      if (baby.dueDate) {
        // 임신 주수 = 40주 - 출산예정일까지 남은 주
        const due = new Date(baby.dueDate);
        const daysLeft = Math.ceil((due.getTime() - Date.now()) / 86400000);
        const gaDays = 280 - daysLeft;
        const w = Math.floor(gaDays / 7), d = gaDays % 7;
        return { mode: "pregnant", gaDays, gaWeeks: w, label: gaDays > 0 ? `임신 ${w}주 ${d}일` : "출산 예정 정보를 입력하세요", daysLeft };
      }
      return { mode: "unknown", label: "아기 정보를 설정하세요" };
    }, [baby]);
  };

  /* ========================================================================
     5. records 컬렉션 실시간 구독 훅 (타입별)
     ======================================================================== */
  // 현재 시각을 주기적으로 갱신 (경과시간 실시간 표시용)
  const useNow = (intervalMs = 30000) => {
    const [now, setNow] = useState(Date.now());
    useEffect(() => {
      const t = setInterval(() => setNow(Date.now()), intervalMs);
      return () => clearInterval(t);
    }, [intervalMs]);
    return now;
  };

  const useRecords = (type, max = 200) => {
    const [items, setItems] = useState(null);
    useEffect(() => {
      // 타입별 단일 필드 equality 쿼리(자동 색인, 복합 색인 불필요) → 해당 타입만 가져옴
      const unsub = COL.records()
        .where("type", "==", type)
        .limit(max)
        .onSnapshot(
          (snap) => {
            const arr = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            arr.sort((a, b) => (toDate(b.at) || 0) - (toDate(a.at) || 0)); // 최신순 클라이언트 정렬
            setItems(arr);
          },
          (err) => { console.error(type, err); setItems([]); }
        );
      return () => unsub();
    }, [type, max]);
    return items;
  };

  const addRecord = async (type, data, user, profile) => {
    return COL.records().add({
      type, ...data,
      createdBy: user.uid,
      creatorName: (profile && profile.name) || (user.email || "").split("@")[0],
      at: data.at || TS(),       // 기록 대상 시각
      createdAt: TS(),           // 서버 생성 시각
    });
  };
  const deleteRecord = (id) => COL.records().doc(id).delete();
  const updateRecordAt = (id, date) => COL.records().doc(id).update({ at: date });

  /* ========================================================================
     6. 로그인 화면
     ======================================================================== */
  const Login = () => {
    const toast = useToast();
    const [email, setEmail] = useState("");
    const [pw, setPw] = useState("");
    const [err, setErr] = useState("");
    const [busy, setBusy] = useState(false);

    const submit = async (e) => {
      e.preventDefault();
      setErr(""); setBusy(true);
      try {
        await auth.signInWithEmailAndPassword(email.trim(), pw);
      } catch (ex) {
        setErr(errMsg(ex));
      } finally { setBusy(false); }
    };
    const resetPw = async () => {
      if (!email.trim()) { setErr("비밀번호를 재설정할 이메일을 입력하세요."); return; }
      try { await auth.sendPasswordResetEmail(email.trim()); toast("재설정 메일을 보냈습니다.", "success"); }
      catch (ex) { setErr(errMsg(ex)); }
    };

    return (
      <div className="app-shell flex flex-col justify-center px-6 py-10 bg-warm">
        <div className="text-center mb-8">
          <div className="text-6xl mb-3" aria-hidden="true">🍼</div>
          <h1 className="text-2xl font-bold text-slate-800 dark:text-white">아기수첩</h1>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">우리 가족이 함께 쓰는 육아 기록</p>
        </div>
        <Card className="p-6">
          <form onSubmit={submit} className="space-y-4">
            <Field label="이메일">
              <input className={inputCls} type="email" autoComplete="username" inputMode="email"
                value={email} onChange={(e) => setEmail(e.target.value)} placeholder="mom@baby.app" aria-label="이메일" />
            </Field>
            <Field label="비밀번호">
              <input className={inputCls} type="password" autoComplete="current-password"
                value={pw} onChange={(e) => setPw(e.target.value)} placeholder="비밀번호" aria-label="비밀번호" />
            </Field>
            {err && <p role="alert" className="text-sm text-rose-500 bg-rose-50 dark:bg-rose-900/30 rounded-lg px-3 py-2">⚠️ {err}</p>}
            <Btn type="submit" disabled={busy} className="w-full">{busy ? "로그인 중..." : "로그인"}</Btn>
            <button type="button" onClick={resetPw} className="w-full text-sm text-slate-400 hover:text-teal-500 pt-1">비밀번호를 잊으셨나요?</button>
          </form>
        </Card>
        <p className="text-center text-xs text-slate-400 mt-6 leading-relaxed">
          가족 계정으로 로그인하세요.<br/>계정은 관리자(admin@baby.app)가 설정 탭에서 추가합니다.
        </p>
      </div>
    );
  };

  /* ========================================================================
     7. 헤더 + 다크모드
     ======================================================================== */
  const useDarkMode = () => {
    const [dark, setDark] = useState(() => {
      const saved = localStorage.getItem("baby-theme");
      if (saved) return saved === "dark";
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    });
    useEffect(() => {
      document.documentElement.classList.toggle("dark", dark);
      localStorage.setItem("baby-theme", dark ? "dark" : "light");
    }, [dark]);
    return [dark, setDark];
  };

  // 닉네임 변경 모달 (본인이 직접 설정)
  const NicknameModal = ({ open, onClose }) => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const [name, setName] = useState("");
    const [busy, setBusy] = useState(false);
    useEffect(() => { if (open) setName((profile && profile.name) || ""); }, [open, profile && profile.name]);
    const save = async () => {
      const n = name.trim();
      if (!n) { toast("닉네임을 입력해주세요.", "error"); return; }
      setBusy(true);
      try { await COL.users().doc(user.uid).set({ name: n }, { merge: true }); toast("닉네임을 변경했어요.", "success"); onClose(); }
      catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };
    return (
      <Modal open={open} onClose={onClose} title="닉네임 설정">
        <div className="space-y-4">
          <p className="text-sm text-slate-500 dark:text-slate-400">기록·사진·편지에 표시될 내 이름이에요. 자유롭게 바꿀 수 있어요.</p>
          <Field label="닉네임"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 엄마, 아빠, 외할머니" maxLength={20} /></Field>
          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "저장"}</Btn>
        </div>
      </Modal>
    );
  };

  const Header = ({ dark, setDark }) => {
    const { profile } = useAuth();
    const baby = useBaby();
    const toast = useToast();
    const [nickOpen, setNickOpen] = useState(false);
    return (
      <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-100 dark:border-slate-700">
        <div className="px-4 h-14 flex items-center justify-between">
          <div className="flex items-center gap-2 min-w-0">
            <span className="text-2xl" aria-hidden="true">🍼</span>
            <div className="min-w-0">
              <p className="font-bold text-slate-800 dark:text-white leading-tight truncate">{baby.name}</p>
              <p className="text-[11px] text-slate-400 leading-tight">아기수첩</p>
            </div>
          </div>
          <div className="flex items-center gap-1">
            <button onClick={() => setDark(!dark)} aria-label={dark ? "라이트 모드로 전환" : "다크 모드로 전환"}
              className="w-10 h-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-xl">{dark ? "☀️" : "🌙"}</button>
            <button onClick={() => setNickOpen(true)} aria-label="닉네임 설정" className="text-right mr-1">
              <p className="text-xs font-medium text-slate-600 dark:text-slate-300 leading-tight">{profile ? profile.name : "..."} ✏️</p>
            </button>
            <button onClick={() => { auth.signOut(); toast("로그아웃 되었습니다."); }} aria-label="로그아웃"
              className="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300">로그아웃</button>
          </div>
        </div>
        <NicknameModal open={nickOpen} onClose={() => setNickOpen(false)} />
      </header>
    );
  };

  /* ========================================================================
     8. 대시보드
     ======================================================================== */
  const Dashboard = ({ go }) => {
    const feedings = useRecords("feeding");
    const sleeps = useRecords("sleep");
    const diapers = useRecords("diaper");
    const growths = useRecords("growth", 50);
    const healths = useRecords("health", 50);
    const letters = useRecords("letter", 30);
    const photos = usePhotos(20);
    const ageInfo = useBabyAge();
    const baby = useBaby();
    const now = useNow(30000);

    if (!feedings || !sleeps || !diapers) return <Spinner label="불러오는 중..." />;

    const today = new Date();
    const tF = feedings.filter((r) => isSameDay(r.at, today));
    const tD = diapers.filter((r) => isSameDay(r.at, today));
    // 자정 넘긴 밤잠도 포함: 시작 또는 종료가 오늘인 완료 수면
    const tS = sleeps.filter((r) => r.end && (isSameDay(r.at, today) || isSameDay(r.end, today)));
    const sleepMin = tS.reduce((s, r) => s + (r.durationMin || 0), 0);

    // 마지막 수유 & 다음 예상 (최근 간격 평균 기반)
    const lastFeed = feedings[0];
    const lastFeedDate = lastFeed ? toDate(lastFeed.at) : null;
    const intervals = [];
    for (let i = 0; i < Math.min(feedings.length - 1, 6); i++) {
      const d = toDate(feedings[i].at) - toDate(feedings[i + 1].at);
      if (d > 0) intervals.push(d);
    }
    const avgMs = intervals.length ? Math.max(5400000, intervals.reduce((a, b) => a + b, 0) / intervals.length) : 3 * 3600000;
    const nextFeed = lastFeedDate ? new Date(lastFeedDate.getTime() + avgMs) : null;
    const overdue = lastFeedDate && (now - lastFeedDate.getTime()) > 3 * 3600000; // 3시간 초과(임상 권고)

    // 활동 피드 (모든 기록 + 사진 합산)
    const photoActs = (photos || []).map((p) => ({ ...p, type: "photo", at: p.createdAt, creatorName: p.uploaderName }));
    const feed = [...feedings, ...sleeps, ...diapers, ...growths, ...healths, ...letters, ...photoActs]
      .sort((a, b) => (toDate(b.createdAt || b.at) - toDate(a.createdAt || a.at)))
      .slice(0, 12);
    const labelOf = (r) => ({ feeding: "수유 기록", sleep: "수면 기록", diaper: "기저귀 기록", growth: "성장 기록", health: "건강 기록", letter: "편지", photo: "사진" })[r.type] || "기록";
    const iconOf = (r) => ({ feeding: "🍼", sleep: "😴", diaper: "👶", growth: "📏", health: "🩺", letter: "💌", photo: "🖼️" })[r.type] || "📋";

    // 최근 7일 통계
    const weekly = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i); const key = ymd(d);
      const sl = sleeps.filter((r) => r.end && (ymd(r.at) === key || (r.end && ymd(r.end) === key))).reduce((s, r) => s + (r.durationMin || 0), 0) / 60;
      weekly.push({
        day: d.toLocaleDateString("ko-KR", { weekday: "short" }),
        수유: feedings.filter((r) => ymd(r.at) === key).length,
        기저귀: diapers.filter((r) => ymd(r.at) === key).length,
        수면: +sl.toFixed(1),
      });
    }
    const avg = (k) => (weekly.reduce((s, d) => s + d[k], 0) / 7);

    return (
      <div className="p-4 space-y-4 pb-safe">
        {/* 아기 나이 */}
        <Card className="p-5 bg-gradient-to-br from-teal-50 to-violet-50 dark:from-slate-800 dark:to-slate-800">
          <p className="text-sm text-slate-500 dark:text-slate-400">{baby.name}</p>
          <p className="text-xl font-bold text-slate-800 dark:text-white mt-0.5">{ageInfo.label}</p>
          {ageInfo.mode === "pregnant" && ageInfo.daysLeft > 0 &&
            <p className="text-xs text-violet-500 mt-1">출산까지 {ageInfo.daysLeft}일 💜</p>}
        </Card>

        {/* 다음 수유 / 경고 */}
        <Card className={`p-4 ${overdue ? "ring-2 ring-amber-400" : ""}`}>
          <div className="flex items-center justify-between">
            <div>
              <p className="text-sm text-slate-500 dark:text-slate-400">마지막 수유</p>
              <p className="font-bold text-slate-800 dark:text-white">{lastFeedDate ? ago(lastFeedDate) : "기록 없음"}</p>
            </div>
            <div className="text-right">
              <p className="text-sm text-slate-500 dark:text-slate-400">다음 예상</p>
              <p className={`font-bold ${overdue ? "text-amber-500" : "text-teal-500"}`}>{nextFeed ? fmtTime(nextFeed) : "-"}</p>
            </div>
          </div>
          {overdue && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2 bg-amber-50 dark:bg-amber-900/30 rounded-lg px-3 py-2">⚠️ 마지막 수유 후 3시간이 지났어요. 신생아는 보통 2~3시간 간격 수유를 권장합니다.</p>}
        </Card>

        {/* 오늘 요약 */}
        <div className="grid grid-cols-3 gap-3">
          {[
            { icon: "🍼", n: tF.length, unit: "회", label: "수유", tab: "feeding" },
            { icon: "😴", n: (sleepMin / 60).toFixed(1), unit: "시간", label: "수면", tab: "sleep" },
            { icon: "👶", n: tD.length, unit: "회", label: "기저귀", tab: "diaper" },
          ].map((s) => (
            <button key={s.label} onClick={() => go("records", s.tab)} aria-label={`${s.label} 오늘 ${s.n}${s.unit}`}>
              <Card className="p-3 text-center active:scale-95 transition">
                <div className="text-2xl" aria-hidden="true">{s.icon}</div>
                <p className="text-lg font-bold text-slate-800 dark:text-white mt-1">{s.n}<span className="text-xs font-normal text-slate-400 ml-0.5">{s.unit}</span></p>
                <p className="text-[11px] text-slate-400">{s.label}</p>
              </Card>
            </button>
          ))}
        </div>

        {/* 빠른 입력 */}
        <div className="grid grid-cols-2 gap-3">
          <Btn variant="primary" onClick={() => go("records", "feeding")}>🍼 수유 기록</Btn>
          <Btn variant="lavender" onClick={() => go("records", "sleep")}>😴 수면 기록</Btn>
        </div>

        {/* 주간 통계 */}
        <Card className="p-4">
          <h3 className="font-bold text-slate-800 dark:text-white mb-1">최근 7일 통계</h3>
          <div className="grid grid-cols-3 gap-2 my-3 text-center">
            <div><p className="text-lg font-bold text-teal-500">{avg("수유").toFixed(1)}</p><p className="text-[11px] text-slate-400">하루 평균 수유</p></div>
            <div><p className="text-lg font-bold text-violet-500">{avg("수면").toFixed(1)}h</p><p className="text-[11px] text-slate-400">하루 평균 수면</p></div>
            <div><p className="text-lg font-bold text-amber-500">{avg("기저귀").toFixed(1)}</p><p className="text-[11px] text-slate-400">하루 평균 기저귀</p></div>
          </div>
          <div style={{ width: "100%", height: 160 }}>
            <ResponsiveContainer>
              <BarChart data={weekly} margin={{ top: 5, right: 5, left: -22, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                <XAxis dataKey="day" tick={{ fontSize: 11 }} />

  /* ========================================================================
     12. 성장 기록 (WHO 백분위 곡선 포함)
     ----------------------------------------------------------------------
     WHO Child Growth Standards 근사값 (월령: P3 / P50 / P97), 0~24개월. 참고용.
     ======================================================================== */
  // [month, P3, P50, P97]
  const WHO = {
    male: {
      weight: [[0,2.5,3.3,4.4],[1,3.4,4.5,5.8],[2,4.3,5.6,7.1],[3,5.0,6.4,8.0],[4,5.6,7.0,8.7],[5,6.0,7.5,9.3],[6,6.4,7.9,9.8],[9,7.1,8.9,11.0],[12,7.7,9.6,12.0],[18,8.8,10.9,13.7],[24,9.7,12.2,15.3]],
      height: [[0,46.3,49.9,53.4],[1,51.1,54.7,58.4],[2,54.7,58.4,62.2],[3,57.6,61.4,65.3],[6,63.3,67.6,71.9],[9,67.5,72.0,76.5],[12,71.0,75.7,80.5],[18,76.9,82.3,87.7],[24,81.7,87.8,93.9]],
    },
    female: {
      weight: [[0,2.4,3.2,4.2],[1,3.2,4.2,5.5],[2,3.9,5.1,6.6],[3,4.5,5.8,7.5],[4,5.0,6.4,8.2],[5,5.4,6.9,8.8],[6,5.7,7.3,9.3],[9,6.5,8.2,10.5],[12,7.0,8.9,11.5],[18,8.1,10.2,13.2],[24,9.0,11.5,14.8]],
      height: [[0,45.6,49.1,52.7],[1,50.0,53.7,57.4],[2,53.2,57.1,61.1],[3,55.8,59.8,63.9],[6,61.2,65.7,70.3],[9,65.3,70.1,75.0],[12,68.9,74.0,79.2],[18,74.9,80.7,86.5],[24,80.0,86.4,92.9]],
    },
  };
  // 선형보간으로 특정 월령의 [P3,P50,P97] 구하기
  const whoAt = (rows, m) => {
    if (m <= rows[0][0]) return rows[0].slice(1);
    if (m >= rows[rows.length - 1][0]) return rows[rows.length - 1].slice(1);
    for (let i = 0; i < rows.length - 1; i++) {
      const a = rows[i], b = rows[i + 1];
      if (m >= a[0] && m <= b[0]) {
        const t = (m - a[0]) / (b[0] - a[0]);
        return [1, 2, 3].map((k) => a[k] + (b[k] - a[k]) * t);
      }
    }
    return rows[rows.length - 1].slice(1);
  };
  // 측정값의 대략적 백분위 추정 (P3/P50/P97 구간 선형 근사)
  const estPercentile = (rows, m, v) => {
    if (v == null) return null;
    const [p3, p50, p97] = whoAt(rows, m);
    let pct;
    if (v <= p3) pct = 3 * (v / p3);
    else if (v <= p50) pct = 3 + (50 - 3) * (v - p3) / (p50 - p3);
    else if (v <= p97) pct = 50 + (97 - 50) * (v - p50) / (p97 - p50);
    else pct = 97 + (v - p97) / p97 * 100;
    return Math.max(0, Math.min(100, Math.round(pct)));
  };

  const GrowthTracker = () => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const baby = useBaby();
    const items = useRecords("growth", 100);
    const [height, setHeight] = useState("");
    const [weight, setWeight] = useState("");
    const [head, setHead] = useState("");
    const [at, setAt] = useState(toLocalInput(new Date()));
    const [busy, setBusy] = useState(false);
    const [metric, setMetric] = useState("weight"); // weight | height

    const save = async () => {
      if (!height && !weight && !head) { toast("측정값을 하나 이상 입력하세요.", "error"); return; }
      setBusy(true);
      try {
        await addRecord("growth", {
          height: height ? Number(height) : null,
          weight: weight ? Number(weight) : null,
          head: head ? Number(head) : null, at: fromLocalInput(at),
        }, user, profile);
        setHeight(""); setWeight(""); setHead(""); setAt(toLocalInput(new Date()));
        toast("성장 기록을 추가했어요.", "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    // 월령 계산 (출생일 기준)
    const ageMonthsAt = (d) => baby.birthDate ? (toDate(d) - new Date(baby.birthDate)) / (86400000 * 30.4375) : null;
    const whoRows = baby.sex && WHO[baby.sex] ? WHO[baby.sex][metric] : null;

    // 차트 데이터: WHO 곡선 점 + 아기 측정점을 월령(x) 기준으로 병합
    const chartData = useMemo(() => {
      if (!whoRows) return null;
      const rows = whoRows.map((r) => ({ m: r[0], p3: r[1], p50: r[2], p97: r[3] }));
      const pts = [];
      (items || []).forEach((r) => {
        const v = r[metric]; const m = ageMonthsAt(r.at);
        if (v != null && m != null && m >= 0 && m <= 24) pts.push({ m: +m.toFixed(2), baby: v });
      });
      return [...rows, ...pts].sort((a, b) => a.m - b.m);
    }, [items, metric, whoRows, baby.birthDate]);

    // 최신 측정의 백분위
    const latest = items && items.find((r) => r[metric] != null);
    const latestM = latest ? ageMonthsAt(latest.at) : null;
    const pct = (whoRows && latest && latestM != null && latestM >= 0 && latestM <= 24)
      ? estPercentile(whoRows, latestM, latest[metric]) : null;

    // 백업: 성별/출생일 없을 때 날짜 기준 단순 그래프
    const simpleData = useMemo(() => (items ? [...items].reverse().map((r) => ({ date: fmtDate(r.at), weight: r.weight, height: r.height })) : []), [items]);
    const unit = metric === "weight" ? "kg" : "cm";

    return (
      <div className="space-y-4">
        <Card className="p-4 space-y-3">
          <div className="grid grid-cols-3 gap-2">
            <Field label="키 (cm)"><input className={inputCls} type="number" inputMode="decimal" value={height} onChange={(e) => setHeight(e.target.value)} placeholder="50" /></Field>
            <Field label="몸무게 (kg)"><input className={inputCls} type="number" inputMode="decimal" value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="3.4" /></Field>
            <Field label="머리둘레"><input className={inputCls} type="number" inputMode="decimal" value={head} onChange={(e) => setHead(e.target.value)} placeholder="35" /></Field>
          </div>
          <DateTimeField value={at} onChange={setAt} label="측정 시간" />
          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "성장 기록 추가"}</Btn>
        </Card>

        <Card className="p-4">
          <div className="flex items-center justify-between mb-1">
            <h3 className="font-bold text-slate-800 dark:text-white">WHO 성장 백분위</h3>
            <ChipGroup value={metric} onChange={setMetric}
              options={[{ value: "weight", label: "몸무게" }, { value: "height", label: "키" }]} />
          </div>

          {!whoRows ? (
            <div className="text-sm text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700/40 rounded-xl p-3 my-2">
              WHO 백분위 곡선을 보려면 <b>설정 → 아기 정보</b>에서 <b>출생일</b>과 <b>성별</b>을 입력해주세요.
            </div>
          ) : (
            <>
              {pct != null && (
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">
                  최근 {metric === "weight" ? "몸무게" : "키"} <b>{latest[metric]}{unit}</b> · 또래 약 <b className="text-teal-600">{pct}백분위</b>
                  {(pct < 3 || pct > 97) && <span className="text-amber-600"> · 소아과 상담 권장</span>}
                </p>
              )}
              <p className="text-[11px] text-slate-400 mb-2">회색 곡선: WHO 3/50/97 백분위(참고용) · 점선: 우리 아기</p>
              <div style={{ width: "100%", height: 220 }}>
                <ResponsiveContainer>
                  <LineChart data={chartData} margin={{ top: 5, right: 8, left: -20, bottom: 0 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                    <XAxis dataKey="m" type="number" domain={[0, 24]} ticks={[0, 3, 6, 9, 12, 18, 24]} tick={{ fontSize: 10 }} label={{ value: "개월", position: "insideBottomRight", fontSize: 9, offset: -2 }} />
                    <YAxis tick={{ fontSize: 11 }} domain={["auto", "auto"]} />
                    <Tooltip formatter={(v, n) => [v + unit, ({ p3: "3백분위", p50: "50백분위", p97: "97백분위", baby: "우리아기" })[n] || n]} labelFormatter={(l) => `${l}개월`} />
                    <Line type="monotone" dataKey="p97" stroke="#cbd5e1" strokeWidth={1} dot={false} connectNulls />
                    <Line type="monotone" dataKey="p50" stroke="#94a3b8" strokeWidth={1} strokeDasharray="4 3" dot={false} connectNulls />
                    <Line type="monotone" dataKey="p3" stroke="#cbd5e1" strokeWidth={1} dot={false} connectNulls />
                    <Line type="monotone" dataKey="baby" stroke="#14b8a6" strokeWidth={2.5} dot={{ r: 4 }} connectNulls />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </>
          )}
        </Card>

        {/* 성별/출생일 없을 때 단순 추이 */}
        {!whoRows && (
          <Card className="p-4">
            <h3 className="font-bold text-slate-800 dark:text-white mb-2">{metric === "weight" ? "몸무게" : "키"} 추이 ({unit})</h3>
            <div style={{ width: "100%", height: 180 }}>
              <ResponsiveContainer>
                <LineChart data={simpleData} margin={{ top: 5, right: 5, left: -20, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                  <XAxis dataKey="date" tick={{ fontSize: 10 }} />
                  <YAxis tick={{ fontSize: 11 }} domain={["auto", "auto"]} />
                  <Tooltip />
                  <Line type="monotone" dataKey={metric} stroke="#14b8a6" strokeWidth={2} dot={{ r: 3 }} connectNulls />
                </LineChart>
              </ResponsiveContainer>
            </div>
          </Card>
        )}

        <RecordList items={items} render={(r) => (
          <>{r.height ? `키 ${r.height}cm ` : ""}{r.weight ? `몸무게 ${r.weight}kg ` : ""}{r.head ? `머리 ${r.head}cm` : ""}</>
        )} />
      </div>
    );
  };

  /* ========================================================================
     13. 건강 기록 (체온 + 증상 + 예방접종)
     ======================================================================== */
  // 체온 단계 (육아 전문가 검토 #4)
  const tempStage = (t) => {
    if (t == null) return null;
    if (t < 36.0) return { label: "저체온", color: "text-sky-600", bg: "bg-sky-50 dark:bg-sky-900/30", msg: "체온이 낮습니다. 보온 후에도 지속되면 소아과 상담을 권장합니다." };
    if (t <= 37.5) return { label: "정상", color: "text-teal-600", bg: "bg-teal-50 dark:bg-teal-900/30", msg: "정상 범위입니다 (36.5~37.5℃)." };
    if (t < 38.0) return { label: "미열", color: "text-amber-600", bg: "bg-amber-50 dark:bg-amber-900/30", msg: "미열입니다. 경과를 지켜봐주세요." };
    return { label: "발열", color: "text-rose-600", bg: "bg-rose-50 dark:bg-rose-900/30", msg: "🚨 발열입니다(38℃ 이상). 생후 3개월 미만이면 즉시 소아과 진료를 권장합니다." };
  };

  // 예방접종 표준 일정 (질병관리청 표준예방접종일정 기준 요약)
  const VACCINES = [
    { age: "출생~4주", items: ["B형간염 1차", "BCG(결핵)"] },
    { age: "1개월", items: ["B형간염 2차"] },
    { age: "2개월", items: ["DTaP 1차", "IPV(폴리오) 1차", "Hib 1차", "폐렴구균 1차", "로타바이러스 1차"] },
    { age: "4개월", items: ["DTaP 2차", "IPV 2차", "Hib 2차", "폐렴구균 2차", "로타바이러스 2차"] },
    { age: "6개월", items: ["DTaP 3차", "IPV 3차", "Hib 3차", "폐렴구균 3차", "B형간염 3차", "로타바이러스 3차(해당 백신)", "인플루엔자(매년)"] },
    { age: "12~15개월", items: ["MMR 1차", "수두", "Hib 4차", "폐렴구균 4차", "A형간염 1차", "일본뇌염 1차"] },
    { age: "15~18개월", items: ["DTaP 4차"] },
    { age: "24~35개월", items: ["A형간염 2차", "일본뇌염 추가"] },
    { age: "만 4~6세", items: ["DTaP 5차", "IPV 4차", "MMR 2차"] },
  ];

  const HealthLog = () => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const items = useRecords("health", 100);
    const [temp, setTemp] = useState("");
    const [symptom, setSymptom] = useState("");
    const [hospital, setHospital] = useState("");
    const [at, setAt] = useState(toLocalInput(new Date()));
    const [busy, setBusy] = useState(false);
    const [vacDone, setVacDone] = useState({});

    // 예방접종 체크 상태 settings/baby 에 저장 (공유)
    useEffect(() => {
      const unsub = COL.settings().onSnapshot((s) => setVacDone((s.data() && s.data().vaccines) || {}));
      return () => unsub();
    }, []);
    const toggleVac = async (name) => {
      const next = { ...vacDone, [name]: !vacDone[name] };
      try { await COL.settings().set({ vaccines: next }, { merge: true }); }
      catch (e) { toast(errMsg(e), "error"); }
    };

    const stage = temp ? tempStage(Number(temp)) : null;
    const save = async () => {
      if (!temp && !symptom && !hospital) { toast("기록할 내용을 입력하세요.", "error"); return; }
      setBusy(true);
      try {
        await addRecord("health", {
          temp: temp ? Number(temp) : null, symptom: symptom || null, hospital: hospital || null, at: fromLocalInput(at),
        }, user, profile);
        setTemp(""); setSymptom(""); setHospital(""); setAt(toLocalInput(new Date()));
        toast("건강 기록을 추가했어요.", "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    return (
      <div className="space-y-4">
        <MedicalDisclaimer />
        <Card className="p-4 space-y-3">
          <Field label="체온 (℃)">
            <input className={inputCls} type="number" inputMode="decimal" step="0.1" value={temp} onChange={(e) => setTemp(e.target.value)} placeholder="36.8" />
          </Field>
          {stage && <p role="alert" className={`text-sm rounded-lg px-3 py-2 ${stage.bg} ${stage.color}`}><b>{stage.label}</b> · {stage.msg}</p>}
          <Field label="증상 메모"><input className={inputCls} value={symptom} onChange={(e) => setSymptom(e.target.value)} placeholder="콧물, 기침 등" /></Field>
          <Field label="병원 방문 기록"><input className={inputCls} value={hospital} onChange={(e) => setHospital(e.target.value)} placeholder="○○소아과 방문, 처방 등" /></Field>
          <DateTimeField value={at} onChange={setAt} label="기록 시간" />
          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "건강 기록 추가"}</Btn>
        </Card>

        {/* 체온 차트 */}
        {items && items.some((r) => r.temp) && (
          <Card className="p-4">
            <h3 className="font-bold text-slate-800 dark:text-white mb-2">체온 추이 (℃)</h3>
            <div style={{ width: "100%", height: 170 }}>
              <ResponsiveContainer>
                <LineChart data={[...items].filter((r) => r.temp).reverse().map((r) => ({ date: fmtDate(r.at), temp: r.temp }))} margin={{ top: 5, right: 5, left: -20, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                  <XAxis dataKey="date" tick={{ fontSize: 10 }} />
                  <YAxis domain={[35, 40]} tick={{ fontSize: 11 }} />
                  <Tooltip />
                  <ReferenceLine y={38} stroke="#f43f5e" strokeDasharray="4 4" label={{ value: "발열 38℃", fontSize: 9, fill: "#f43f5e" }} />
                  <ReferenceLine y={37.5} stroke="#f59e0b" strokeDasharray="4 4" />
                  <Line type="monotone" dataKey="temp" stroke="#14b8a6" strokeWidth={2} dot={{ r: 3 }} />
                </LineChart>
              </ResponsiveContainer>
            </div>
          </Card>
        )}

        {/* 예방접종 체크리스트 */}
        <Card className="p-4">
          <h3 className="font-bold text-slate-800 dark:text-white mb-1">예방접종 체크리스트</h3>
          <p className="text-[11px] text-slate-400 mb-3">질병관리청 표준예방접종일정 기준 (참고용)</p>
          <div className="space-y-3">
            {VACCINES.map((g) => (
              <div key={g.age}>
                <p className="text-xs font-semibold text-teal-600 dark:text-teal-400 mb-1.5">{g.age}</p>
                <div className="space-y-1.5">
                  {g.items.map((v) => {
                    const key = `${g.age}|${v}`;
                    const done = !!vacDone[key];
                    return (
                      <label key={key} className="flex items-center gap-2.5 cursor-pointer">
                        <input type="checkbox" checked={done} onChange={() => toggleVac(key)}
                          className="w-5 h-5 rounded accent-teal-500" aria-label={`${v} 접종 완료`} />
                        <span className={`text-sm ${done ? "line-through text-slate-400" : "text-slate-700 dark:text-slate-200"}`}>{v}</span>
                      </label>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </Card>

        <RecordList items={items} render={(r) => (
          <>{r.temp ? `🌡️ ${r.temp}℃ ` : ""}{r.symptom ? `· ${r.symptom} ` : ""}{r.hospital ? `· 🏥 ${r.hospital}` : ""}</>
        )} />
      </div>
    );
  };

  /* ========================================================================
     14. 임신 초기 기록 (초음파 + 검사 + 타임라인)
     ======================================================================== */
  // CRL 유효 주수 안내 (육아 전문가 검토 #1)
  const crlGuide = (week) => {
    if (week == null || week === "") return null;
    const w = Number(week);
    if (w >= 6 && w <= 13) return { ok: true, msg: "CRL(머리-엉덩이 길이)은 임신 6~13주 주수 측정에 가장 정확합니다." };
    return { ok: false, msg: "CRL은 보통 6~13주에만 측정합니다. 13주 이후엔 BPD/HC/AC/FL로 주수·체중을 추정합니다." };
  };
  // 태아 심박수 정상 범위 120~160 bpm (육아 전문가 검토 #1)
  const fhrCheck = (bpm) => {
    if (!bpm) return null;
    const v = Number(bpm);
    if (v >= 120 && v <= 160) return { ok: true, msg: "정상 범위(120~160 bpm)입니다." };
    return { ok: false, msg: "⚠️ 정상 범위(120~160 bpm)를 벗어났습니다. 산부인과 상담을 권장합니다." };
  };

  const PrenatalTracker = ({ openUpload }) => {
    const { user, profile, isAdmin } = useAuth();
    const toast = useToast();
    const items = useRecords("prenatal", 100);
    const [open, setOpen] = useState(false);
    const [f, setF] = useState({ week: "", crl: "", bpd: "", hc: "", ac: "", fl: "", efw: "", fhr: "", afi: "", note: "" });
    const [at, setAt] = useState(toLocalInput(new Date()));
    const [busy, setBusy] = useState(false);
    const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));

    const crl = crlGuide(f.week);
    const fhr = fhrCheck(f.fhr);

    const save = async () => {
      if (!f.week) { toast("임신 주수를 입력하세요.", "error"); return; }
      setBusy(true);
      try {
        const data = {};
        Object.keys(f).forEach((k) => { data[k] = f[k] === "" ? null : (k === "note" ? f[k] : Number(f[k])); });
        await addRecord("prenatal", { ...data, at: fromLocalInput(at) }, user, profile);
        setOpen(false);
        setF({ week: "", crl: "", bpd: "", hc: "", ac: "", fl: "", efw: "", fhr: "", afi: "", note: "" });
        setAt(toLocalInput(new Date()));
        toast("초음파 기록을 추가했어요.", "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    const sorted = items ? [...items].sort((a, b) => (a.week || 0) - (b.week || 0)) : null;

    return (
      <div className="space-y-4">
        <MedicalDisclaimer />
        <div className="grid grid-cols-2 gap-3">
          <Btn onClick={() => setOpen(true)}>🔬 초음파 기록</Btn>
          <Btn variant="lavender" onClick={openUpload}>📷 초음파 사진</Btn>
        </div>

        {/* 주수별 타임라인 */}
        {!sorted ? <Spinner /> : sorted.length === 0 ? (
          <Card className="p-6 text-center text-sm text-slate-400">아직 초음파 기록이 없어요.</Card>
        ) : (
          <div className="space-y-3">
            {sorted.map((r) => {
              const fc = fhrCheck(r.fhr);
              return (
                <Card key={r.id} className="p-4">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-base font-bold text-violet-500">임신 {r.week}주</span>
                    <span className="text-xs text-slate-400">{fmtDate(r.at)} · {r.creatorName}</span>
                  </div>
                  <div className="grid grid-cols-3 gap-x-2 gap-y-1 text-sm text-slate-600 dark:text-slate-300">
                    {r.crl != null && <span>CRL {r.crl}mm</span>}
                    {r.bpd != null && <span>BPD {r.bpd}mm</span>}
                    {r.hc != null && <span>HC {r.hc}mm</span>}
                    {r.ac != null && <span>AC {r.ac}mm</span>}
                    {r.fl != null && <span>FL {r.fl}mm</span>}
                    {r.fhr != null && <span>심박 {r.fhr}bpm</span>}
                    {r.afi != null && <span>AFI {r.afi}</span>}
                    {r.efw != null && <span className="col-span-3">추정체중 {r.efw}g <span className="text-[11px] text-amber-500">(±15~20% 오차)</span></span>}
                  </div>
                  {fc && !fc.ok && <p className="text-xs text-rose-500 mt-2">{fc.msg}</p>}
                  {r.note && <p className="text-sm text-slate-500 dark:text-slate-400 mt-2 border-t border-slate-100 dark:border-slate-700 pt-2">{r.note}</p>}
                  {(isAdmin || r.createdBy === user.uid) &&
                    <button onClick={() => { if (confirm("이 기록을 삭제할까요?")) deleteRecord(r.id); }} className="text-xs text-rose-400 mt-2">삭제</button>}
                </Card>
              );
            })}
          </div>
        )}

        <Modal open={open} onClose={() => setOpen(false)} title="🔬 초음파 기록 추가">
          <div className="space-y-3">
            <DateTimeField value={at} onChange={setAt} label="검사 날짜·시간" />
            <Field label="임신 주수 *"><input className={inputCls} type="number" inputMode="numeric" value={f.week} onChange={set("week")} placeholder="12" /></Field>
            {crl && <p className={`text-xs rounded-lg px-3 py-2 ${crl.ok ? "text-teal-600 bg-teal-50 dark:bg-teal-900/30" : "text-amber-600 bg-amber-50 dark:bg-amber-900/30"}`}>{crl.msg}</p>}
            <div className="grid grid-cols-2 gap-3">
              <Field label="CRL (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.crl} onChange={set("crl")} /></Field>
              <Field label="BPD (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.bpd} onChange={set("bpd")} /></Field>
              <Field label="HC (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.hc} onChange={set("hc")} /></Field>
              <Field label="AC (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.ac} onChange={set("ac")} /></Field>
              <Field label="FL (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.fl} onChange={set("fl")} /></Field>
              <Field label="추정체중 (g)"><input className={inputCls} type="number" inputMode="decimal" value={f.efw} onChange={set("efw")} /></Field>
              <Field label="심박수 (bpm)"><input className={inputCls} type="number" inputMode="numeric" value={f.fhr} onChange={set("fhr")} /></Field>
              <Field label="AFI (양수)"><input className={inputCls} type="number" inputMode="decimal" value={f.afi} onChange={set("afi")} /></Field>
            </div>
            {fhr && <p className={`text-xs rounded-lg px-3 py-2 ${fhr.ok ? "text-teal-600 bg-teal-50 dark:bg-teal-900/30" : "text-rose-600 bg-rose-50 dark:bg-rose-900/30"}`}>{fhr.msg}</p>}
            <Field label="소견 / 메모"><textarea className={inputCls} rows="3" value={f.note} onChange={set("note")} placeholder="검사 기록(혈액·기형아·임당검사 결과 등)도 함께 남겨보세요" /></Field>
            <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "기록 저장"}</Btn>
          </div>
        </Modal>
      </div>
    );
  };

  /* ========================================================================
     15. 공용 기록 리스트 (입력자/시각/삭제)
     ======================================================================== */
  // 기록 종류별 수정 가능한 필드 정의
  const numOrNull = (v) => (v === "" || v == null ? null : Number(v));
  const renderEditFields = (e, upd) => {
    const set = (k) => (ev) => upd({ ...e, [k]: ev.target.value });
    switch (e.type) {
      case "feeding": return (
        <>
          <ChipGroup label="수유 종류" value={e.kind} onChange={(v) => upd({ ...e, kind: v })}
            options={[{ value: "breast", label: "🤱 모유" }, { value: "formula", label: "🍼 분유" }, { value: "mixed", label: "🥛 혼합" }]} />
          {e.kind === "breast" && <ChipGroup label="위치" value={e.side || "left"} onChange={(v) => upd({ ...e, side: v })}
            options={[{ value: "left", label: "왼쪽" }, { value: "right", label: "오른쪽" }, { value: "both", label: "양쪽" }]} />}
          <div className="grid grid-cols-2 gap-3">
            <Field label="수유량 (ml)"><input className={inputCls} type="number" value={e.amount ?? ""} onChange={set("amount")} /></Field>
            <Field label="시간 (분)"><input className={inputCls} type="number" value={e.durationMin ?? ""} onChange={set("durationMin")} /></Field>
          </div>
        </>
      );
      case "diaper": return (
        <>
          <ChipGroup label="종류" value={e.diaperType} onChange={(v) => upd({ ...e, diaperType: v })}
            options={[{ value: "pee", label: "💧 소변" }, { value: "poo", label: "💩 대변" }, { value: "both", label: "💧💩 둘 다" }]} />
          <Field label="색상 메모"><input className={inputCls} value={e.color ?? ""} onChange={set("color")} /></Field>
        </>
      );
      case "growth": return (
        <div className="grid grid-cols-3 gap-2">
          <Field label="키 (cm)"><input className={inputCls} type="number" value={e.height ?? ""} onChange={set("height")} /></Field>
          <Field label="몸무게 (kg)"><input className={inputCls} type="number" value={e.weight ?? ""} onChange={set("weight")} /></Field>

  /* ========================================================================
     17. 이미지 압축 → base64 데이터URL (Firestore 무료 저장용) — 시니어 검토 #5
        Firestore 문서 1MB 한도 안에 들어가도록 화질/크기를 점진 축소
     ======================================================================== */
  const MAX_PHOTO_BYTES = 900 * 1024; // base64 길이 상한 (1MB 한도 대비 여유)
  const compressToDataURL = (file) =>
    new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const render = (maxDim, q) => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, width, height); // 투명 PNG 대비 흰 배경
          ctx.drawImage(img, 0, 0, width, height);
          return canvas.toDataURL("image/jpeg", q);
        };
        let maxDim = 1000, quality = 0.72;
        let dataUrl = render(maxDim, quality);
        // 1MB 안에 들어갈 때까지 점진적으로 줄이기
        let guard = 0;
        while (dataUrl.length > MAX_PHOTO_BYTES && guard < 10) {
          guard++;
          if (quality > 0.4) quality -= 0.1;
          else { maxDim = Math.round(maxDim * 0.85); quality = 0.6; }
          dataUrl = render(maxDim, quality);
        }
        if (dataUrl.length > MAX_PHOTO_BYTES) { reject(new Error("사진 용량이 너무 커요. 더 작은 사진을 사용해주세요.")); return; }
        resolve(dataUrl);
      };
      // HEIC 등 브라우저가 못 읽는 형식
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이 사진 형식을 읽을 수 없어요. (HEIC라면 설정에서 '호환성 우선'으로 촬영하거나 JPG로 변환해주세요)")); };
      img.src = url;
    });

  /* ========================================================================
     17-b. 사진 EXIF에서 촬영일·GPS 추출 (없으면 null)
     ======================================================================== */
  const readPhotoMeta = async (file) => {
    const meta = { takenAt: null, gps: null };
    try {
      if (window.exifr) {
        const tags = await window.exifr.parse(file, { pick: ["DateTimeOriginal", "CreateDate"] }).catch(() => null);
        if (tags) meta.takenAt = tags.DateTimeOriginal || tags.CreateDate || null;
        const g = await window.exifr.gps(file).catch(() => null);
        if (g && g.latitude != null && g.longitude != null) {
          meta.gps = { lat: +g.latitude.toFixed(6), lng: +g.longitude.toFixed(6) };
        }
      }
    } catch (e) { /* EXIF 없거나 읽기 실패 시 무시 */ }
    return meta;
  };

  /* ========================================================================
     18. 사진 업로드 모달
     ======================================================================== */
  const UploadModal = ({ open, onClose, defaultCategory = "baby" }) => {

    const [gps, setGps] = useState(null);         // {lat,lng}
    const [familyNames, setFamilyNames] = useState([]);
    const [progress, setProgress] = useState(null); // {done,total,pct}
    const inputRef = useRef();
    const camRef = useRef();

    useEffect(() => {
      if (!open) return;
      setFiles([]); setCaption(""); setCategory(defaultCategory); setProgress(null);
      setPeople([]); setPersonInput(""); setPlace(""); setTakenAt(toLocalInput(new Date())); setGps(null);
      // 가족 이름 후보 불러오기 (인물 태그용)

    }, [open]);

    const pick = async (e) => {
      const list = Array.from(e.target.files || []).slice(0, 5); // 최대 5장
      setFiles(list);
      if (list[0]) {
        // 첫 사진 EXIF에서 촬영일·GPS 자동 채우기
        const m = await readPhotoMeta(list[0]);
        if (m.takenAt) setTakenAt(toLocalInput(m.takenAt));
        if (m.gps) setGps(m.gps);
      }
    };

    const togglePerson = (name) => setPeople((p) => p.includes(name) ? p.filter((x) => x !== name) : [...p, name]);
    const addPerson = () => {
      const n = personInput.trim();
      if (n && !people.includes(n)) setPeople((p) => [...p, n]);
      setPersonInput("");
    };

    const upload = async () => {
      if (files.length === 0) { toast("사진을 선택하세요.", "error"); return; }
      setProgress({ done: 0, total: files.length, pct: 0 });
      const takenDate = fromLocalInput(takenAt);
      try {
        for (let i = 0; i < files.length; i++) {
          // 무료 방식: Storage 대신 Firestore에 압축 이미지(base64) 저장
          setProgress({ done: i, total: files.length, pct: 20 });
          const dataUrl = await compressToDataURL(files[i]);
          // 여러 장이면 각 사진별 EXIF 촬영일/GPS 우선 사용
          let perMeta = { takenAt: takenDate, gps };
          if (files.length > 1) {
            const m = await readPhotoMeta(files[i]);
            if (m.takenAt) perMeta.takenAt = m.takenAt;
            if (m.gps) perMeta.gps = m.gps;
          }
          setProgress({ done: i, total: files.length, pct: 70 });
          await COL.photos().add({
            uploadedBy: user.uid,
            uploaderName: (profile && profile.name) || (user.email || "").split("@")[0],
            url: dataUrl, caption: caption || "", category,
            people, place: place || "",
            placeLower: (place || "").toLowerCase(),
            gps: perMeta.gps || null,
            takenAt: perMeta.takenAt || takenDate,
            likeCount: 0, createdAt: TS(),
          });
          setProgress({ done: i, total: files.length, pct: 100 });
        }
        toast(`${files.length}장 업로드 완료!`, "success");
        onClose();
      } catch (e) { toast(errMsg(e), "error"); setProgress(null); }
    };

    return (
      <Modal open={open} onClose={onClose} title="📷 사진 업로드">
        <div className="space-y-4">
          {/* 앨범: capture 없음 → iOS에서 사진 보관함/파일 선택 가능 */}
          <input ref={inputRef} type="file" accept="image/*" multiple onChange={pick} className="hidden" />
          {/* 촬영: capture 지정 → 카메라 바로 열기 */}
          <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={pick} className="hidden" />
          <div className="grid grid-cols-2 gap-3">
            <button onClick={() => inputRef.current.click()}
              className="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl py-6 text-center text-slate-400 hover:border-teal-400 hover:text-teal-500 transition">
              <div className="text-3xl mb-1" aria-hidden="true">🖼️</div>
              <p className="text-sm">앨범에서 선택</p>
            </button>
            <button onClick={() => camRef.current.click()}
              className="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl py-6 text-center text-slate-400 hover:border-teal-400 hover:text-teal-500 transition">
              <div className="text-3xl mb-1" aria-hidden="true">📷</div>
              <p className="text-sm">사진 촬영</p>
            </button>
          </div>
          <p className="text-[11px] text-slate-400 text-center">최대 5장까지 업로드할 수 있어요</p>

          {files.length > 0 && (
            <div className="grid grid-cols-3 gap-2">
              {files.map((f, i) => <img key={i} src={URL.createObjectURL(f)} alt={`선택한 사진 ${i + 1}`} className="w-full aspect-square object-cover rounded-lg" />)}
            </div>
          )}

          <ChipGroup label="카테고리" value={category} onChange={setCategory}
            options={[{ value: "ultrasound", label: "초음파" }, { value: "baby", label: "아기사진" }, { value: "milestone", label: "성장기록" }]} />
          <Field label="캡션"><input className={inputCls} value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="사진 설명" /></Field>

          {/* 함께한 사람 (인물 태그) */}

              {familyNames.map((n) => (
                <button key={n} type="button" onClick={() => togglePerson(n)}
                  className={`px-3 py-1.5 rounded-full text-sm border ${people.includes(n)

                  <span key={n} className="px-3 py-1.5 rounded-full text-sm bg-violet-400 text-white flex items-center gap-1">
                    {n}<button type="button" onClick={() => togglePerson(n)} aria-label={`${n} 제거`}>×</button>
                  </span>
                ))}
              </div>
            )}
          </div>

          {/* 장소/지역 (날짜·지역 검색용) */}
          <Field label="장소 / 지역">
            <input className={inputCls} value={place} onChange={(e) => setPlace(e.target.value)} placeholder="예: 서울 할머니댁, 제주 여행" />

          {/* 촬영 시각 (EXIF 우선, 수정 가능) */}
          <DateTimeField value={takenAt} onChange={setTakenAt} label="촬영 시각" />
          <p className="text-[11px] text-slate-400">여러 장은 각 사진의 촬영정보(EXIF)가 있으면 자동 적용돼요.</p>

          {progress && (
            <div>
              <div className="flex justify-between text-xs text-slate-500 mb-1">
                <span>업로드 중 {progress.done + 1}/{progress.total}</span><span>{progress.pct}%</span>
              </div>
              <div className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                <div className="h-full bg-teal-500 transition-all" style={{ width: `${progress.pct}%` }} role="progressbar" aria-valuenow={progress.pct} aria-valuemin="0" aria-valuemax="100"></div>
              </div>
