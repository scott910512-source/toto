  };

  /* ========================================================================
     9. 수유 기록
     ======================================================================== */
  const FeedingTracker = () => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const items = useRecords("feeding");
    const [kind, setKind] = useState("breast"); // breast/formula/mixed
    const [side, setSide] = useState("left");
    const [amount, setAmount] = useState("");
    const [dur, setDur] = useState("");
    const [at, setAt] = useState(toLocalInput(new Date()));
    const [busy, setBusy] = useState(false);

    const save = async () => {
      setBusy(true);
      try {
        await addRecord("feeding", {
          kind, side: kind === "breast" ? side : null,
          amount: amount ? Number(amount) : null,
          durationMin: dur ? Number(dur) : null,
          at: fromLocalInput(at),
        }, user, profile);
        setAmount(""); setDur(""); setAt(toLocalInput(new Date()));
        toast("수유 기록을 추가했어요.", "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    const now = useNow(30000); // 30초마다 경과시간 갱신
    const last = items && items[0];
    const lastDate = last && toDate(last.at);
    const elapsedMin = lastDate ? Math.floor((now - lastDate) / 60000) : null;
    const overdue = elapsedMin != null && elapsedMin > 180;
    const kindLabel = { breast: "모유", formula: "분유", mixed: "혼합" };

    // 직전 수유와 동일하게 한 번 더 (야간 빠른 입력)
    const repeatLast = async () => {
      if (!last) return;
      setBusy(true);
      try {
        await addRecord("feeding", {
          kind: last.kind, side: last.side || null,
          amount: last.amount || null, durationMin: last.durationMin || null, at: TS(),
        }, user, profile);
        toast("직전 수유와 동일하게 기록했어요.", "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    return (
      <div className="space-y-4">
        {/* 경과 시간 */}
        {lastDate && (
          <Card className={`p-4 text-center ${overdue ? "ring-2 ring-amber-400" : ""}`}>
            <p className="text-sm text-slate-500 dark:text-slate-400">마지막 수유 경과</p>
            <p className={`text-2xl font-bold ${overdue ? "text-amber-500" : "text-teal-500"}`}>{hm(elapsedMin)}</p>
            <p className="text-[11px] text-slate-400">{kindLabel[last.kind]}{last.amount ? ` ${last.amount}ml` : ""} · {fmtTime(last.at)}</p>
            {overdue && <p className="text-xs text-amber-600 dark:text-amber-400 mt-1">⚠️ 3시간 초과 — 수유 시간을 확인해주세요</p>}
            <Btn variant="ghost" onClick={repeatLast} disabled={busy} className="w-full mt-3 text-sm py-2.5">🔁 직전과 동일하게 한 번 더</Btn>
          </Card>
        )}

        <Card className="p-4 space-y-4">
          <ChipGroup label="수유 종류" value={kind} onChange={setKind}
            options={[{ value: "breast", label: "🤱 모유" }, { value: "formula", label: "🍼 분유" }, { value: "mixed", label: "🥛 혼합" }]} />
          {kind === "breast" &&
            <ChipGroup label="수유 위치" value={side} onChange={setSide}
              options={[{ value: "left", label: "왼쪽" }, { value: "right", label: "오른쪽" }, { value: "both", label: "양쪽" }]} />}
          <div className="grid grid-cols-2 gap-3">
            <Field label="수유량 (ml)"><input className={inputCls} type="number" inputMode="numeric" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="120" /></Field>
            <Field label="시간 (분)"><input className={inputCls} type="number" inputMode="numeric" value={dur} onChange={(e) => setDur(e.target.value)} placeholder="15" /></Field>
          </div>
          <DateTimeField value={at} onChange={setAt} />
          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "수유 기록 저장"}</Btn>
        </Card>

        <RecordList items={items} render={(r) => (
          <>
            <span className="font-medium text-slate-800 dark:text-white">{kindLabel[r.kind]}{r.side && ` · ${{ left: "왼쪽", right: "오른쪽", both: "양쪽" }[r.side]}`}</span>
            {r.amount ? ` · ${r.amount}ml` : ""}{r.durationMin ? ` · ${r.durationMin}분` : ""}
          </>
        )} />
      </div>
    );
  };

  /* ========================================================================
     10. 수면 기록 (원탭 시작/종료 + 7일 그래프)
     ======================================================================== */
  const SleepTracker = () => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const items = useRecords("sleep");
    const now = useNow(1000); // 실시간 경과 타이머용 (1초)
    const [napKind, setNapKind] = useState("nap");
    const [busy, setBusy] = useState(false);
    // 직접 입력 모드
    const [manKind, setManKind] = useState("nap");
    const [manStart, setManStart] = useState(toLocalInput(new Date()));
    const [manEnd, setManEnd] = useState(toLocalInput(new Date()));

    const ongoing = items && items.find((r) => !r.end);

    const manualSave = async () => {
      const s = fromLocalInput(manStart), e = fromLocalInput(manEnd);
      if (e <= s) { toast("일어난 시간이 잠든 시간보다 뒤여야 해요.", "error"); return; }
      const min = Math.max(1, Math.round((e - s) / 60000));
      setBusy(true);
      try {
        await addRecord("sleep", { naptype: manKind, start: s, end: e, durationMin: min, at: s }, user, profile);
        toast(`수면 기록 추가 · ${hm(min)}`, "success");
        setManStart(toLocalInput(new Date())); setManEnd(toLocalInput(new Date()));
      } catch (ex) { toast(errMsg(ex), "error"); } finally { setBusy(false); }
    };

    const start = async () => {
      setBusy(true);
      try { await addRecord("sleep", { naptype: napKind, start: TS(), end: null, at: TS() }, user, profile); toast("수면을 시작했어요 😴", "success"); }
      catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };
    const stop = async () => {
      if (!ongoing) return;
      setBusy(true);
      try {
        const startD = toDate(ongoing.start);
        const min = Math.max(1, Math.round((Date.now() - startD) / 60000));
        await COL.records().doc(ongoing.id).update({ end: TS(), durationMin: min });
        toast(`수면 종료 · ${hm(min)}`, "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    // 최근 7일 합계
    const chartData = useMemo(() => {
      if (!items) return [];
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const key = ymd(d);
        const total = items.filter((r) => r.end && ymd(r.at) === key).reduce((s, r) => s + (r.durationMin || 0), 0);
        days.push({ day: d.toLocaleDateString("ko-KR", { weekday: "short" }), hours: +(total / 60).toFixed(1) });
      }
      return days;
    }, [items]);

    const todayMin = items ? items.filter((r) => r.end && isSameDay(r.at, new Date())).reduce((s, r) => s + (r.durationMin || 0), 0) : 0;
    const todayH = todayMin / 60;
    // 수면 안전: 신생아 14~17시간 권장 (육아 전문가 검토 #3)
    const sleepWarn = todayH > 0 && (todayH < 11 ? "부족" : todayH > 19 ? "과다" : null);

    return (
      <div className="space-y-4">
        <Card className="p-5 text-center">
          {ongoing ? (
            <>
              <p className="text-sm text-violet-500">😴 수면 중 · {napKindLabel(ongoing.naptype)}</p>
              <p className="text-xs text-slate-400 mt-1">{fmtTime(ongoing.start)} 시작</p>
              {(() => {
                const sec = Math.max(0, Math.floor((now - toDate(ongoing.start)) / 1000));
                const mm = Math.floor(sec / 60), ss = sec % 60;
                return <p className="text-4xl font-bold text-violet-500 my-2 tabular-nums" aria-live="polite">{String(mm).padStart(2, "0")}분 {String(ss).padStart(2, "0")}초</p>;
              })()}
              <Btn variant="lavender" onClick={stop} disabled={busy} className="w-full">😊 기상 (수면 종료)</Btn>
            </>
          ) : (
            <>
              <ChipGroup value={napKind} onChange={setNapKind}
                options={[{ value: "nap", label: "🌤️ 낮잠" }, { value: "night", label: "🌙 밤잠" }]} />
              <Btn variant="primary" onClick={start} disabled={busy} className="w-full mt-3">😴 수면 시작 (타이머)</Btn>
            </>
          )}
        </Card>

        {/* 직접 입력 (잠든 시간 / 일어난 시간) */}
        {!ongoing && (
          <Card className="p-4 space-y-3">
            <h3 className="font-bold text-slate-800 dark:text-white">⏱️ 시간 직접 입력</h3>
            <ChipGroup value={manKind} onChange={setManKind}
              options={[{ value: "nap", label: "🌤️ 낮잠" }, { value: "night", label: "🌙 밤잠" }]} />
            <DateTimeField value={manStart} onChange={setManStart} label="잠든 시간" />
            <DateTimeField value={manEnd} onChange={setManEnd} label="일어난 시간" />
            <Btn variant="lavender" onClick={manualSave} disabled={busy} className="w-full">{busy ? "저장 중..." : "수면 기록 저장"}</Btn>
          </Card>
        )}

        <Card className="p-4">
          <div className="flex items-center justify-between mb-1">
            <h3 className="font-bold text-slate-800 dark:text-white">오늘 총 수면</h3>
            <span className="font-bold text-teal-500">{hm(todayMin)}</span>
          </div>
          {sleepWarn && (
            <p className={`text-xs rounded-lg px-3 py-2 mt-1 ${sleepWarn === "부족" ? "text-amber-600 bg-amber-50 dark:bg-amber-900/30" : "text-sky-600 bg-sky-50 dark:bg-sky-900/30"}`}>
              {sleepWarn === "부족" ? "⚠️ 수면이 다소 부족할 수 있어요." : "ℹ️ 수면이 평균보다 많아요."} 신생아 권장 수면은 하루 14~17시간입니다.
            </p>
          )}
        </Card>

        <Card className="p-4">
          <h3 className="font-bold text-slate-800 dark:text-white mb-3">최근 7일 수면 (시간)</h3>
          <div style={{ width: "100%", height: 180 }}>
            <ResponsiveContainer>
              <BarChart data={chartData} margin={{ top: 5, right: 5, left: -20, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                <XAxis dataKey="day" tick={{ fontSize: 11 }} />
                <YAxis tick={{ fontSize: 11 }} />
                <Tooltip formatter={(v) => [`${v}시간`, "수면"]} />
                <ReferenceLine y={14} stroke="#34d399" strokeDasharray="4 4" label={{ value: "권장 14h", fontSize: 9, fill: "#34d399" }} />
                <Bar dataKey="hours" fill="#a78bfa" radius={[6, 6, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>

        <RecordList items={items} render={(r) => (
          <>{napKindLabel(r.naptype)} · {r.end ? hm(r.durationMin || 0) : <span className="text-violet-500">진행 중</span>}</>
        )} />
      </div>
    );
  };
  const napKindLabel = (t) => t === "night" ? "🌙 밤잠" : "🌤️ 낮잠";

  /* ========================================================================
     11. 기저귀 기록
     ======================================================================== */
  const DiaperTracker = () => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const items = useRecords("diaper");
    const [type, setType] = useState("pee");
    const [color, setColor] = useState("");
    const [at, setAt] = useState(toLocalInput(new Date()));
    const [busy, setBusy] = useState(false);

    // 비정상 색상/혈변 경고 키워드 (육아 전문가 검토 #6)
    const ABNORMAL = ["피", "혈", "빨강", "빨간", "검정", "검은", "흰", "하양", "회색"];
    const colorWarn = color && ABNORMAL.some((k) => color.includes(k));

    const save = async () => {
      setBusy(true);
      try {
        await addRecord("diaper", { diaperType: type, color: color || null, at: fromLocalInput(at) }, user, profile);
        setColor(""); setAt(toLocalInput(new Date()));
        toast("기저귀 기록을 추가했어요.", "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    const today = items ? items.filter((r) => isSameDay(r.at, new Date())) : [];
    // 24시간 소변 없음 경고 (육아 전문가 검토 #6)
    const lastPee = items && items.find((r) => r.diaperType === "pee" || r.diaperType === "both");
    const noPee24 = lastPee && (Date.now() - toDate(lastPee.at)) > 24 * 3600000;

    // 최근 7일 트렌드 (소변=pee+both, 대변=poo+both, 총합=전체)
    const trend = useMemo(() => {
      if (!items) return [];
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i); const key = ymd(d);
        const dayItems = items.filter((r) => ymd(r.at) === key);
        days.push({
          day: d.toLocaleDateString("ko-KR", { weekday: "short" }),
          소변: dayItems.filter((r) => r.diaperType === "pee" || r.diaperType === "both").length,
          대변: dayItems.filter((r) => r.diaperType === "poo" || r.diaperType === "both").length,
          총합: dayItems.length,
        });
      }
      return days;
    }, [items]);
    const peeCnt = today.filter((r) => r.diaperType === "pee" || r.diaperType === "both").length;
    const pooCnt = today.filter((r) => r.diaperType === "poo" || r.diaperType === "both").length;

    return (
      <div className="space-y-4">
        <div className="grid grid-cols-3 gap-2">
          <Card className="p-3 text-center"><p className="text-xs text-slate-400">오늘 소변</p><p className="text-xl font-bold text-sky-500">{peeCnt}회</p></Card>
          <Card className="p-3 text-center"><p className="text-xs text-slate-400">오늘 대변</p><p className="text-xl font-bold text-amber-600">{pooCnt}회</p></Card>
          <Card className="p-3 text-center"><p className="text-xs text-slate-400">총합</p><p className="text-xl font-bold text-slate-800 dark:text-white">{today.length}회</p></Card>
        </div>

        {/* 최근 7일 트렌드 */}
        <Card className="p-4">
          <h3 className="font-bold text-slate-800 dark:text-white mb-2">최근 7일 트렌드</h3>
          <div style={{ width: "100%", height: 180 }}>
            <ResponsiveContainer>
              <BarChart data={trend} margin={{ top: 5, right: 5, left: -24, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                <XAxis dataKey="day" tick={{ fontSize: 11 }} />
                <YAxis tick={{ fontSize: 11 }} allowDecimals={false} />
                <Tooltip />
                <Legend wrapperStyle={{ fontSize: 11 }} />
                <Bar dataKey="소변" fill="#38bdf8" radius={[3, 3, 0, 0]} />
                <Bar dataKey="대변" fill="#d97706" radius={[3, 3, 0, 0]} />
                <Bar dataKey="총합" fill="#a78bfa" radius={[3, 3, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>

        {noPee24 && <div role="alert" className="text-xs text-rose-600 bg-rose-50 dark:bg-rose-900/30 rounded-xl px-3 py-2.5">🚨 24시간 이상 소변 기록이 없습니다. 탈수 위험이 있으니 소아과 상담을 권장합니다.</div>}

        <Card className="p-4 space-y-4">
          <ChipGroup label="종류" value={type} onChange={setType}
            options={[{ value: "pee", label: "💧 소변" }, { value: "poo", label: "💩 대변" }, { value: "both", label: "💧💩 둘 다" }]} />
          <Field label="색상 메모 (선택)">
            <input className={inputCls} value={color} onChange={(e) => setColor(e.target.value)} placeholder="노란색, 황금색 등" />
          </Field>
          {colorWarn && <p role="alert" className="text-xs text-rose-600 bg-rose-50 dark:bg-rose-900/30 rounded-lg px-3 py-2">🚨 비정상 색상이 의심됩니다(혈변·흰색·검은색 변 등). 사진을 찍어 소아과 상담을 권장합니다.</p>}
          <DateTimeField value={at} onChange={setAt} />
          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "기저귀 기록"}</Btn>
        </Card>

        <RecordList items={items} render={(r) => (
          <>{{ pee: "💧 소변", poo: "💩 대변", both: "💧💩 둘 다" }[r.diaperType]}{r.color && ` · ${r.color}`}</>
        )} />
      </div>
    );
  };

  /* ========================================================================
     12. 성장 기록 (WHO 백분위 곡선 포함)
     ----------------------------------------------------------------------
     WHO Child Growth Standards 근사값 (월령: P3 / P50 / P97), 0~24개월. 참고용.
     ======================================================================== */
  // [month, P3, P50, P97]
  const WHO = {
    male: {
      weight: [[0,2.5,3.3,4.4],[1,3.4,4.5,5.8],[2,4.3,5.6,7.1],[3,5.0,6.4,8.0],[4,5.6,7.0,8.7],[5,6.0,7.5,9.3],[6,6.4,7.9,9.8],[9,7.1,8.9,11.0],[12,7.7,9.6,12.0],[18,8.8,10.9,13.7],[24,9.7,12.2,15.3]],
      height: [[0,46.3,49.9,53.4],[1,51.1,54.7,58.4],[2,54.7,58.4,62.2],[3,57.6,61.4,65.3],[6,63.3,67.6,71.9],[9,67.5,72.0,76.5],[12,71.0,75.7,80.5],[18,76.9,82.3,87.7],[24,81.7,87.8,93.9]],
    },
    female: {
      weight: [[0,2.4,3.2,4.2],[1,3.2,4.2,5.5],[2,3.9,5.1,6.6],[3,4.5,5.8,7.5],[4,5.0,6.4,8.2],[5,5.4,6.9,8.8],[6,5.7,7.3,9.3],[9,6.5,8.2,10.5],[12,7.0,8.9,11.5],[18,8.1,10.2,13.2],[24,9.0,11.5,14.8]],
      height: [[0,45.6,49.1,52.7],[1,50.0,53.7,57.4],[2,53.2,57.1,61.1],[3,55.8,59.8,63.9],[6,61.2,65.7,70.3],[9,65.3,70.1,75.0],[12,68.9,74.0,79.2],[18,74.9,80.7,86.5],[24,80.0,86.4,92.9]],
    },
  };
  // 선형보간으로 특정 월령의 [P3,P50,P97] 구하기
  const whoAt = (rows, m) => {
    if (m <= rows[0][0]) return rows[0].slice(1);
    if (m >= rows[rows.length - 1][0]) return rows[rows.length - 1].slice(1);
    for (let i = 0; i < rows.length - 1; i++) {
      const a = rows[i], b = rows[i + 1];
      if (m >= a[0] && m <= b[0]) {
        const t = (m - a[0]) / (b[0] - a[0]);
        return [1, 2, 3].map((k) => a[k] + (b[k] - a[k]) * t);
      }
    }
    return rows[rows.length - 1].slice(1);
  };
  // 측정값의 대략적 백분위 추정 (P3/P50/P97 구간 선형 근사)
  const estPercentile = (rows, m, v) => {
    if (v == null) return null;
    const [p3, p50, p97] = whoAt(rows, m);
    let pct;
    if (v <= p3) pct = 3 * (v / p3);
    else if (v <= p50) pct = 3 + (50 - 3) * (v - p3) / (p50 - p3);
    else if (v <= p97) pct = 50 + (97 - 50) * (v - p50) / (p97 - p50);
    else pct = 97 + (v - p97) / p97 * 100;
    return Math.max(0, Math.min(100, Math.round(pct)));
  };

  const GrowthTracker = () => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const baby = useBaby();
    const items = useRecords("growth", 100);
    const [height, setHeight] = useState("");
    const [weight, setWeight] = useState("");
    const [head, setHead] = useState("");
    const [at, setAt] = useState(toLocalInput(new Date()));
    const [busy, setBusy] = useState(false);
    const [metric, setMetric] = useState("weight"); // weight | height

    const save = async () => {
      if (!height && !weight && !head) { toast("측정값을 하나 이상 입력하세요.", "error"); return; }
      setBusy(true);
      try {
        await addRecord("growth", {
          height: height ? Number(height) : null,
          weight: weight ? Number(weight) : null,
          head: head ? Number(head) : null, at: fromLocalInput(at),
        }, user, profile);
        setHeight(""); setWeight(""); setHead(""); setAt(toLocalInput(new Date()));
        toast("성장 기록을 추가했어요.", "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    // 월령 계산 (출생일 기준)
    const ageMonthsAt = (d) => baby.birthDate ? (toDate(d) - new Date(baby.birthDate)) / (86400000 * 30.4375) : null;
    const whoRows = baby.sex && WHO[baby.sex] ? WHO[baby.sex][metric] : null;

    // 차트 데이터: WHO 곡선 점 + 아기 측정점을 월령(x) 기준으로 병합
    const chartData = useMemo(() => {
      if (!whoRows) return null;
      const rows = whoRows.map((r) => ({ m: r[0], p3: r[1], p50: r[2], p97: r[3] }));
      const pts = [];
      (items || []).forEach((r) => {
        const v = r[metric]; const m = ageMonthsAt(r.at);
        if (v != null && m != null && m >= 0 && m <= 24) pts.push({ m: +m.toFixed(2), baby: v });
      });
      return [...rows, ...pts].sort((a, b) => a.m - b.m);
    }, [items, metric, whoRows, baby.birthDate]);

    // 최신 측정의 백분위
    const latest = items && items.find((r) => r[metric] != null);
    const latestM = latest ? ageMonthsAt(latest.at) : null;
    const pct = (whoRows && latest && latestM != null && latestM >= 0 && latestM <= 24)
      ? estPercentile(whoRows, latestM, latest[metric]) : null;

    // 백업: 성별/출생일 없을 때 날짜 기준 단순 그래프
    const simpleData = useMemo(() => (items ? [...items].reverse().map((r) => ({ date: fmtDate(r.at), weight: r.weight, height: r.height })) : []), [items]);
    const unit = metric === "weight" ? "kg" : "cm";

    return (
      <div className="space-y-4">
        <Card className="p-4 space-y-3">
          <div className="grid grid-cols-3 gap-2">
            <Field label="키 (cm)"><input className={inputCls} type="number" inputMode="decimal" value={height} onChange={(e) => setHeight(e.target.value)} placeholder="50" /></Field>
            <Field label="몸무게 (kg)"><input className={inputCls} type="number" inputMode="decimal" value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="3.4" /></Field>
            <Field label="머리둘레"><input className={inputCls} type="number" inputMode="decimal" value={head} onChange={(e) => setHead(e.target.value)} placeholder="35" /></Field>
          </div>
          <DateTimeField value={at} onChange={setAt} label="측정 시간" />
          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "성장 기록 추가"}</Btn>
        </Card>

        <Card className="p-4">
          <div className="flex items-center justify-between mb-1">
            <h3 className="font-bold text-slate-800 dark:text-white">WHO 성장 백분위</h3>
            <ChipGroup value={metric} onChange={setMetric}
              options={[{ value: "weight", label: "몸무게" }, { value: "height", label: "키" }]} />
          </div>

          {!whoRows ? (
            <div className="text-sm text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700/40 rounded-xl p-3 my-2">
              WHO 백분위 곡선을 보려면 <b>설정 → 아기 정보</b>에서 <b>출생일</b>과 <b>성별</b>을 입력해주세요.
            </div>
          ) : (
            <>
              {pct != null && (
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">
                  최근 {metric === "weight" ? "몸무게" : "키"} <b>{latest[metric]}{unit}</b> · 또래 약 <b className="text-teal-600">{pct}백분위</b>
                  {(pct < 3 || pct > 97) && <span className="text-amber-600"> · 소아과 상담 권장</span>}
                </p>
              )}
              <p className="text-[11px] text-slate-400 mb-2">회색 곡선: WHO 3/50/97 백분위(참고용) · 점선: 우리 아기</p>
              <div style={{ width: "100%", height: 220 }}>
                <ResponsiveContainer>
                  <LineChart data={chartData} margin={{ top: 5, right: 8, left: -20, bottom: 0 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                    <XAxis dataKey="m" type="number" domain={[0, 24]} ticks={[0, 3, 6, 9, 12, 18, 24]} tick={{ fontSize: 10 }} label={{ value: "개월", position: "insideBottomRight", fontSize: 9, offset: -2 }} />
                    <YAxis tick={{ fontSize: 11 }} domain={["auto", "auto"]} />
                    <Tooltip formatter={(v, n) => [v + unit, ({ p3: "3백분위", p50: "50백분위", p97: "97백분위", baby: "우리아기" })[n] || n]} labelFormatter={(l) => `${l}개월`} />
                    <Line type="monotone" dataKey="p97" stroke="#cbd5e1" strokeWidth={1} dot={false} connectNulls />
                    <Line type="monotone" dataKey="p50" stroke="#94a3b8" strokeWidth={1} strokeDasharray="4 3" dot={false} connectNulls />
                    <Line type="monotone" dataKey="p3" stroke="#cbd5e1" strokeWidth={1} dot={false} connectNulls />
                    <Line type="monotone" dataKey="baby" stroke="#14b8a6" strokeWidth={2.5} dot={{ r: 4 }} connectNulls />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </>
          )}
        </Card>

        {/* 성별/출생일 없을 때 단순 추이 */}
        {!whoRows && (
          <Card className="p-4">
            <h3 className="font-bold text-slate-800 dark:text-white mb-2">{metric === "weight" ? "몸무게" : "키"} 추이 ({unit})</h3>
            <div style={{ width: "100%", height: 180 }}>
              <ResponsiveContainer>
                <LineChart data={simpleData} margin={{ top: 5, right: 5, left: -20, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                  <XAxis dataKey="date" tick={{ fontSize: 10 }} />
                  <YAxis tick={{ fontSize: 11 }} domain={["auto", "auto"]} />
                  <Tooltip />
                  <Line type="monotone" dataKey={metric} stroke="#14b8a6" strokeWidth={2} dot={{ r: 3 }} connectNulls />
                </LineChart>
              </ResponsiveContainer>
            </div>
          </Card>
        )}

        <RecordList items={items} render={(r) => (
          <>{r.height ? `키 ${r.height}cm ` : ""}{r.weight ? `몸무게 ${r.weight}kg ` : ""}{r.head ? `머리 ${r.head}cm` : ""}</>
        )} />
      </div>
    );
  };

  /* ========================================================================
     13. 건강 기록 (체온 + 증상 + 예방접종)
     ======================================================================== */
  // 체온 단계 (육아 전문가 검토 #4)
  const tempStage = (t) => {
    if (t == null) return null;
    if (t < 36.0) return { label: "저체온", color: "text-sky-600", bg: "bg-sky-50 dark:bg-sky-900/30", msg: "체온이 낮습니다. 보온 후에도 지속되면 소아과 상담을 권장합니다." };
    if (t <= 37.5) return { label: "정상", color: "text-teal-600", bg: "bg-teal-50 dark:bg-teal-900/30", msg: "정상 범위입니다 (36.5~37.5℃)." };
    if (t < 38.0) return { label: "미열", color: "text-amber-600", bg: "bg-amber-50 dark:bg-amber-900/30", msg: "미열입니다. 경과를 지켜봐주세요." };
    return { label: "발열", color: "text-rose-600", bg: "bg-rose-50 dark:bg-rose-900/30", msg: "🚨 발열입니다(38℃ 이상). 생후 3개월 미만이면 즉시 소아과 진료를 권장합니다." };
  };

  // 예방접종 표준 일정 (질병관리청 표준예방접종일정 기준 요약)
  const VACCINES = [
    { age: "출생~4주", items: ["B형간염 1차", "BCG(결핵)"] },
    { age: "1개월", items: ["B형간염 2차"] },
    { age: "2개월", items: ["DTaP 1차", "IPV(폴리오) 1차", "Hib 1차", "폐렴구균 1차", "로타바이러스 1차"] },
    { age: "4개월", items: ["DTaP 2차", "IPV 2차", "Hib 2차", "폐렴구균 2차", "로타바이러스 2차"] },
    { age: "6개월", items: ["DTaP 3차", "IPV 3차", "Hib 3차", "폐렴구균 3차", "B형간염 3차", "로타바이러스 3차(해당 백신)", "인플루엔자(매년)"] },
    { age: "12~15개월", items: ["MMR 1차", "수두", "Hib 4차", "폐렴구균 4차", "A형간염 1차", "일본뇌염 1차"] },
    { age: "15~18개월", items: ["DTaP 4차"] },
    { age: "24~35개월", items: ["A형간염 2차", "일본뇌염 추가"] },
    { age: "만 4~6세", items: ["DTaP 5차", "IPV 4차", "MMR 2차"] },
  ];

  const HealthLog = () => {
    const { user, profile } = useAuth();
    const toast = useToast();
    const items = useRecords("health", 100);
    const [temp, setTemp] = useState("");
    const [symptom, setSymptom] = useState("");
    const [hospital, setHospital] = useState("");
    const [at, setAt] = useState(toLocalInput(new Date()));
    const [busy, setBusy] = useState(false);
    const [vacDone, setVacDone] = useState({});

    // 예방접종 체크 상태 settings/baby 에 저장 (공유)
    useEffect(() => {
      const unsub = COL.settings().onSnapshot((s) => setVacDone((s.data() && s.data().vaccines) || {}));
      return () => unsub();
    }, []);
    const toggleVac = async (name) => {
      const next = { ...vacDone, [name]: !vacDone[name] };
      try { await COL.settings().set({ vaccines: next }, { merge: true }); }
      catch (e) { toast(errMsg(e), "error"); }
    };

    const stage = temp ? tempStage(Number(temp)) : null;
    const save = async () => {
      if (!temp && !symptom && !hospital) { toast("기록할 내용을 입력하세요.", "error"); return; }
      setBusy(true);
      try {
        await addRecord("health", {
          temp: temp ? Number(temp) : null, symptom: symptom || null, hospital: hospital || null, at: fromLocalInput(at),
        }, user, profile);
        setTemp(""); setSymptom(""); setHospital(""); setAt(toLocalInput(new Date()));
        toast("건강 기록을 추가했어요.", "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    return (
      <div className="space-y-4">
        <MedicalDisclaimer />
        <Card className="p-4 space-y-3">
          <Field label="체온 (℃)">
            <input className={inputCls} type="number" inputMode="decimal" step="0.1" value={temp} onChange={(e) => setTemp(e.target.value)} placeholder="36.8" />
          </Field>
          {stage && <p role="alert" className={`text-sm rounded-lg px-3 py-2 ${stage.bg} ${stage.color}`}><b>{stage.label}</b> · {stage.msg}</p>}
          <Field label="증상 메모"><input className={inputCls} value={symptom} onChange={(e) => setSymptom(e.target.value)} placeholder="콧물, 기침 등" /></Field>
          <Field label="병원 방문 기록"><input className={inputCls} value={hospital} onChange={(e) => setHospital(e.target.value)} placeholder="○○소아과 방문, 처방 등" /></Field>
          <DateTimeField value={at} onChange={setAt} label="기록 시간" />
          <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "건강 기록 추가"}</Btn>
        </Card>

        {/* 체온 차트 */}
        {items && items.some((r) => r.temp) && (
          <Card className="p-4">
            <h3 className="font-bold text-slate-800 dark:text-white mb-2">체온 추이 (℃)</h3>
            <div style={{ width: "100%", height: 170 }}>
              <ResponsiveContainer>
                <LineChart data={[...items].filter((r) => r.temp).reverse().map((r) => ({ date: fmtDate(r.at), temp: r.temp }))} margin={{ top: 5, right: 5, left: -20, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                  <XAxis dataKey="date" tick={{ fontSize: 10 }} />
                  <YAxis domain={[35, 40]} tick={{ fontSize: 11 }} />
                  <Tooltip />
                  <ReferenceLine y={38} stroke="#f43f5e" strokeDasharray="4 4" label={{ value: "발열 38℃", fontSize: 9, fill: "#f43f5e" }} />
                  <ReferenceLine y={37.5} stroke="#f59e0b" strokeDasharray="4 4" />
                  <Line type="monotone" dataKey="temp" stroke="#14b8a6" strokeWidth={2} dot={{ r: 3 }} />
                </LineChart>
              </ResponsiveContainer>
            </div>
          </Card>
        )}

        {/* 예방접종 체크리스트 */}
        <Card className="p-4">
          <h3 className="font-bold text-slate-800 dark:text-white mb-1">예방접종 체크리스트</h3>
          <p className="text-[11px] text-slate-400 mb-3">질병관리청 표준예방접종일정 기준 (참고용)</p>
          <div className="space-y-3">
            {VACCINES.map((g) => (
              <div key={g.age}>
                <p className="text-xs font-semibold text-teal-600 dark:text-teal-400 mb-1.5">{g.age}</p>
                <div className="space-y-1.5">
                  {g.items.map((v) => {
                    const key = `${g.age}|${v}`;
                    const done = !!vacDone[key];
                    return (
                      <label key={key} className="flex items-center gap-2.5 cursor-pointer">
                        <input type="checkbox" checked={done} onChange={() => toggleVac(key)}
                          className="w-5 h-5 rounded accent-teal-500" aria-label={`${v} 접종 완료`} />
                        <span className={`text-sm ${done ? "line-through text-slate-400" : "text-slate-700 dark:text-slate-200"}`}>{v}</span>
                      </label>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </Card>

        <RecordList items={items} render={(r) => (
          <>{r.temp ? `🌡️ ${r.temp}℃ ` : ""}{r.symptom ? `· ${r.symptom} ` : ""}{r.hospital ? `· 🏥 ${r.hospital}` : ""}</>
        )} />
      </div>
    );
  };

  /* ========================================================================
     14. 임신 초기 기록 (초음파 + 검사 + 타임라인)
     ======================================================================== */
  // CRL 유효 주수 안내 (육아 전문가 검토 #1)
  const crlGuide = (week) => {
    if (week == null || week === "") return null;
    const w = Number(week);
    if (w >= 6 && w <= 13) return { ok: true, msg: "CRL(머리-엉덩이 길이)은 임신 6~13주 주수 측정에 가장 정확합니다." };
    return { ok: false, msg: "CRL은 보통 6~13주에만 측정합니다. 13주 이후엔 BPD/HC/AC/FL로 주수·체중을 추정합니다." };
  };
  // 태아 심박수 정상 범위 120~160 bpm (육아 전문가 검토 #1)
  const fhrCheck = (bpm) => {
    if (!bpm) return null;
    const v = Number(bpm);
    if (v >= 120 && v <= 160) return { ok: true, msg: "정상 범위(120~160 bpm)입니다." };
    return { ok: false, msg: "⚠️ 정상 범위(120~160 bpm)를 벗어났습니다. 산부인과 상담을 권장합니다." };
  };

  const PrenatalTracker = ({ openUpload }) => {
    const { user, profile, isAdmin } = useAuth();
    const toast = useToast();
    const items = useRecords("prenatal", 100);
    const photos = usePhotos(200);
    const usPhotos = (photos || []).filter((p) => p.category === "ultrasound" && canSeePhoto(p, user.uid, isAdmin))
      .sort((a, b) => toDate(b.takenAt || b.createdAt) - toDate(a.takenAt || a.createdAt));
    const [detail, setDetail] = useState(null);
    const [open, setOpen] = useState(false);
    const [f, setF] = useState({ week: "", crl: "", bpd: "", hc: "", ac: "", fl: "", efw: "", fhr: "", afi: "", note: "" });
    const [at, setAt] = useState(toLocalInput(new Date()));
    const [busy, setBusy] = useState(false);
    const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));

    const crl = crlGuide(f.week);
    const fhr = fhrCheck(f.fhr);

    const save = async () => {
      if (!f.week) { toast("임신 주수를 입력하세요.", "error"); return; }
      setBusy(true);
      try {
        const data = {};
        Object.keys(f).forEach((k) => { data[k] = f[k] === "" ? null : (k === "note" ? f[k] : Number(f[k])); });
        await addRecord("prenatal", { ...data, at: fromLocalInput(at) }, user, profile);
        setOpen(false);
        setF({ week: "", crl: "", bpd: "", hc: "", ac: "", fl: "", efw: "", fhr: "", afi: "", note: "" });
        setAt(toLocalInput(new Date()));
        toast("초음파 기록을 추가했어요.", "success");
      } catch (e) { toast(errMsg(e), "error"); } finally { setBusy(false); }
    };

    const sorted = items ? [...items].sort((a, b) => (a.week || 0) - (b.week || 0)) : null;

    return (
      <div className="space-y-4">
        <MedicalDisclaimer />
        <div className="grid grid-cols-2 gap-3">
          <Btn onClick={() => setOpen(true)}>🔬 초음파 기록</Btn>
          <Btn variant="lavender" onClick={openUpload}>📷 초음파 사진</Btn>
        </div>

        {/* 초음파 사진 (이 페이지에서만 관리, 갤러리·관람전용엔 노출 안 됨) */}
        {usPhotos.length > 0 && (
          <Card className="p-3">
            <h3 className="text-sm font-bold text-slate-700 dark:text-slate-200 mb-2 px-1">🖼️ 초음파 사진 {usPhotos.length}장</h3>
            <div className="grid grid-cols-3 gap-2">
              {usPhotos.map((p, i) => (
                <button key={p.id} onClick={() => setDetail(i)} className="block" aria-label="초음파 사진 열기">
                  <img src={p.url} alt={p.caption || "초음파"} loading="lazy" className="w-full aspect-square object-cover rounded-lg bg-slate-100 dark:bg-slate-700" />
                </button>
              ))}
            </div>
          </Card>
        )}
        {detail != null && (
          <PhotoDetail list={usPhotos} index={detail} setIndex={setDetail} uid={user.uid} saved={new Set()} onClose={() => setDetail(null)} />
        )}

        {/* 주수별 타임라인 */}
        {!sorted ? <Spinner /> : sorted.length === 0 ? (
          <Card className="p-6 text-center text-sm text-slate-400">아직 초음파 기록이 없어요.</Card>
        ) : (
          <div className="space-y-3">
            {sorted.map((r) => {
              const fc = fhrCheck(r.fhr);
              return (
                <Card key={r.id} className="p-4">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-base font-bold text-violet-500">임신 {r.week}주</span>
                    <span className="text-xs text-slate-400">{fmtDate(r.at)} · {r.creatorName}</span>
                  </div>
                  <div className="grid grid-cols-3 gap-x-2 gap-y-1 text-sm text-slate-600 dark:text-slate-300">
                    {r.crl != null && <span>CRL {r.crl}mm</span>}
                    {r.bpd != null && <span>BPD {r.bpd}mm</span>}
                    {r.hc != null && <span>HC {r.hc}mm</span>}
                    {r.ac != null && <span>AC {r.ac}mm</span>}
                    {r.fl != null && <span>FL {r.fl}mm</span>}
                    {r.fhr != null && <span>심박 {r.fhr}bpm</span>}
                    {r.afi != null && <span>AFI {r.afi}</span>}
                    {r.efw != null && <span className="col-span-3">추정체중 {r.efw}g <span className="text-[11px] text-amber-500">(±15~20% 오차)</span></span>}
                  </div>
                  {fc && !fc.ok && <p className="text-xs text-rose-500 mt-2">{fc.msg}</p>}
                  {r.note && <p className="text-sm text-slate-500 dark:text-slate-400 mt-2 border-t border-slate-100 dark:border-slate-700 pt-2">{r.note}</p>}
                  {(isAdmin || r.createdBy === user.uid) &&
                    <button onClick={() => { if (confirm("이 기록을 삭제할까요?")) deleteRecord(r.id); }} className="text-xs text-rose-400 mt-2">삭제</button>}
                </Card>
              );
            })}
          </div>
        )}

        <Modal open={open} onClose={() => setOpen(false)} title="🔬 초음파 기록 추가">
          <div className="space-y-3">
            <DateTimeField value={at} onChange={setAt} label="검사 날짜·시간" />
            <Field label="임신 주수 *"><input className={inputCls} type="number" inputMode="numeric" value={f.week} onChange={set("week")} placeholder="12" /></Field>
            {crl && <p className={`text-xs rounded-lg px-3 py-2 ${crl.ok ? "text-teal-600 bg-teal-50 dark:bg-teal-900/30" : "text-amber-600 bg-amber-50 dark:bg-amber-900/30"}`}>{crl.msg}</p>}
            <div className="grid grid-cols-2 gap-3">
              <Field label="CRL (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.crl} onChange={set("crl")} /></Field>
              <Field label="BPD (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.bpd} onChange={set("bpd")} /></Field>
              <Field label="HC (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.hc} onChange={set("hc")} /></Field>
              <Field label="AC (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.ac} onChange={set("ac")} /></Field>
              <Field label="FL (mm)"><input className={inputCls} type="number" inputMode="decimal" value={f.fl} onChange={set("fl")} /></Field>
              <Field label="추정체중 (g)"><input className={inputCls} type="number" inputMode="decimal" value={f.efw} onChange={set("efw")} /></Field>
              <Field label="심박수 (bpm)"><input className={inputCls} type="number" inputMode="numeric" value={f.fhr} onChange={set("fhr")} /></Field>
              <Field label="AFI (양수)"><input className={inputCls} type="number" inputMode="decimal" value={f.afi} onChange={set("afi")} /></Field>
            </div>
            {fhr && <p className={`text-xs rounded-lg px-3 py-2 ${fhr.ok ? "text-teal-600 bg-teal-50 dark:bg-teal-900/30" : "text-rose-600 bg-rose-50 dark:bg-rose-900/30"}`}>{fhr.msg}</p>}
            <Field label="소견 / 메모"><textarea className={inputCls} rows="3" value={f.note} onChange={set("note")} placeholder="검사 기록(혈액·기형아·임당검사 결과 등)도 함께 남겨보세요" /></Field>
            <Btn onClick={save} disabled={busy} className="w-full">{busy ? "저장 중..." : "기록 저장"}</Btn>
          </div>
        </Modal>
      </div>
    );
  };

  /* ========================================================================
     15. 공용 기록 리스트 (입력자/시각/삭제)
     ======================================================================== */
  // 기록 종류별 수정 가능한 필드 정의
  const numOrNull = (v) => (v === "" || v == null ? null : Number(v));
  const renderEditFields = (e, upd) => {
    const set = (k) => (ev) => upd({ ...e, [k]: ev.target.value });
    switch (e.type) {
      case "feeding": return (
        <>
          <ChipGroup label="수유 종류" value={e.kind} onChange={(v) => upd({ ...e, kind: v })}
            options={[{ value: "breast", label: "🤱 모유" }, { value: "formula", label: "🍼 분유" }, { value: "mixed", label: "🥛 혼합" }]} />
          {e.kind === "breast" && <ChipGroup label="위치" value={e.side || "left"} onChange={(v) => upd({ ...e, side: v })}
            options={[{ value: "left", label: "왼쪽" }, { value: "right", label: "오른쪽" }, { value: "both", label: "양쪽" }]} />}
          <div className="grid grid-cols-2 gap-3">
            <Field label="수유량 (ml)"><input className={inputCls} type="number" value={e.amount ?? ""} onChange={set("amount")} /></Field>
            <Field label="시간 (분)"><input className={inputCls} type="number" value={e.durationMin ?? ""} onChange={set("durationMin")} /></Field>
          </div>
        </>
      );
      case "diaper": return (
        <>
          <ChipGroup label="종류" value={e.diaperType} onChange={(v) => upd({ ...e, diaperType: v })}
            options={[{ value: "pee", label: "💧 소변" }, { value: "poo", label: "💩 대변" }, { value: "both", label: "💧💩 둘 다" }]} />
          <Field label="색상 메모"><input className={inputCls} value={e.color ?? ""} onChange={set("color")} /></Field>
        </>
      );
      case "growth": return (
        <div className="grid grid-cols-3 gap-2">
          <Field label="키 (cm)"><input className={inputCls} type="number" value={e.height ?? ""} onChange={set("height")} /></Field>
          <Field label="몸무게 (kg)"><input className={inputCls} type="number" value={e.weight ?? ""} onChange={set("weight")} /></Field>
          <Field label="머리둘레"><input className={inputCls} type="number" value={e.head ?? ""} onChange={set("head")} /></Field>
        </div>
      );
      case "health": return (
        <>
          <Field label="체온 (℃)"><input className={inputCls} type="number" step="0.1" value={e.temp ?? ""} onChange={set("temp")} /></Field>
          <Field label="증상 메모"><input className={inputCls} value={e.symptom ?? ""} onChange={set("symptom")} /></Field>
          <Field label="병원 방문"><input className={inputCls} value={e.hospital ?? ""} onChange={set("hospital")} /></Field>
        </>
      );
      case "sleep": return (
        <>
          <ChipGroup label="구분" value={e.naptype || "nap"} onChange={(v) => upd({ ...e, naptype: v })}
            options={[{ value: "nap", label: "🌤️ 낮잠" }, { value: "night", label: "🌙 밤잠" }]} />
          <DateTimeField value={e.start || ""} onChange={(v) => upd({ ...e, start: v })} label="잠든 시간" />
          {e.end !== undefined && <DateTimeField value={e.end || ""} onChange={(v) => upd({ ...e, end: v })} label="일어난 시간" />}
        </>
      );
      default: return null;
    }
  };
  const buildEditUpdate = (e) => {
    const at = fromLocalInput(e.at);
    switch (e.type) {
      case "feeding": return { at, kind: e.kind, side: e.kind === "breast" ? (e.side || "left") : null, amount: numOrNull(e.amount), durationMin: numOrNull(e.durationMin) };
      case "diaper": return { at, diaperType: e.diaperType, color: e.color || null };
      case "growth": return { at, height: numOrNull(e.height), weight: numOrNull(e.weight), head: numOrNull(e.head) };
      case "health": return { at, temp: numOrNull(e.temp), symptom: e.symptom || null, hospital: e.hospital || null };
      case "sleep": {
        const s = e.start ? fromLocalInput(e.start) : at;
        const en = e.end ? fromLocalInput(e.end) : null;
        const durationMin = en ? Math.max(1, Math.round((en - s) / 60000)) : null;
        return { at: s, start: s, end: en, durationMin, naptype: e.naptype || "nap" };
      }
      default: return { at };
    }
  };

  const RecordList = ({ items, render }) => {
    const { user, isAdmin } = useAuth();
    const toast = useToast();
    const [editing, setEditing] = useState(null); // 수정 중인 기록(복사본)
    if (!items) return <Spinner />;
    if (items.length === 0) return <Card className="p-6 text-center text-sm text-slate-400">아직 기록이 없어요.</Card>;

    const saveEdit = async () => {
      try { await COL.records().doc(editing.id).update(buildEditUpdate(editing)); toast("기록을 수정했어요.", "success"); setEditing(null); }
      catch (e) { toast(errMsg(e), "error"); }
    };

    return (
      <Card className="p-2">
        <ul className="divide-y divide-slate-100 dark:divide-slate-700">
          {items.slice(0, 50).map((r) => {
            const mine = isAdmin || r.createdBy === user.uid;
            return (
              <li key={r.id} className="flex items-center gap-2 px-2 py-3">
                <div className="flex-1 min-w-0">
                  <p className="text-sm text-slate-700 dark:text-slate-200 truncate">{render(r)}</p>
                  <p className="text-[11px] text-slate-400">{fmtDateTime(r.at)} · {r.creatorName}</p>
                </div>
                {mine && (
                  <button onClick={() => setEditing({ ...r, at: toLocalInput(r.at),
                    ...(r.start != null ? { start: toLocalInput(r.start) } : {}),
                    ...(r.end != null ? { end: toLocalInput(r.end) } : { end: r.type === "sleep" ? "" : undefined }) })}
                    aria-label="기록 수정" className="text-slate-300 hover:text-teal-500 text-base px-1">✏️</button>
                )}
                {mine && (
                  <button onClick={() => { if (confirm("삭제할까요?")) deleteRecord(r.id); }}
                    aria-label="기록 삭제" className="text-slate-300 hover:text-rose-500 text-base px-1">🗑️</button>
                )}
              </li>
            );
          })}
        </ul>

        <Modal open={!!editing} onClose={() => setEditing(null)} title="기록 수정">
          {editing && (
